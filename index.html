<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJSekaiChartMaker - プロセカ譜面動画 変換ソフト</title>
<style>
  :root {
    --primary: #00d4d4;
    --primary-dark: #009999;
    --bg: #0f131d;
    --card: #192030;
    --text: #f0f4f8;
    --muted: #9aa5b8;
    --accent: #ff4d88;
    --border: #2e3954;
  }
  * { box-sizing: border-box; font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif; }
  body {
    margin: 0; padding: 16px 20px;
    background-color: var(--bg); color: var(--text);
    line-height: 1.55;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(135deg, #182540 0%, #101a2e 100%);
    padding: 14px 20px; border-radius: 12px;
    border: 1px solid var(--border); margin-bottom: 14px;
    flex-wrap: wrap; gap: 12px;
  }
  header h1 { margin: 0; font-size: 1.3rem; color: #fff; }
  .step-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 16px;
  }
  .btn {
    background: var(--primary); color: #001818; border: none;
    padding: 8px 15px; border-radius: 8px; font-weight: bold;
    cursor: pointer; font-size: 0.9rem; transition: 0.18s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: #33ecec; transform: translateY(-1px); }
  .btn:disabled { background: #3c445c; color: #7c869e; cursor: not-allowed; transform: none; }
  .btn-secondary { background: #28324a; color: #fff; border: 1px solid #3f4e70; }
  .btn-secondary:hover { background: #344160; }
  .btn-secondary.active { background: var(--primary); color: #001818; border-color: var(--primary); }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: #ff709f; }
  .btn-danger { background: #e63946; color: #fff; }
  .btn-danger:hover { background: #ff525f; }

  /* 生成中のロック表示用スタイル */
  .locked-during-gen {
    pointer-events: none !important;
    opacity: 0.42 !important;
    user-select: none !important;
  }

  /* プレビュー上部のフォルダ一括切り替えバー */
  .top-switcher-card {
    background: #141b2b; border: 2px solid #00a8a8;
    border-radius: 12px; padding: 12px 16px; margin-bottom: 14px;
    transition: opacity 0.2s;
  }
  .switcher-header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px;
  }
  .folder-tabs {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding-top: 10px; margin-top: 8px; border-top: 1px solid var(--border);
  }
  .folder-set-btn {
    background: #222c42; color: #e2e8f0; border: 1px solid #3a496b;
    padding: 7px 15px; border-radius: 8px; font-size: 0.9rem;
    cursor: pointer; white-space: nowrap; transition: 0.15s; font-weight: bold;
  }
  .folder-set-btn:hover { background: #2e3c59; transform: translateY(-1px); }
  .folder-set-btn.active {
    background: var(--primary); color: #001818; border-color: var(--primary);
    box-shadow: 0 0 12px rgba(0, 212, 212, 0.35);
  }
  .folder-set-btn.unprocessed {
    border-color: var(--accent);
  }

  /* 動画プレビュー（上部） */
  .preview-wrapper {
    position: relative; background: #000; border-radius: 8px;
    overflow: hidden; border: 1px solid var(--border);
    display: flex; justify-content: center; align-items: center;
    min-height: 200px; max-height: 310px;
  }
  #videoPreview { display: none; }
  #previewCanvas { max-width: 100%; max-height: 300px; display: block; }

  /* 再生ボタン＆シークバー（常時表示） */
  .main-transport-bar {
    display: flex; align-items: center; gap: 10px;
    background: #121724; padding: 10px 14px; border-radius: 8px;
    border: 1px solid #222b40; margin-top: 10px; flex-wrap: wrap;
    transition: opacity 0.2s;
  }
  .main-transport-bar input[type="range"] {
    flex: 1; min-width: 140px; accent-color: var(--primary); cursor: pointer;
  }

  /* 常時表示パネル共通 */
  .always-panel {
    margin-top: 10px; background: #121724; padding: 12px 14px;
    border-radius: 8px; border: 1px solid #222b40;
  }

  /* 詳細設定の折りたたみタブ */
  .details-tab-wrap {
    margin-top: 10px; background: #121724; border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; transition: opacity 0.2s;
  }
  .details-tab-summary {
    padding: 9px 14px; cursor: pointer; font-weight: bold;
    color: var(--primary); font-size: 0.92rem; user-select: none;
    background: #161d2e; display: flex; justify-content: space-between; align-items: center;
    list-style: none;
  }
  .details-tab-summary::-webkit-details-marker { display: none; }
  .details-tab-summary:hover { background: #1c253b; }
  .details-tab-body {
    padding: 14px; border-top: 1px solid var(--border);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  .control-group { margin-bottom: 12px; background: #0e131f; padding: 12px 14px; border-radius: 8px; border: 1px solid #222b40; }
  .control-group label { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 5px; font-weight: bold; }
  .control-group input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; }
  .inline-inputs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .num-input, select.num-input {
    background: #0a0e17; color: #fff; border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 6px; width: 92px; font-size: 0.92rem;
  }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-weight: bold; color: #55ffaa; font-size: 0.92rem; margin-bottom: 8px;
  }
  .checkbox-row input { width: 17px; height: 17px; accent-color: var(--primary); cursor: pointer; }

  .progress-container {
    display: none; margin-top: 10px; background: #0b0f18;
    border-radius: 8px; padding: 10px 12px; border: 1px solid var(--border);
  }
  .progress-bar-bg { width: 100%; height: 12px; background: #1e2638; border-radius: 6px; overflow: hidden; margin-top: 6px; }
  .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), #55ffaa); transition: width 0.08s; }

  /* 静止画プレビューの上：常時表示ツールバー（生成中も操作可能） */
  .viewer-top-controls {
    margin-top: 12px; background: #141a29; border: 2px solid var(--border);
    border-bottom: none; border-radius: 10px 10px 0 0; padding: 10px 14px;
  }
  .viewer-col-jumps {
    display: none; gap: 6px; align-items: center; overflow-x: auto;
    padding-top: 8px; margin-top: 8px; border-top: 1px solid #26314d;
  }

  /* 静止画プレビュー本体（生成中も操作可能） */
  .viewer-box {
    position: relative; background: #07090e; border: 2px solid var(--border);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .viewer-box.fullscreen {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 9999; margin: 0; border-radius: 0; border: none;
  }
  .exit-fullscreen-btn {
    display: none; position: fixed; top: 16px; right: 20px;
    z-index: 10001; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.75);
    padding: 10px 18px; font-size: 0.95rem;
  }
  .viewer-box.fullscreen .exit-fullscreen-btn {
    display: inline-flex;
  }

  .viewer-viewport {
    position: relative; width: 100%; height: 580px; overflow: hidden;
    cursor: grab; background: #000; user-select: none;
  }
  .viewer-box.fullscreen .viewer-viewport { height: 100vh; }
  .viewer-viewport.dragging { cursor: grabbing; }
  #canvasStage {
    transform-origin: 0 0;
    position: absolute; top: 0; left: 0;
    box-shadow: 0 0 25px rgba(0,0,0,0.8);
    will-change: transform;
  }
  #outputCanvas { display: block; }

  /* 軽量化されたGPUアクセラレーション再生位置バー */
  #playheadColHighlight {
    position: absolute; top: 0; left: 0;
    border: 3px solid rgba(255, 77, 136, 0.55);
    pointer-events: none; display: none;
    will-change: transform, width, height;
  }
  #playheadBar {
    position: absolute; top: 0; left: 0; height: 16px; margin-top: -8px;
    background: rgba(255, 50, 110, 0.22);
    pointer-events: none; display: none;
    will-change: transform, width;
  }
  #playheadBar::after {
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: 3px; margin-top: -1.5px; background: #ff2a6d;
  }
  #playheadTimeBadge {
    position: absolute; left: 0; top: -4px;
    background: #ff2a6d; color: #fff; font-weight: bold;
    font-size: 12px; line-height: 22px; padding: 0 8px;
    border-radius: 3px; white-space: nowrap; z-index: 2;
  }

  /* 静止画プレビューの下：常時表示保存バー */
  .viewer-bottom-save-bar {
    background: #141a29; border: 2px solid var(--border);
    border-top: none; border-radius: 0 0 10px 10px; padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; transition: opacity 0.2s;
  }

  .hint { font-size: 0.82rem; color: var(--muted); }
</style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>プロセカ譜面動画 静止画メーカー</h1>
    </div>
    <div id="headerControls" style="display:flex; gap:8px; flex-wrap:wrap; transition:opacity 0.2s;">
      <button class="btn" id="linkRootFolderBtn">同階層フォルダを登録（自動読み込み・自動保存設定）</button>
      <button class="btn btn-secondary" id="selectFolderBtn">フォルダ選択</button>
      <button class="btn btn-secondary" id="selectVideoBtn">動画選択</button>
      <button class="btn btn-secondary" id="selectImagesBtn">画像選択</button>
      <input type="file" id="videoInput" accept="video/*" multiple style="display:none;">
      <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none;">
      <input type="file" id="imagesInput" accept="image/*" multiple style="display:none;">
    </div>
  </header>

  <!-- プレビュー最上部：フォルダ切り替えバー（フォルダ名ボタン1つで動画と静止画を同時に切り替え） -->
  <div class="top-switcher-card" id="topSwitcherCard">
    <div class="switcher-header">
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <strong style="color:var(--primary); font-size:0.95rem;">フォルダ・ファイル切り替えバー</strong>
        <span class="hint" id="folderStatusLabel">右上の「同階層フォルダを登録」で index.html のあるフォルダを選ぶと、フォルダの自動読み込み・静止画と設定の自動保存が有効になります</span>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="btn btn-accent" id="reconnectFolderBtn" style="display:none; padding:6px 14px; font-size:0.85rem;">同階層フォルダを自動読み込み</button>
        <button class="btn btn-secondary" id="refreshFolderBtn" style="display:none; padding:5px 11px; font-size:0.82rem;">再スキャン</button>
      </div>
    </div>

    <div id="switcherContent" style="display:none;">
      <div class="folder-tabs" id="folderTabs"></div>
    </div>
  </div>

  <!-- 動画プレビューと静止画プレビューを統合したメイン枠 -->
  <div class="step-card" id="unifiedPreviewCard">

    <!-- 1. 上部：動画プレビュー -->
    <div class="preview-wrapper">
      <video id="videoPreview" playsinline></video>
      <canvas id="previewCanvas" width="640" height="360"></canvas>
    </div>

    <!-- 2. 再生ボタン・再生速度（倍速/低速）＆ シークバー（常時表示・生成中はロック） -->
    <div class="main-transport-bar" id="mainTransportBar">
      <button class="btn" id="playPauseBtn" style="padding:7px 16px;">再生 / 一時停止</button>
      <div style="display:flex; align-items:center; gap:5px; background:#0b0f19; padding:4px 9px; border-radius:6px; border:1px solid #26314d;">
        <span style="font-size:0.82rem; color:var(--muted); white-space:nowrap;">再生速度:</span>
        <select id="playbackRateSelect" class="num-input" style="width:105px; padding:3px 6px; font-size:0.85rem;">
          <option value="0.25">0.25倍 (極低速)</option>
          <option value="0.5">0.5倍 (低速)</option>
          <option value="0.75">0.75倍 (やや低速)</option>
          <option value="1" selected>1.0倍 (標準)</option>
          <option value="1.25">1.25倍</option>
          <option value="1.5">1.5倍 (高速)</option>
          <option value="2">2.0倍 (倍速)</option>
        </select>
      </div>
      <input type="range" id="seekSlider" min="0" max="100" step="0.02" value="0">
      <span id="currentTimeLabel" style="font-size:0.88rem; font-weight:bold; min-width:135px; text-align:right;">0.00 秒 / 0.00 秒</span>
    </div>

    <!-- 3. 静止画の作成・停止・複数動画一括処理・高さ変更再生成パネル（常時表示） -->
    <div class="always-panel" style="border-color:#00a8a8;">
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;">
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <div id="genActionGroup" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; transition:opacity 0.2s;">
            <button class="btn btn-accent" id="generateBtn" disabled>現在の動画から静止画を作成</button>
            <button class="btn" id="batchGenerateBtn" disabled>未作成の複数動画を一括作成</button>
            <button class="btn btn-secondary" id="testGenerateBtn" disabled>最初の12秒だけテスト作成</button>
          </div>
          <button class="btn btn-danger" id="stopGenerateBtn" disabled>生成を停止</button>
        </div>
        <div id="reLayoutActionGroup" style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; transition:opacity 0.2s;">
          <span style="font-size:0.88rem; font-weight:bold; color:#55ffaa;">1列の高さ(px):</span>
          <input type="number" id="colHeightInput" class="num-input" step="100" min="400" max="16000" value="5400" style="width:90px;">
          <select id="layoutMode" class="num-input" style="width:185px;">
            <option value="grid" selected>1枚の一覧画像に折り返して並べる</option>
            <option value="single">折り返さずに1本の縦長画像にする</option>
          </select>
          <button class="btn btn-secondary" id="reLayoutBtn" disabled>高さを変更して再生成</button>
        </div>
      </div>
    </div>

    <!-- 進捗バー（生成処理中のみ表示） -->
    <div class="progress-container" id="progressContainer">
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.88rem; gap:10px;">
        <span id="progressText">譜面を合成しています...</span>
        <div style="display:flex; align-items:center; gap:10px;">
          <span id="progressPercent" style="font-weight:bold;">0%</span>
          <button class="btn btn-danger" id="progressStopBtn" style="padding:4px 10px; font-size:0.8rem;">停止</button>
        </div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- 4. 詳細設定タブ（切り抜き範囲・解像度・黒背景フィルター・固定スクロール速度） -->
    <details class="details-tab-wrap" id="detailsTab">
      <summary class="details-tab-summary">
        <span>詳細設定を開く / 閉じる</span>
        <span class="hint" id="currentViewFileName"></span>
      </summary>

      <div class="details-tab-body">
        <div class="grid-2">
          <div>
            <!-- 時間と左右切り抜き（デフォルト：時間=動画全体 / 左右=左18%〜右78.5%） -->
            <div class="control-group">
              <label><span>合成する時間範囲 ＆ 左右の切り抜き範囲</span></label>
              <div class="inline-inputs">
                <span>開始(秒):</span>
                <input type="number" id="startTimeInput" class="num-input" step="0.1" value="0.0">
                <button class="btn btn-secondary" id="setStartBtn" style="padding:5px 9px; font-size:0.8rem;">今の位置を開始</button>
              </div>
              <div class="inline-inputs" style="margin-top:6px;">
                <span>終了(秒):</span>
                <input type="number" id="endTimeInput" class="num-input" step="0.1" value="0.0">
                <button class="btn btn-secondary" id="setEndBtn" style="padding:5px 9px; font-size:0.8rem;">今の位置を終了</button>
              </div>
              <div class="inline-inputs" style="margin-top:8px;">
                <span style="width:65px; font-size:0.85rem;">左端 <span id="leftVal">18.0</span>%:</span>
                <input type="range" id="cropLeftSlider" min="0" max="45" step="0.5" value="18" style="flex:1;">
                <span style="width:72px; font-size:0.85rem;">右端 <span id="rightVal">78.5</span>%:</span>
                <input type="range" id="cropRightSlider" min="55" max="100" step="0.5" value="78.5" style="flex:1;">
              </div>
            </div>

            <!-- 処理・出力の解像度設定（精度最優先でデフォルトは原寸100%） -->
            <div class="control-group">
              <label>
                <span>処理・出力の解像度</span>
                <span class="hint" id="deviceSpecBadge"></span>
              </label>
              <div class="inline-inputs">
                <select id="resolutionSelect" class="num-input" style="width:100%;">
                  <option value="original" selected>原寸 100%（元動画の解像度のまま・最高精度）</option>
                  <option value="1080">高画質（高さ最大 1080px 相当）</option>
                  <option value="720">標準（高さ最大 720px 相当）</option>
                  <option value="560">軽量（高さ最大 560px 相当・メモリ節約）</option>
                </select>
              </div>
            </div>
          </div>

          <div>
            <!-- 黒背景フィルター設定 -->
            <div class="control-group">
              <label class="checkbox-row">
                <input type="checkbox" id="blackBgToggle" checked>
                <span>背景イラストを消して見やすくする</span>
              </label>
              <div id="blackBgControls">
                <label>
                  <span>背景消去しきい値（イラストの除去強度）</span>
                  <span id="bgThreshLabel">36</span>
                </label>
                <input type="range" id="bgThreshSlider" min="25" max="110" step="1" value="36">
                <label style="margin-top:6px;">
                  <span>16分音符の横線・レーン縦線のくっきり度</span>
                  <span id="gridBoostLabel">0.5倍</span>
                </label>
                <input type="range" id="gridBoostSlider" min="0.5" max="3.5" step="0.1" value="0.5">
              </div>
            </div>

            <!-- スクロール速度（1つの基準速度で固定） -->
            <div class="control-group">
              <label>
                <span>スクロール速度（画面高さに対する % / 秒）</span>
                <span id="speedValLabel">47.50 %/秒</span>
              </label>
              <input type="range" id="speedSlider" min="15" max="110" step="0.02" value="47.50">
              <div class="inline-inputs" style="justify-content: space-between;">
                <div>
                  <span>微調整:</span>
                  <input type="number" id="speedInput" class="num-input" step="0.02" value="47.50">
                </div>
                <button class="btn btn-secondary" id="autoSpeedBtn" style="padding:6px 12px; font-size:0.84rem;">速度を自動計測する</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </details>

    <!-- 5. 静止画プレビューの上：静止画ビューアー表示操作・再生ボタン・倍速/低速・バー遅延調整（常時表示） -->
    <div class="viewer-top-controls" id="viewerTopControls">
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:space-between;">
        <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
          <strong style="color:var(--primary); font-size:0.9rem; margin-right:2px;">ビューアー操作:</strong>
          <button class="btn" id="viewerPlayPauseBtn" style="padding:5px 14px; font-size:0.86rem;">再生 / 一時停止</button>
          <select id="viewerPlaybackRateSelect" class="num-input" title="再生速度（倍速・低速）" style="width:96px; padding:4px 6px; font-size:0.82rem;">
            <option value="0.25">0.25倍速</option>
            <option value="0.5">0.5倍速</option>
            <option value="0.75">0.75倍速</option>
            <option value="1" selected>1.0倍速</option>
            <option value="1.25">1.25倍速</option>
            <option value="1.5">1.5倍速</option>
            <option value="2">2.0倍速</option>
          </select>
          <button class="btn btn-secondary" id="zoomOutBtn" style="padding:5px 10px;">ー 縮小</button>
          <span id="zoomLevelLabel" style="min-width:52px; text-align:center; font-weight:bold;">100%</span>
          <button class="btn btn-secondary" id="zoomInBtn" style="padding:5px 10px;">＋ 拡大</button>
          <button class="btn btn-secondary" id="fitAllBtn" style="padding:5px 10px; font-size:0.84rem;">全体を表示</button>
          <button class="btn btn-secondary" id="fitHeightBtn" style="padding:5px 10px; font-size:0.84rem;">高さに合わせる</button>

// =========================================================
// 1. ZIPファイル生成エンジン（フォールバック安全機構付き）
// =========================================================
const CRC32_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[i] = c >>> 0;
  }
  return table;
})();

function crc32(u8) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) crc = (crc >>> 8) ^ CRC32_TABLE[(crc ^ u8[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function createZipBlob(files) {
  const encoder = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  for (const file of files) {
    const nameBytes = encoder.encode(file.name);
    const dataBytes = (file.data instanceof Uint8Array) ? file.data : encoder.encode(file.data);
    const crc = crc32(dataBytes);
    const size = dataBytes.length;

    const lfh = new Uint8Array(30 + nameBytes.length);
    const lfv = new DataView(lfh.buffer);
    lfv.setUint32(0, 0x04034b50, true);
    lfv.setUint16(4, 20, true);
    lfv.setUint16(6, 0x0800, true);
    lfv.setUint16(8, 0, true);
    lfv.setUint16(10, 0, true);
    lfv.setUint16(12, 0x5421, true);
    lfv.setUint32(14, crc, true);
    lfv.setUint32(18, size, true);
    lfv.setUint32(22, size, true);
    lfv.setUint16(26, nameBytes.length, true);
    lfv.setUint16(28, 0, true);
    lfh.set(nameBytes, 30);
    localParts.push(lfh, dataBytes);

    const cdh = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(cdh.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0x0800, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, 0, true);
    cdv.setUint16(14, 0x5421, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, size, true);
    cdv.setUint32(24, size, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    cdh.set(nameBytes, 46);

    centralParts.push(cdh);
    offset += lfh.length + size;
  }

  let cdSize = 0;
  for (const part of centralParts) cdSize += part.length;

  const eocd = new Uint8Array(22);
  const eocdv = new DataView(eocd.buffer);
  eocdv.setUint32(0, 0x06054b50, true);
  eocdv.setUint16(8, files.length, true);
  eocdv.setUint16(10, files.length, true);
  eocdv.setUint32(12, cdSize, true);
  eocdv.setUint32(16, offset, true);

  return new Blob([...localParts, ...centralParts, eocd], { type: "application/zip" });
}

function downloadBlob(blob, filename) {
  if (!blob) return;
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

function canvasToBlobSafe(canvas) {
  return new Promise((resolve) => {
    try {
      canvas.toBlob((blob) => {
        if (blob) {
          resolve(blob);
          return;
        }
        try {
          const dataUrl = canvas.toDataURL("image/png");
          const binStr = atob(dataUrl.split(",")[1] || "");
          const u8 = new Uint8Array(binStr.length);
          for (let i = 0; i < binStr.length; i++) u8[i] = binStr.charCodeAt(i);
          resolve(new Blob([u8], { type: "image/png" }));
        } catch (err2) {
          resolve(null);
        }
      }, "image/png");
    } catch (err) {
      resolve(null);
    }
  });
}

async function canvasToUint8Array(canvas) {
  const blob = await canvasToBlobSafe(canvas);
  if (!blob) return new Uint8Array(0);
  const buf = await blob.arrayBuffer();
  return new Uint8Array(buf);
}

// =========================================================
// 2. ノーツの上下フチ削れ（極細化）を防ぐ黒背景フィルター
// =========================================================
const blackBgToggle = document.getElementById("blackBgToggle");
const bgThreshSlider = document.getElementById("bgThreshSlider");
const bgThreshLabel = document.getElementById("bgThreshLabel");
const gridBoostSlider = document.getElementById("gridBoostSlider");
const gridBoostLabel = document.getElementById("gridBoostLabel");

function applyBlackBackgroundFilter(ctx, width, height) {
  if (!blackBgToggle.checked || width <= 0 || height <= 0) return;

  const thresh = parseInt(bgThreshSlider.value, 10) || 36;
  const gridBoost = parseFloat(gridBoostSlider.value) || 0.5;

  const imgData = ctx.getImageData(0, 0, width, height);
  const data = imgData.data;
  const totalPixels = width * height;

  const bgLum = new Float32Array(totalPixels);
  for (let i = 0, p = 0; p < totalPixels; i += 4, p++) {
    const l = data[i] * 0.25 + data[i + 1] * 0.45 + data[i + 2] * 0.30;
    bgLum[p] = l > 85 ? 85 : l;
  }

  for (let y = 0; y < height; y++) {
    const yUp = (y > 1 ? y - 2 : 0) * width;
    const yDown = (y < height - 2 ? y + 2 : height - 1) * width;
    const yUp1 = (y > 0 ? y - 1 : 0) * width;
    const yDown1 = (y < height - 1 ? y + 1 : height - 1) * width;
    const rowOffset = y * width;

    for (let x = 0; x < width; x++) {
      const p = rowOffset + x;
      const idx = p << 2;
      const r = data[idx];
      const g = data[idx + 1];
      const b = data[idx + 2];

      const maxC = r > g ? (r > b ? r : b) : (g > b ? g : b);
      const minC = r < g ? (r < b ? r : b) : (g < b ? g : b);
      const sat = maxC - minC;

      const isNoteOrEdge =
        (maxC > thresh + 14) ||
        (g > thresh - 2 && g >= r - 8) ||
        (sat > 26 && maxC > thresh - 10);

      if (isNoteOrEdge) {
        let alpha = (maxC - (thresh - 20)) * 0.035;
        if (alpha > 1.0) alpha = 1.0;
        else if (alpha < 0.55) alpha = 0.55;
        const boost = maxC < 130 ? alpha * 1.12 : alpha;
        data[idx]     = r * boost > 255 ? 255 : r * boost;
        data[idx + 1] = g * boost > 255 ? 255 : g * boost;
        data[idx + 2] = b * boost > 255 ? 255 : b * boost;
      } else {
        const rawLum = r * 0.25 + g * 0.45 + b * 0.30;
        const vBg = (bgLum[yUp + x] + bgLum[yDown + x]) * 0.5;
        const h1 = rawLum - vBg;
        const h2 = (bgLum[yUp1 + x] + bgLum[yDown1 + x]) * 0.5 - vBg;
        const hLinePeak = h1 > h2 ? (h1 > 0 ? h1 : 0) : (h2 > 0 ? h2 : 0);

        const xLeft = x > 1 ? x - 2 : 0;
        const xRight = x < width - 2 ? x + 2 : width - 1;
        const hBg = (bgLum[rowOffset + xLeft] + bgLum[rowOffset + xRight]) * 0.5;
        const vLinePeak = (rawLum - hBg) * 0.9;

        const lineStrength = hLinePeak > vLinePeak ? hLinePeak : vLinePeak;

        if (lineStrength > 2.0) {
          let lineVal = (lineStrength * 8.5 * gridBoost) | 0;
          if (lineVal > 220) lineVal = 220;
          data[idx]     = (lineVal * 0.78) | 0;
          data[idx + 1] = (lineVal * 0.88) | 0;
          data[idx + 2] = lineVal;
        } else {
          data[idx]     = 0;
          data[idx + 1] = 0;
          data[idx + 2] = 0;
        }
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);
}

// =========================================================
// 静止画へのタイムスタンプ埋め込み（ステガノグラフィ）＆ 抽出エンジン
// =========================================================
// 生成した静止画の最後の1行に目に見えない形でタイムスタンプ配列を直接埋め込み、
// 後からPNG画像を読み込んだだけでも裏でタイムスタンプが100%復元されるようにする
const STEGO_MAGIC = "PJSK_TS1:";

function embedTimestampsIntoCanvas(canvas, metaObj) {
  if (!canvas || canvas.width < 64 || canvas.height < 10) return;
  try {
    const compactMap = [];
    const srcMap = metaObj.timeToYMap || [];
    const step = Math.max(1, Math.floor(srcMap.length / 350));
    for (let i = 0; i < srcMap.length; i += step) {
      compactMap.push([Number(srcMap[i].time.toFixed(3)), Math.round(srcMap[i].bottomY)]);
    }
    if (srcMap.length > 0) {
      const last = srcMap[srcMap.length - 1];
      compactMap.push([Number(last.time.toFixed(3)), Math.round(last.bottomY)]);
    }

    const payload = JSON.stringify({
      th: Math.round(metaObj.totalHeight || 0),
      bb: Math.round(metaObj.bottomBaseH || 0),
      tc: Math.round(metaObj.topCapH || 0),
      ts: Number((metaObj.tStart || 0).toFixed(3)),
      te: Number((metaObj.tEnd || 0).toFixed(3)),
      m: compactMap
    });
    const fullStr = STEGO_MAGIC + payload;
    const bytes = new TextEncoder().encode(fullStr);
    const totalLen = bytes.length;

    const maxBytesCapacity = Math.floor((canvas.width * 3) / 4) - 4;
    if (totalLen > maxBytesCapacity) return;

    const ctx = canvas.getContext("2d");
    const y = canvas.height - 1;
    const rowImg = ctx.getImageData(0, y, canvas.width, 1);
    const data = rowImg.data;

    // 先頭16ピクセルにデータ長 (32bit) を2bitずつ埋め込む
    for (let b = 0; b < 16; b++) {
      const twoBits = (totalLen >>> (b * 2)) & 0x03;
      const idx = b * 4;
      data[idx] = (data[idx] & 0xFC) | twoBits;
      data[idx + 3] = 255;
    }

    // 16ピクセル目以降にバイト列を1ピクセルあたり4bit（Rに2bit、Gに2bit）埋め込む
    for (let i = 0; i < totalLen; i++) {
      const byteVal = bytes[i];
      const p1 = 16 + i * 2;
      const p2 = p1 + 1;
      const idx1 = p1 * 4;
      const idx2 = p2 * 4;
      data[idx1]     = (data[idx1] & 0xFC) | (byteVal & 0x03);
      data[idx1 + 1] = (data[idx1 + 1] & 0xFC) | ((byteVal >>> 2) & 0x03);
      data[idx1 + 3] = 255;
      data[idx2]     = (data[idx2] & 0xFC) | ((byteVal >>> 4) & 0x03);
      data[idx2 + 1] = (data[idx2 + 1] & 0xFC) | ((byteVal >>> 6) & 0x03);
      data[idx2 + 3] = 255;
    }

    ctx.putImageData(rowImg, 0, y);
  } catch (e) {}
}

function extractTimestampsFromCanvas(ctx, width, height) {
  if (width < 64 || height < 10) return null;
  try {
    const y = height - 1;
    const data = ctx.getImageData(0, y, width, 1).data;

    let totalLen = 0;
    for (let b = 0; b < 16; b++) {
      const twoBits = data[b * 4] & 0x03;
      totalLen |= (twoBits << (b * 2));
    }

    const maxBytesCapacity = Math.floor((width * 3) / 4) - 4;
    if (totalLen <= STEGO_MAGIC.length || totalLen > maxBytesCapacity) return null;

    const bytes = new Uint8Array(totalLen);
    for (let i = 0; i < totalLen; i++) {
      const p1 = 16 + i * 2;
      const p2 = p1 + 1;
      const idx1 = p1 * 4;
      const idx2 = p2 * 4;
      const b0 = data[idx1] & 0x03;
      const b1 = data[idx1 + 1] & 0x03;
      const b2 = data[idx2] & 0x03;
      const b3 = data[idx2 + 1] & 0x03;
      bytes[i] = b0 | (b1 << 2) | (b2 << 4) | (b3 << 6);
    }

    const str = new TextDecoder().decode(bytes);
    if (!str.startsWith(STEGO_MAGIC)) return null;

    const parsed = JSON.parse(str.slice(STEGO_MAGIC.length));
    if (!parsed || !Array.isArray(parsed.m)) return null;

    return {
      totalHeight: parsed.th,
      bottomBaseH: parsed.bb,
      topCapH: parsed.tc,
      tStart: parsed.ts,
      tEnd: parsed.te,
      timeToYMap: parsed.m.map(pair => ({ time: pair[0], bottomY: pair[1] }))
    };
  } catch (e) {
    return null;
  }
}

function saveTimestampProfileForFolder(folderName, metaObj) {
  if (!folderName || !metaObj || !metaObj.timeToYMap || metaObj.timeToYMap.length < 2) return;
  const compact = [];
  const src = metaObj.timeToYMap;
  const step = Math.max(1, Math.floor(src.length / 400));
  for (let i = 0; i < src.length; i += step) {
    compact.push({ time: Number(src[i].time.toFixed(3)), bottomY: Math.round(src[i].bottomY) });
  }
  const last = src[src.length - 1];
  if (compact[compact.length - 1].time !== Number(last.time.toFixed(3))) {
    compact.push({ time: Number(last.time.toFixed(3)), bottomY: Math.round(last.bottomY) });
  }

  savedTimestampsByFolder[folderName] = {
    totalHeight: Math.round(metaObj.totalHeight || 0),
    bottomBaseH: Math.round(metaObj.bottomBaseH || 0),
    topCapH: Math.round(metaObj.topCapH || 0),
    tStart: Number((metaObj.tStart || 0).toFixed(3)),
    tEnd: Number((metaObj.tEnd || 0).toFixed(3)),
    timeToYMap: compact
  };
  scheduleSaveSettings();
}

// =========================================================
// 再生中のリアルタイムズレ検知＆滑らかなバー位置修正用の「静止画視覚シグネチャ」構築関数
// =========================================================
function buildChartVisualSignatureFromMaster() {
  if (!masterChartData.hasData || !masterChartData.chunks || masterChartData.chunks.length === 0) {
    chartVisualSignature = null;
    return;
  }
  const { cropW, totalHeight, chunks } = masterChartData;
  const sig = new Float32Array(totalHeight);
  const xStart = Math.max(2, Math.floor(cropW * 0.08));
  const xEnd = Math.min(cropW - 2, Math.floor(cropW * 0.92));
  const sampleCount = Math.max(1, Math.floor((xEnd - xStart) / 4));

  for (let k = 0; k < chunks.length; k++) {
    const ch = chunks[k];
    if (!ch || !ch.width || !ch.height) continue;
    const ctx = ch.getContext("2d", { willReadFrequently: true });
    const imgData = ctx.getImageData(0, 0, cropW, MASTER_CHUNK_H).data;
    const chunkBottomStart = k * MASTER_CHUNK_H;

    for (let localY = 0; localY < MASTER_CHUNK_H; localY++) {
      const bottomY = chunkBottomStart + (MASTER_CHUNK_H - 1 - localY);
      if (bottomY < 0 || bottomY >= totalHeight) continue;

      const rowOff = localY * cropW;
      let valSum = 0;
      for (let x = xStart; x < xEnd; x += 4) {
        const idx = (rowOff + x) << 2;
        const r = imgData[idx], g = imgData[idx + 1], b = imgData[idx + 2];
        const maxC = r > g ? (r > b ? r : b) : (g > b ? g : b);
        const minC = r < g ? (r < b ? r : b) : (g < b ? g : b);
        // ノーツの彩度・輝度・小節線を強く反映した特徴値
        valSum += maxC + (maxC - minC) * 1.2;
      }
      sig[bottomY] = valSum / sampleCount;
    }
  }
  chartVisualSignature = sig;
  smoothedDriftOffsetY = 0;
  targetDriftOffsetY = 0;
}

// 再生中に現在の動画フレームと静止画のシグネチャを比較し、ズレ量 targetDriftOffsetY を算出する関数
function updateLivePlayheadDriftCorrection(nominalBottomY) {
  if (!chartVisualSignature || !video.videoWidth || isGenerating) return;
  const now = performance.now();
  // 負荷をかけないよう約85ms（秒間約12回）間隔で裏照合を実行
  if (now - lastSyncCheckWallTime < 85) return;
  lastSyncCheckWallTime = now;

  const totalH = chartVisualSignature.length;
  const bandHalfH = 28; // 基準ライン(capY)の上下28px（計56pxの帯）でパターン照合
  const searchRange = 110; // ±110pxの範囲でズレを探索

  const centerB = Math.round(nominalBottomY + smoothedDriftOffsetY);
  if (centerB - searchRange - bandHalfH < 10 || centerB + searchRange + bandHalfH >= totalH - 10) {
    return;
  }

  const rawW = video.videoWidth;
  const rawH = video.videoHeight;
  const leftPct = parseFloat(cropLeftSlider.value) / 100;
  const rightPct = parseFloat(cropRightSlider.value) / 100;
  const srcX1 = Math.round(rawW * leftPct);
  const srcCropW = Math.max(10, Math.round(rawW * rightPct) - srcX1);

  const scaleToChart = (chartMeta.cropW || srcCropW) / srcCropW;
  const chartVideoH = Math.round(rawH * scaleToChart);
  const chartCapY = Math.round(chartVideoH * 0.70);

  const sampleW = 48;
  const sampleH = bandHalfH * 2;
  if (liveSyncCanvas.width !== sampleW || liveSyncCanvas.height !== sampleH) {
    liveSyncCanvas.width = sampleW;
    liveSyncCanvas.height = sampleH;
  }

  // 動画上の capY を中心とした上下 bandHalfH 相当の領域を切り出す
  const vidCapY = rawH * 0.70;
  const vidBandHalf = bandHalfH / Math.max(0.1, scaleToChart);
  const sy = Math.max(0, Math.min(rawH - vidBandHalf * 2, vidCapY - vidBandHalf));
  liveSyncCtx.drawImage(video, srcX1, sy, srcCropW, vidBandHalf * 2, 0, 0, sampleW, sampleH);

  const vData = liveSyncCtx.getImageData(0, 0, sampleW, sampleH).data;
  const vidProf = new Float32Array(sampleH);
  let activeEnergy = 0;

  for (let y = 0; y < sampleH; y++) {
    const row = y * sampleW;
    let sum = 0;
    for (let x = 4; x < sampleW - 4; x++) {
      const idx = (row + x) << 2;
      const r = vData[idx], g = vData[idx + 1], b = vData[idx + 2];
      const maxC = r > g ? (r > b ? r : b) : (g > b ? g : b);
      const minC = r < g ? (r < b ? r : b) : (g < b ? g : b);
      // 動画の背景透かしイラスト（低彩度・暗部）を無視し、ノーツや小節線のみを抽出
      if (maxC > 68 || (maxC - minC) > 32) {
        sum += maxC + (maxC - minC) * 1.2;
      }
    }
    // 動画の上側(y=0)は静止画のより高い bottomY に対応するため、下から順のインデックスに揃える
    const revIdx = sampleH - 1 - y;
    vidProf[revIdx] = sum / (sampleW - 8);
    activeEnergy += vidProf[revIdx];
  }

  // 現在の画面にノーツや小節線がほとんどない空白区間の場合は、現在の補正量を維持する
  if (activeEnergy < sampleH * 18) return;

  let bestShift = 0;
  let minScore = Infinity;
  let baseZeroScore = Infinity;

  for (let shift = -searchRange; shift <= searchRange; shift += 2) {
    const candBottomY = Math.round(nominalBottomY) + shift;
    if (candBottomY - bandHalfH < 2 || candBottomY + bandHalfH >= totalH - 2) continue;

    let diffSum = 0;
    for (let i = 0; i < sampleH; i += 2) {
      const chartB = candBottomY - bandHalfH + i;
      const d = Math.abs(vidProf[i] - chartVisualSignature[chartB]);
      diffSum += d;
    }
    // 急激なジャンプを抑えるための微小な中心バイアス
    const regScore = (diffSum / (sampleH * 0.5)) + Math.abs(shift - smoothedDriftOffsetY) * 0.12;
    if (shift === 0) baseZeroScore = regScore;
    if (regScore < minScore) {
      minScore = regScore;
      bestShift = shift;
    }
  }

  // 明確に一致度が高いズレ位置が見つかった場合のみ目標オフセットを更新
  if (minScore < baseZeroScore * 0.88 && minScore < 65) {
    targetDriftOffsetY = targetDriftOffsetY * 0.55 + bestShift * 0.45;
  }
}

// =========================================================
// 設定ファイル (pjsekai_settings.json) のバックグラウンド自動保存/自動読込
// =========================================================
function collectCurrentSettings() {
  const cLeft = parseFloat(cropLeftSlider.value);
  const cRight = parseFloat(cropRightSlider.value);
  return {
    cropLeft: isNaN(cLeft) ? 18 : cLeft,
    cropRight: isNaN(cRight) ? 78.5 : cRight,
    resolution: resolutionSelect.value || "original",
    blackBg: blackBgToggle.checked,
    bgThresh: parseInt(bgThreshSlider.value, 10) || 36,
    gridBoost: parseFloat(gridBoostSlider.value) || 0.5,
    speed: parseFloat(speedInput.value) || 47.50,
    colHeight: parseInt(colHeightInput.value, 10) || 5400,
    layoutMode: layoutMode.value || "grid",
    showPlayhead: showPlayheadToggle.checked,
    followPlayhead: followPlayheadToggle.checked,
    playheadOffsetSec: parseFloat(playheadOffsetInput.value) || 0.00,
    playbackRate: currentPlaybackRate,
    savedTimestampsByFolder: savedTimestampsByFolder
  };
}

function applySettingsObject(s) {
  if (!s || typeof s !== "object") return;
  if (s.cropLeft === 0 && s.cropRight === 100) {
    s.cropLeft = 18;
    s.cropRight = 78.5;
  }
  if (typeof s.cropLeft === "number") {
    cropLeftSlider.value = s.cropLeft;
    leftVal.textContent = s.cropLeft.toFixed(1);
  }
  if (typeof s.cropRight === "number") {
    cropRightSlider.value = s.cropRight;
    rightVal.textContent = s.cropRight.toFixed(1);
  }
  if (typeof s.resolution === "string" && ["original", "1080", "720", "560"].includes(s.resolution)) {
    resolutionSelect.value = s.resolution;
  }
  if (typeof s.blackBg === "boolean") blackBgToggle.checked = s.blackBg;
  if (typeof s.bgThresh === "number") {
    bgThreshSlider.value = s.bgThresh;
    bgThreshLabel.textContent = s.bgThresh;
  }
  if (typeof s.gridBoost === "number") {
    gridBoostSlider.value = s.gridBoost;
    gridBoostLabel.textContent = `${s.gridBoost.toFixed(1)}倍`;
  }
  if (typeof s.speed === "number") {
    speedSlider.value = s.speed.toFixed(2);
    speedInput.value = s.speed.toFixed(2);
    speedValLabel.textContent = `${s.speed.toFixed(2)} %/秒`;
  }
  if (typeof s.colHeight === "number" && s.colHeight >= 400) {
    colHeightInput.value = s.colHeight;
  }
  if (s.layoutMode === "grid" || s.layoutMode === "single") {
    layoutMode.value = s.layoutMode;
  }
  if (typeof s.showPlayhead === "boolean") showPlayheadToggle.checked = s.showPlayhead;
  if (typeof s.followPlayhead === "boolean") followPlayheadToggle.checked = s.followPlayhead;
  if (typeof s.playheadOffsetSec === "number") {
    playheadOffsetInput.value = s.playheadOffsetSec.toFixed(2);
    playheadOffsetSlider.value = Math.max(-2, Math.min(2, s.playheadOffsetSec)).toFixed(2);
  }
  if (typeof s.playbackRate === "number" && [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2].includes(s.playbackRate)) {
    applyPlaybackRate(s.playbackRate, false);
  }
  if (s.savedTimestampsByFolder && typeof s.savedTimestampsByFolder === "object") {
    savedTimestampsByFolder = s.savedTimestampsByFolder;
  }
  drawPreview(true);
  drawPlayheadOverlay();
}

let saveSettingsTimer = null;
function scheduleSaveSettings() {
  try {
    const s = collectCurrentSettings();
    localStorage.setItem(LOCAL_STORAGE_SETTINGS_KEY, JSON.stringify(s));
  } catch (e) {}

  clearTimeout(saveSettingsTimer);
  saveSettingsTimer = setTimeout(async () => {
    await saveSettingsFileToRootFolder();
  }, 300);
}

async function saveSettingsFileToRootFolder() {
  if (!savedDirectoryHandle) return;
  try {
    const perm = await savedDirectoryHandle.queryPermission({ mode: "readwrite" });
    if (perm === "granted") {
      const s = collectCurrentSettings();
      const jsonText = JSON.stringify(s, null, 2);
      const fileHandle = await savedDirectoryHandle.getFileHandle(SETTINGS_FILE_NAME, { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(jsonText);
      await writable.close();
    }
  } catch (e) {}
}

async function loadSettingsFileFromRootHandle(dirHandle) {
  if (!dirHandle) return false;
  try {
    const fileHandle = await dirHandle.getFileHandle(SETTINGS_FILE_NAME);
    const file = await fileHandle.getFile();
    const text = await file.text();
    const parsed = JSON.parse(text);
    applySettingsObject(parsed);
    localStorage.setItem(LOCAL_STORAGE_SETTINGS_KEY, JSON.stringify(parsed));
    return true;
  } catch (e) {
    return false;
  }
}

// =========================================================
// 生成した静止画をその動画のフォルダへ自動保存する関数
// =========================================================
async function autoSaveCanvasToFolder(folderName, targetCanvas) {
  if (!folderName || !targetCanvas || !targetCanvas.width || cancelGenerationRequested) return false;
  const grp = folderGroups.get(folderName);
  const dirHandle = (grp && grp.dirHandle) ? grp.dirHandle : savedDirectoryHandle;
  if (!dirHandle) return false;

  try {
    let perm = await dirHandle.queryPermission({ mode: "readwrite" });
    if (perm !== "granted") return false;

    const blob = await canvasToBlobSafe(targetCanvas);
    if (!blob || cancelGenerationRequested) return false;

    const fileName = `${folderName}_譜面.png`;
    const fileHandle = await dirHandle.getFileHandle(fileName, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(blob);
    await writable.close();

    const savedFile = await fileHandle.getFile();
    if (grp) {
      const existingIdx = grp.images.findIndex(img => img.name === fileName);
      const entry = {
        name: fileName,
        file: savedFile,
        url: null,
        folderName: folderName,
        masterData: (grp.images[existingIdx] && grp.images[existingIdx].masterData) ? grp.images[existingIdx].masterData : null
      };
      if (existingIdx >= 0) grp.images[existingIdx] = entry;
      else grp.images.unshift(entry);
    }

    bottomSaveStatusLabel.textContent = `フォルダ「${folderName}」に ${fileName} （タイムスタンプ記録済）を自動保存しました`;
    return true;
  } catch (e) {
    return false;
  }
}

// =========================================================
// PC内の同階層フォルダをIndexedDBに記憶して自動読み込み・自動保存する仕組み
// =========================================================
function openHandleDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("ProsekaChartMakerLocalDB", 1);
    req.onupgradeneeded = (e) => {
      e.target.result.createObjectStore("handles");
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function saveDirHandleToDB(handle) {
  try {
    const db = await openHandleDB();
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").put(handle, "rootDir");
  } catch (e) {}
}

async function getDirHandleFromDB() {
  try {
    const db = await openHandleDB();
    return new Promise((resolve) => {
      const tx = db.transaction("handles", "readonly");
      const req = tx.objectStore("handles").get("rootDir");
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) {
    return null;
  }
}

async function scanDirectoryHandle(dirHandle, path = "", collected = []) {
  for await (const entry of dirHandle.values()) {
    if (entry.kind === "file") {
      if (entry.name.toLowerCase() === SETTINGS_FILE_NAME) {
        try {
          const sFile = await entry.getFile();
          const sText = await sFile.text();
          applySettingsObject(JSON.parse(sText));
        } catch (e) {}
        continue;
      }
      if (/\.(mp4|mov|webm|mkv|avi|png|jpe?g|webp|bmp)$/i.test(entry.name)) {
        const file = await entry.getFile();
        const baseName = entry.name.replace(/\.[^.]+$/, "");
        file._customFolder = path || baseName;
        file._dirHandle = dirHandle;
        collected.push(file);
      }
    } else if (entry.kind === "directory") {
      const subPath = path ? `${path}/${entry.name}` : entry.name;
      await scanDirectoryHandle(entry, subPath, collected);
    }
  }
  return collected;
}

async function loadFromSavedHandle(requestPerm = false) {
  if (!savedDirectoryHandle || isGenerating) return;
  try {
    let perm = await savedDirectoryHandle.queryPermission({ mode: "readwrite" });
    if (perm !== "granted" && requestPerm) {
      perm = await savedDirectoryHandle.requestPermission({ mode: "readwrite" });
    }
    if (perm !== "granted") {
      perm = await savedDirectoryHandle.queryPermission({ mode: "read" });
      if (perm !== "granted" && requestPerm) {
        perm = await savedDirectoryHandle.requestPermission({ mode: "read" });
      }
    }

    if (perm === "granted") {
      reconnectFolderBtn.style.display = "none";
      refreshFolderBtn.style.display = "inline-flex";
      await loadSettingsFileFromRootHandle(savedDirectoryHandle);
      folderGroups.clear();
      const files = await scanDirectoryHandle(savedDirectoryHandle, "");
      handleIncomingFiles(files);
    } else {
      reconnectFolderBtn.style.display = "inline-flex";
      reconnectFolderBtn.textContent = `同階層フォルダ「${savedDirectoryHandle.name}」を自動読み込み`;
      folderStatusLabel.textContent = `右のボタンを押すと、登録済みの同階層フォルダ「${savedDirectoryHandle.name}」から全フォルダと設定を一括読み込みします`;
    }
  } catch (e) {}
}

});
window.addEventListener("drop", async (e) => {
  e.preventDefault();
  topSwitcherCard.style.borderColor = "#00a8a8";
  if (isGenerating) return;
  const items = e.dataTransfer.items;
  if (items && items.length > 0 && items[0].webkitGetAsEntry) {
    const collected = [];
    for (let i = 0; i < items.length; i++) {
      const entry = items[i].webkitGetAsEntry();
      if (entry) await traverseFileTree(entry, "", collected);
    }
    if (collected.length > 0) await handleIncomingFiles(collected);
  } else if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
    await handleIncomingFiles(Array.from(e.dataTransfer.files));
  }
});

async function traverseFileTree(item, path, collected) {
  if (item.isFile) {
    const file = await new Promise((res) => item.file(res));
    const baseName = file.name.replace(/\.[^.]+$/, "");
    file._customFolder = path || baseName;
    collected.push(file);
  } else if (item.isDirectory) {
    const dirReader = item.createReader();
    let entries = [];
    let batch;
    do {
      batch = await new Promise((res) => dirReader.readEntries(res));
      entries = entries.concat(batch);
    } while (batch.length > 0);
    const nextPath = path ? `${path}/${item.name}` : item.name;
    for (const entry of entries) {
      await traverseFileTree(entry, nextPath, collected);
    }
  }
}

async function handleIncomingFiles(files) {
  if (isGenerating) return;
  let firstFolder = "";

  for (const f of files) {
    if (f.name.toLowerCase() === SETTINGS_FILE_NAME) {
      try {
        const text = await f.text();
        applySettingsObject(JSON.parse(text));
      } catch (e) {}
    }
  }

  for (const f of files) {
    const isVid = f.type.startsWith("video/") || /\.(mp4|mov|webm|mkv|avi)$/i.test(f.name);
    const isImg = f.type.startsWith("image/") || /\.(png|jpe?g|webp|bmp)$/i.test(f.name);
    if (!isVid && !isImg) continue;

    let folderName = f._customFolder || "";
    if (!folderName && f.webkitRelativePath) {
      const parts = f.webkitRelativePath.split("/");
      parts.pop();
      if (parts.length > 1) parts.shift();
      folderName = parts.join("/");
    }
    if (!folderName) {
      folderName = f.name.replace(/\.[^.]+$/, "");
    }

    if (!folderGroups.has(folderName)) {
      folderGroups.set(folderName, { images: [], videos: [], dirHandle: f._dirHandle || null });
    }
    const group = folderGroups.get(folderName);
    if (f._dirHandle && !group.dirHandle) {
      group.dirHandle = f._dirHandle;
    }

    const entry = { name: f.name, file: f, url: null, ramBlobUrl: null, folderName: folderName };

    if (isVid) {
      const idx = group.videos.findIndex(v => v.name === f.name);
      if (idx >= 0) group.videos[idx] = entry;
      else group.videos.push(entry);
    } else if (isImg) {
      const idx = group.images.findIndex(img => img.name === f.name);
      if (idx >= 0) group.images[idx] = entry;
      else group.images.push(entry);
    }

    if (!firstFolder) firstFolder = folderName;
  }

  for (const [, grp] of folderGroups) {
    grp.images.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    grp.videos.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  }

  if (folderGroups.size > 0) {
    switcherContent.style.display = "block";
    const targetFolder = (activeFolderName && folderGroups.has(activeFolderName))
      ? activeFolderName
      : (firstFolder || Array.from(folderGroups.keys())[0]);
    selectFolderSet(targetFolder);
  }
  updateBatchButtonState();
}

function selectFolderSet(folderName) {
  if (isGenerating) return;
  const grp = folderGroups.get(folderName);
  if (!grp) return;
  activeFolderName = folderName;
  smoothedDriftOffsetY = 0;
  targetDriftOffsetY = 0;
  renderTopSwitcher();

  if (grp.videos.length > 0) {
    loadVideoItem(grp.videos[0]);
  }
  if (grp.images.length > 0) {
    loadImageItemToViewer(grp.images[0]);
  }
}

function getUnprocessedVideoEntries() {
  const unprocessed = [];
  for (const [fName, grp] of folderGroups) {
    if (grp.images && grp.images.length > 0) continue;
    for (const v of grp.videos) {
      unprocessed.push({ videoEntry: v, folderName: fName });
    }
  }
  return unprocessed;
}

function updateBatchButtonState() {
  const unprocessedVids = getUnprocessedVideoEntries();
  batchGenerateBtn.disabled = isGenerating || unprocessedVids.length === 0;
  if (unprocessedVids.length > 0) {
    batchGenerateBtn.textContent = `未作成の複数動画を一括作成 (${unprocessedVids.length}本)`;
  } else {
    batchGenerateBtn.textContent = `一括作成（未作成の動画なし）`;
  }
}

function renderTopSwitcher() {
  folderTabs.innerHTML = "";
  const totalFolders = folderGroups.size;
  const unprocessedCount = getUnprocessedVideoEntries().length;

  folderStatusLabel.textContent = totalFolders > 0
    ? `全 ${totalFolders} フォルダ （未作成の動画フォルダ: ${unprocessedCount} 件）`
    : "";

  for (const [folderName, grp] of folderGroups) {
    const hasVideoOnly = grp.videos.length > 0 && grp.images.length === 0;
    const btn = document.createElement("button");
    btn.className = "folder-set-btn"
      + (folderName === activeFolderName ? " active" : "")
      + (hasVideoOnly ? " unprocessed" : "");
    btn.textContent = hasVideoOnly ? `${folderName} (未作成)` : folderName;
    btn.disabled = isGenerating;
    btn.addEventListener("click", () => {
      if (!isGenerating) selectFolderSet(folderName);
    });
    folderTabs.appendChild(btn);
  }
}

// =========================================================
// 4. 画像内の列領域を実測する検出エンジン ＆ 外部画像の読み込み（埋め込みタイムスタンプ復元対応）
// =========================================================
function detectColumnRectsFromCanvas(ctx, W, H) {
  const sampleYs = [
    Math.round(H * 0.20),
    Math.round(H * 0.35),
    Math.round(H * 0.50),
    Math.round(H * 0.65),
    Math.round(H * 0.80)
  ];

  const refPixel = ctx.getImageData(Math.min(2, W - 1), Math.round(H * 0.5), 1, 1).data;
  const refR = refPixel[0], refG = refPixel[1], refB = refPixel[2];

  function isGapBgColor(r, g, b) {
    const dRef = Math.abs(r - refR) + Math.abs(g - refG) + Math.abs(b - refB);
    const dDark = Math.abs(r - 5) + Math.abs(g - 7) + Math.abs(b - 11);
    const dNavy = Math.abs(r - 22) + Math.abs(g - 28) + Math.abs(b - 46);
    return dRef <= 18 || dDark <= 18 || dNavy <= 22;
  }

  const rowDatas = sampleYs.map(y => ctx.getImageData(0, y, W, 1).data);
  const isContentX = new Uint8Array(W);

  for (let x = 0; x < W; x++) {
    const idx = x * 4;
    let allGap = true;
    for (let s = 0; s < rowDatas.length; s++) {
      const rd = rowDatas[s];
      if (!isGapBgColor(rd[idx], rd[idx + 1], rd[idx + 2])) {
        allGap = false;
        break;
      }
    }
    if (!allGap) isContentX[x] = 1;
  }

  const rawSpans = [];
  let inSpan = false;
  let startX = 0;
  for (let x = 0; x < W; x++) {
    if (isContentX[x] && !inSpan) {
      inSpan = true;
      startX = x;
    } else if (!isContentX[x] && inSpan) {
      inSpan = false;
      rawSpans.push({ x1: startX, x2: x - 1 });
    }
  }
  if (inSpan) rawSpans.push({ x1: startX, x2: W - 1 });

  const mergedSpans = [];
  for (const sp of rawSpans) {
    if (mergedSpans.length === 0) {
      mergedSpans.push({ ...sp });
    } else {
      const prev = mergedSpans[mergedSpans.length - 1];
      const gapWidth = sp.x1 - prev.x2 - 1;
      if (gapWidth < 6) {
        prev.x2 = sp.x2;
      } else {
        mergedSpans.push({ ...sp });
      }
    }
  }

  const validSpans = mergedSpans.filter(sp => (sp.x2 - sp.x1 + 1) >= 60);

  if (validSpans.length >= 2) {
    const midX = Math.round((validSpans[0].x1 + validSpans[0].x2) * 0.5);
    const colLineData = ctx.getImageData(midX, 0, 1, H).data;

    let topY = 0;
    for (let y = 0; y < Math.min(80, Math.round(H * 0.15)); y++) {
      const idx = y * 4;
      if (!isGapBgColor(colLineData[idx], colLineData[idx + 1], colLineData[idx + 2])) {
        topY = y;
        break;
      }
    }

    let bottomY = H - 2;
    for (let y = H - 2; y >= H - Math.min(50, Math.round(H * 0.1)); y--) {
      const idx = y * 4;
      if (!isGapBgColor(colLineData[idx], colLineData[idx + 1], colLineData[idx + 2])) {
        bottomY = y;
        break;
      }
    }

    const colH = Math.max(100, bottomY - topY + 1);
    const rects = validSpans.map(sp => ({
      x: sp.x1,
      y: topY,
      w: sp.x2 - sp.x1 + 1,
      h: colH
    }));
    return { mode: "grid", rects };
  }

  if (validSpans.length === 1) {
    const sp = validSpans[0];
    return {
      mode: "single",
      rects: [{ x: sp.x1, y: 0, w: sp.x2 - sp.x1 + 1, h: H }]
    };
  }

  return {
    mode: "single",
    rects: [{ x: 0, y: 0, w: W, h: H }]
  };
}

function loadImageItemToViewer(imgItem) {
  if (imgItem.masterData && imgItem.masterData.hasData) {
    masterChartData = imgItem.masterData;
    reLayoutBtn.disabled = isGenerating;
    rebuildLayoutFromMaster(false);
    return;
  }

  const srcUrl = imgItem.file ? URL.createObjectURL(imgItem.file) : imgItem.url;
  if (!srcUrl) return;
  const img = new Image();
  img.onload = () => {
    outputCanvas.width = img.width;
    outputCanvas.height = img.height;
    const outCtx = outputCanvas.getContext("2d", { willReadFrequently: true });
    outCtx.drawImage(img, 0, 0);

    const infoText = `表示中: ${activeFolderName} / ${imgItem.name} (${img.width} x ${img.height} px)`;
    currentViewFileName.textContent = infoText;
    bottomSaveStatusLabel.textContent = infoText;

    extractMasterFromExternalImage(img, outCtx, `${activeFolderName}`);
    setupViewerAfterGenerate(chartMeta.numCols);
    drawPlayheadOverlay();
    if (imgItem.file) URL.revokeObjectURL(srcUrl);
  };
  img.src = srcUrl;
}

function extractMasterFromExternalImage(img, ctx, labelName) {
  const W = img.width;
  const H = img.height;
  const parsedStart = parseFloat(startTimeInput.value);
  const parsedEnd = parseFloat(endTimeInput.value);
  let tStart = !isNaN(parsedStart) ? parsedStart : 0.0;
  let tEnd = (!isNaN(parsedEnd) && parsedEnd > tStart) ? parsedEnd : (video.duration || 120.0);

  const detected = detectColumnRectsFromCanvas(ctx, W, H);
  const colRects = detected.rects;
  const mode = detected.mode;
  const numCols = colRects.length;
  const calcCropW = Math.round(colRects[0].w);
  const colMaxH = Math.round(colRects[0].h);
  const estColGap = numCols > 1 ? Math.max(0, colRects[1].x - (colRects[0].x + colRects[0].w)) : 0;
  const estHeaderH = mode === "grid" ? Math.max(0, colRects[0].y - estColGap) : 0;

  currentColumnWidths = calcCropW;
  const totalHeight = numCols * colMaxH;

  const cropRatio = Math.max(0.2, (parseFloat(cropRightSlider.value) - parseFloat(cropLeftSlider.value)) / 100);
  const estVideoW = calcCropW / cropRatio;
  const estH = estVideoW * 0.68;
  let estBottomBaseH = Math.round(estH * 0.30);
  let estTopCapH = Math.round(estH * 0.63);
  let restoredTimeMap = [];

  // 1) まずPNG画像の最下端行に埋め込まれたタイムスタンプ（ステガノグラフィ）があれば優先復元
  const embeddedMeta = extractTimestampsFromCanvas(ctx, W, H);
  if (embeddedMeta && embeddedMeta.timeToYMap && embeddedMeta.timeToYMap.length >= 2) {
    const scaleY = embeddedMeta.totalHeight > 0 ? (totalHeight / embeddedMeta.totalHeight) : 1.0;
    estBottomBaseH = Math.round((embeddedMeta.bottomBaseH || estBottomBaseH) * scaleY);
    estTopCapH = Math.round((embeddedMeta.topCapH || estTopCapH) * scaleY);
    tStart = embeddedMeta.tStart ?? tStart;
    tEnd = embeddedMeta.tEnd ?? tEnd;
    restoredTimeMap = embeddedMeta.timeToYMap.map(pt => ({
      time: pt.time,
      bottomY: pt.bottomY * scaleY
    }));
  } else if (savedTimestampsByFolder[labelName] && savedTimestampsByFolder[labelName].timeToYMap) {
    // 2) 設定ファイルに記録されていたフォルダ別の裏タイムスタンプがあれば復元
    const savedProf = savedTimestampsByFolder[labelName];
    const scaleY = savedProf.totalHeight > 0 ? (totalHeight / savedProf.totalHeight) : 1.0;
    estBottomBaseH = Math.round((savedProf.bottomBaseH || estBottomBaseH) * scaleY);
    estTopCapH = Math.round((savedProf.topCapH || estTopCapH) * scaleY);
    tStart = savedProf.tStart ?? tStart;
    tEnd = savedProf.tEnd ?? tEnd;
    restoredTimeMap = savedProf.timeToYMap.map(pt => ({
      time: pt.time,
      bottomY: pt.bottomY * scaleY
    }));
  }

  const numChunks = Math.ceil(totalHeight / MASTER_CHUNK_H);
  const chunks = [];
  for (let k = 0; k < numChunks; k++) {
    const ch = document.createElement("canvas");
    ch.width = calcCropW;
    ch.height = MASTER_CHUNK_H;
    chunks.push(ch);
  }

  for (let c = 0; c < numCols; c++) {
    const rect = colRects[c];
    const sx = rect.x;
    const sy = rect.y;

    const colBottomStart = c * colMaxH;
    const startChunk = Math.floor(colBottomStart / MASTER_CHUNK_H);
    const endChunk = Math.floor((colBottomStart + colMaxH - 1) / MASTER_CHUNK_H);
    for (let k = startChunk; k <= endChunk; k++) {
      const chunkBottomStart = k * MASTER_CHUNK_H;
      const overlapBottom = Math.max(colBottomStart, chunkBottomStart);
      const overlapTop = Math.min(colBottomStart + colMaxH, chunkBottomStart + MASTER_CHUNK_H);
      const copyH = overlapTop - overlapBottom;
      if (copyH <= 0) continue;

      const srcY = sy + (colMaxH - (overlapBottom - colBottomStart) - copyH);
      const dstY = MASTER_CHUNK_H - (overlapBottom - chunkBottomStart) - copyH;
      chunks[k].getContext("2d").drawImage(img, sx, srcY, rect.w, copyH, 0, dstY, calcCropW, copyH);
    }
  }

  masterChartData = {
    hasData: true,
    cropW: calcCropW,
    totalHeight: totalHeight,
    bottomBaseH: estBottomBaseH,
    topCapH: estTopCapH,
    chunks: chunks,
    tStart: tStart,
    tEnd: tEnd,
    timeToYMap: restoredTimeMap,
    sourceLabel: labelName
  };
  reLayoutBtn.disabled = isGenerating;

  chartMeta = {
    isGenerated: false,
    mode: mode,
    numCols: numCols,
    cropW: calcCropW,
    colMaxH: colMaxH,
    colGap: estColGap,
    headerH: estHeaderH,
    totalHeight: totalHeight,
    bottomBaseH: estBottomBaseH,
    topCapH: estTopCapH,
    tStart: tStart,
    tEnd: tEnd,
    scale: 1,
    renderScale: 1,
    colRects: colRects,
    timeToYMap: restoredTimeMap
  };

  // 再生時のリアルタイム・オートシンクロ補正のために静止画の視覚シグネチャを裏で構築
  buildChartVisualSignatureFromMaster();
}

// =========================================================
// 5. マスター譜面データから「1列の高さ」を変更して即時再生成（タイムスタンプ埋め込み対応）
// =========================================================
function drawColumnFromMaster(targetCtx, c, colMaxH, destX, destY) {
  const { cropW, totalHeight, chunks } = masterChartData;
  targetCtx.fillStyle = "#000000";
  targetCtx.fillRect(destX, destY, cropW, colMaxH);

  const colBottomStart = c * colMaxH;
  const colBottomEnd = Math.min(totalHeight, colBottomStart + colMaxH);
  if (colBottomEnd <= colBottomStart) return;

  const startChunk = Math.floor(colBottomStart / MASTER_CHUNK_H);
  const endChunk = Math.floor((colBottomEnd - 1) / MASTER_CHUNK_H);

  for (let k = startChunk; k <= endChunk; k++) {
    if (k < 0 || k >= chunks.length) continue;
    const chunkBottomStart = k * MASTER_CHUNK_H;
    const overlapBottom = Math.max(colBottomStart, chunkBottomStart);
    const overlapTop = Math.min(colBottomEnd, chunkBottomStart + MASTER_CHUNK_H);
    const copyH = overlapTop - overlapBottom;
    if (copyH <= 0) continue;

    const srcY = MASTER_CHUNK_H - (overlapBottom - chunkBottomStart) - copyH;
    const dstY = destY + (colMaxH - (overlapBottom - colBottomStart) - copyH);
    targetCtx.drawImage(chunks[k], 0, srcY, cropW, copyH, destX, dstY, cropW, copyH);
  }
}

async function rebuildLayoutFromMaster(shouldAutoSave = true) {
  if (!masterChartData.hasData || !masterChartData.chunks || masterChartData.chunks.length === 0) return;

  const { cropW, totalHeight, bottomBaseH, topCapH, tStart, tEnd, timeToYMap, sourceLabel } = masterChartData;
  const colMaxH = Math.max(400, parseInt(colHeightInput.value, 10) || 5400);
  const mode = layoutMode.value;
  const numCols = Math.max(1, Math.ceil(totalHeight / colMaxH));
  const colGap = 14;
  const headerH = 0;

  currentColumnWidths = cropW;

  const MAX_DIM = 14000;
  const MAX_AREA = 60000000;
  let renderScale = 1;
  const colRects = [];

  if (mode === "single") {
    const rawW = cropW;
    const rawH = totalHeight;
    const dimScale = Math.min(1, MAX_DIM / Math.max(1, rawW), MAX_DIM / Math.max(1, rawH));
    const areaScale = Math.min(1, Math.sqrt(MAX_AREA / Math.max(1, rawW * rawH)));
    renderScale = Math.min(dimScale, areaScale);

    outputCanvas.width = Math.max(1, Math.round(rawW * renderScale));
    outputCanvas.height = Math.max(1, Math.round(rawH * renderScale));
    const outCtx = outputCanvas.getContext("2d", { willReadFrequently: true });
    outCtx.imageSmoothingEnabled = true;
    outCtx.imageSmoothingQuality = "high";
    outCtx.fillStyle = "#000000";
    outCtx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
    outCtx.save();
    outCtx.scale(renderScale, renderScale);

    for (let c = 0; c < numCols; c++) {
      const destY = totalHeight - (c + 1) * colMaxH;
      drawColumnFromMaster(outCtx, c, colMaxH, 0, destY);
    }
    outCtx.restore();

    colRects.push({
      x: 0,
      y: 0,
      w: outputCanvas.width,
      h: outputCanvas.height
    });
  } else {
    const rawW = numCols * cropW + (numCols + 1) * colGap;
    const rawH = colMaxH + headerH + colGap * 2;
    const dimScale = Math.min(1, MAX_DIM / Math.max(1, rawW), MAX_DIM / Math.max(1, rawH));
    const areaScale = Math.min(1, Math.sqrt(MAX_AREA / Math.max(1, rawW * rawH)));
    renderScale = Math.min(dimScale, areaScale);

    outputCanvas.width = Math.max(1, Math.round(rawW * renderScale));
    outputCanvas.height = Math.max(1, Math.round(rawH * renderScale));
    const outCtx = outputCanvas.getContext("2d", { willReadFrequently: true });
    outCtx.imageSmoothingEnabled = true;
    outCtx.imageSmoothingQuality = "high";

    outCtx.save();
    outCtx.scale(renderScale, renderScale);
    outCtx.fillStyle = blackBgToggle.checked ? "#05070b" : "#161c2e";
    outCtx.fillRect(0, 0, rawW, rawH);

    for (let c = 0; c < numCols; c++) {
      const x = colGap + c * (cropW + colGap);
      const y = headerH + colGap;

      drawColumnFromMaster(outCtx, c, colMaxH, x, y);
      outCtx.strokeStyle = "#2b3856";
      outCtx.lineWidth = 2;
      outCtx.strokeRect(x, y, cropW, colMaxH);

      colRects.push({
        x: x * renderScale,
        y: y * renderScale,
        w: cropW * renderScale,
        h: colMaxH * renderScale
      });
    }
    outCtx.restore();
  }

  chartMeta = {
    isGenerated: true,
    mode: mode,
    numCols: numCols,
    cropW: cropW,
    colMaxH: colMaxH,
    colGap: colGap,
    headerH: headerH,
    totalHeight: totalHeight,
    bottomBaseH: bottomBaseH || 0,
    topCapH: topCapH || 0,
    tStart: tStart,
    tEnd: tEnd,
    scale: renderScale,
    renderScale: renderScale,
    colRects: colRects,
    timeToYMap: timeToYMap
  };

  // 裏で静止画の視覚シグネチャを構築し、さらにCanvas最下端行にタイムスタンプを埋め込む
  buildChartVisualSignatureFromMaster();
  embedTimestampsIntoCanvas(outputCanvas, chartMeta);
  if (activeFolderName) {
    saveTimestampProfileForFolder(activeFolderName, chartMeta);
  }

  const infoText = `${sourceLabel || activeFolderName || "生成譜面"} [1列の高さ: ${colMaxH}px / 全${numCols}列] (${outputCanvas.width} x ${outputCanvas.height} px)`;
  currentViewFileName.textContent = infoText;
  bottomSaveStatusLabel.textContent = infoText;
  setupViewerAfterGenerate(numCols);
  drawPlayheadOverlay();

  if (shouldAutoSave && activeFolderName && !cancelGenerationRequested) {
    await autoSaveCanvasToFolder(activeFolderName, outputCanvas);
  }
}

reLayoutBtn.addEventListener("click", () => {
  if (!isGenerating && masterChartData.hasData) rebuildLayoutFromMaster(true);
});
layoutMode.addEventListener("change", () => {
  scheduleSaveSettings();
  if (!isGenerating && masterChartData.hasData) rebuildLayoutFromMaster(true);
});
colHeightInput.addEventListener("change", () => {
  scheduleSaveSettings();
  if (!isGenerating && masterChartData.hasData) rebuildLayoutFromMaster(true);
});
resolutionSelect.addEventListener("change", () => {
  scheduleSaveSettings();
});

// 動画ファイルをメモリ（RAM）に完全プリロードしてディスクI/O待ちの引っかかりをゼロにする関数
async function ensureVideoPreloadedInMemory(vidItem) {
  if (!vidItem) return null;
  if (vidItem.ramBlobUrl) return vidItem.ramBlobUrl;
  try {
    if (vidItem.file) {
      const arrayBuf = await vidItem.file.arrayBuffer();
      const ramBlob = new Blob([arrayBuf], { type: vidItem.file.type || "video/mp4" });
      vidItem.ramBlobUrl = URL.createObjectURL(ramBlob);
      return vidItem.ramBlobUrl;
    } else if (vidItem.url) {
      const res = await fetch(vidItem.url);
      const arrayBuf = await res.arrayBuffer();
      const ramBlob = new Blob([arrayBuf], { type: "video/mp4" });
      vidItem.ramBlobUrl = URL.createObjectURL(ramBlob);
      return vidItem.ramBlobUrl;
    }
  } catch (e) {}
  return vidItem.file ? URL.createObjectURL(vidItem.file) : vidItem.url;
}

function loadVideoItem(vidItem) {
  if (isGenerating) return;
  activeVideoName = vidItem.name;
  activeVideoItem = vidItem;
  shouldRestartFromBeginning = false;

  const srcUrl = vidItem.ramBlobUrl || (vidItem.file ? URL.createObjectURL(vidItem.file) : vidItem.url);
  video.src = srcUrl;
  video.muted = false;
  video.volume = 1.0;
  video.load();
  video.onloadedmetadata = () => {
    applyPlaybackRate(currentPlaybackRate, false);
    previewCanvas.width = video.videoWidth || 640;
    previewCanvas.height = video.videoHeight || 360;
    const dur = video.duration || 0;
    seekSlider.max = dur.toFixed(2);

    const defaultStart = 0.0;
    const defaultEnd = dur;
    startTimeInput.value = defaultStart.toFixed(1);
    endTimeInput.value = defaultEnd.toFixed(1);

    if (!chartMeta.isGenerated && (!chartMeta.timeToYMap || chartMeta.timeToYMap.length === 0)) {
      chartMeta.tStart = defaultStart;
      chartMeta.tEnd = defaultEnd;
    }

    generateBtn.disabled = isGenerating;
    testGenerateBtn.disabled = isGenerating;
    updateBatchButtonState();

    video.currentTime = defaultStart;
    drawPlayheadOverlay();
  };
}

function drawPreview(forceFilter = false) {
  if (isGenerating && !forceFilter) return;
  if (!video.videoWidth) return;
  const w = previewCanvas.width;
  const h = previewCanvas.height;
  pCtx.drawImage(video, 0, 0, w, h);

  const leftPct = parseFloat(cropLeftSlider.value) / 100;
  const rightPct = parseFloat(cropRightSlider.value) / 100;
  const x1 = Math.round(w * leftPct);
  const x2 = Math.round(w * rightPct);
  const cw = x2 - x1;

  if ((video.paused || forceFilter) && !isGenerating && blackBgToggle.checked && cw > 10) {
    if (filterSubCanvas.width !== cw || filterSubCanvas.height !== h) {
      filterSubCanvas.width = cw;
      filterSubCanvas.height = h;
    }
    filterSubCtx.drawImage(video, x1, 0, cw, h, 0, 0, cw, h);
    applyBlackBackgroundFilter(filterSubCtx, cw, h);
    pCtx.drawImage(filterSubCanvas, x1, 0);
  }

  pCtx.fillStyle = "rgba(0, 0, 0, 0.72)";
  pCtx.fillRect(0, 0, x1, h);
  pCtx.fillRect(x2, 0, w - x2, h);

  pCtx.strokeStyle = "#00d4d4";
  pCtx.lineWidth = 2;
  pCtx.strokeRect(x1, 0, cw, h);

  const capY = Math.round(h * 0.70);
  pCtx.strokeStyle = "#ff4d88";
  pCtx.setLineDash([6, 4]);
  pCtx.beginPath();
  pCtx.moveTo(x1, capY);
  pCtx.lineTo(x2, capY);
  pCtx.stroke();
  pCtx.setLineDash([]);
}

// =========================================================
// 6. 裏タイムスタンプ記録 ＆ リアルタイム・オートシンクロ補正による「再生位置バー」描画エンジン
// =========================================================
function getNominalBottomYForTime(t) {
  const { tStart, tEnd, totalHeight, bottomBaseH, topCapH, timeToYMap } = chartMeta;
  if (timeToYMap && timeToYMap.length >= 2) {
    if (t <= timeToYMap[0].time) return timeToYMap[0].bottomY;
    const last = timeToYMap[timeToYMap.length - 1];
    if (t >= last.time) return last.bottomY;
    let low = 0, high = timeToYMap.length - 1;
    while (low <= high) {
      const mid = (low + high) >> 1;
      if (timeToYMap[mid].time < t) low = mid + 1;
      else high = mid - 1;
    }
    const p1 = timeToYMap[Math.max(0, low - 1)];
    const p2 = timeToYMap[Math.min(timeToYMap.length - 1, low)];
    const ratio = (p2.time - p1.time) > 0.0001 ? (t - p1.time) / (p2.time - p1.time) : 0;
    return p1.bottomY + ratio * (p2.bottomY - p1.bottomY);
  }

  const dur = Math.max(0.1, tEnd - tStart);
  const startY = bottomBaseH || 0;
  const endY = Math.max(startY + 100, totalHeight - (topCapH || 0));
  const ratio = Math.max(0, Math.min(1, (t - tStart) / dur));
  return startY + ratio * (endY - startY);
}

function getTimeForBottomY(targetBottomY) {
  const { tStart, tEnd, totalHeight, bottomBaseH, topCapH, timeToYMap } = chartMeta;
  const unshiftedY = targetBottomY - smoothedDriftOffsetY;
  if (timeToYMap && timeToYMap.length >= 2) {
    if (unshiftedY <= timeToYMap[0].bottomY) return timeToYMap[0].time;
    const last = timeToYMap[timeToYMap.length - 1];
    if (unshiftedY >= last.bottomY) return last.time;
    for (let i = 1; i < timeToYMap.length; i++) {
      if (timeToYMap[i].bottomY >= unshiftedY) {
        const p1 = timeToYMap[i - 1];
        const p2 = timeToYMap[i];
        const dy = p2.bottomY - p1.bottomY;
        const r = dy > 0.001 ? (unshiftedY - p1.bottomY) / dy : 0;
        return p1.time + r * (p2.time - p1.time);
      }
    }
  }
  const startY = bottomBaseH || 0;
  const endY = Math.max(startY + 100, totalHeight - (topCapH || 0));
  const ratio = Math.max(0, Math.min(1, (unshiftedY - startY) / Math.max(1, endY - startY)));
  return tStart + ratio * (tEnd - tStart);
}

function drawPlayheadOverlay() {
  if (!outputCanvas.width || !outputCanvas.height || !showPlayheadToggle.checked) {
    playheadBar.style.display = "none";
    playheadColHighlight.style.display = "none";
    return;
  }

  const rawTime = video.currentTime || 0;
  const offsetSec = parseFloat(playheadOffsetInput.value) || 0;
  const effectiveTime = rawTime + offsetSec;

  // 1) 裏で記録されたタイムスタンプから基本のY位置を取得
  const nominalBottomY = getNominalBottomYForTime(effectiveTime);

  // 2) 動画再生中（またはシーク時）に動画フレームと静止画を裏で照合し、画像の歪みや速度誤差によるズレを検出
  updateLivePlayheadDriftCorrection(nominalBottomY);

  // 3) 検出されたズレ量 targetDriftOffsetY に向かって、カクつかないようイージング補間で滑らかにバー位置を修正！
  smoothedDriftOffsetY += (targetDriftOffsetY - smoothedDriftOffsetY) * 0.14;
  if (Math.abs(smoothedDriftOffsetY) < 0.05) smoothedDriftOffsetY = 0;

  const { colMaxH, numCols, totalHeight, colRects } = chartMeta;
  const bottomY = Math.max(0, Math.min(totalHeight, nominalBottomY + smoothedDriftOffsetY));

  let barX = 0, barY = 0, barW = outputCanvas.width;

  if (chartMeta.mode === "single" || !colRects || colRects.length <= 1) {
    const rect = (colRects && colRects[0]) ? colRects[0] : { x: 0, y: 0, w: outputCanvas.width, h: outputCanvas.height };
    barX = rect.x;
    barW = rect.w;
    const ratio = Math.max(0, Math.min(1, bottomY / Math.max(1, totalHeight)));
    barY = rect.y + rect.h * (1 - ratio);
    playheadColHighlight.style.display = "none";
  } else {
    const colIndex = Math.min(numCols - 1, Math.max(0, Math.floor(bottomY / colMaxH)));
    const relBottom = Math.max(0, Math.min(colMaxH, bottomY - colIndex * colMaxH));
    const rect = colRects[colIndex] || colRects[0];
    barX = rect.x;
    barW = rect.w;
    barY = rect.y + rect.h * (1 - relBottom / Math.max(1, colMaxH));

    playheadColHighlight.style.display = "block";
    playheadColHighlight.style.width = `${rect.w}px`;
    playheadColHighlight.style.height = `${rect.h}px`;
    playheadColHighlight.style.transform = `translate3d(${rect.x}px, ${rect.y}px, 0)`;
  }

  playheadBar.style.display = "block";
  playheadBar.style.width = `${barW}px`;
  playheadBar.style.transform = `translate3d(${barX}px, ${barY}px, 0)`;
  playheadTimeBadge.textContent = `${rawTime.toFixed(2)}s (${currentPlaybackRate}x)`;

  if (followPlayheadToggle.checked && !isDragging) {
    const vw = viewerViewport.clientWidth;
    const vh = viewerViewport.clientHeight;
    vX = vw * 0.5 - (barX + barW * 0.5) * vScale;
    vY = vh * 0.55 - barY * vScale;
    updateViewerTransform();
  }
}
