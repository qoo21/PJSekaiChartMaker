<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJSekaiChartMaker - プロセカ譜面動画 変換ソフト</title>
<style>
  :root {
    --primary: #00d4d4;
    --primary-dark: #009999;
    --bg: #0f131d;
    --card: #192030;
    --text: #f0f4f8;
    --muted: #9aa5b8;
    --accent: #ff4d88;
    --border: #2e3954;
  }
  * { box-sizing: border-box; font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif; }
  body {
    margin: 0; padding: 16px 20px;
    background-color: var(--bg); color: var(--text);
    line-height: 1.55;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(135deg, #182540 0%, #101a2e 100%);
    padding: 14px 20px; border-radius: 12px;
    border: 1px solid var(--border); margin-bottom: 14px;
    flex-wrap: wrap; gap: 12px;
  }
  header h1 { margin: 0; font-size: 1.3rem; color: #fff; }
  .step-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 18px; margin-bottom: 16px;
  }
  .btn {
    background: var(--primary); color: #001818; border: none;
    padding: 8px 15px; border-radius: 8px; font-weight: bold;
    cursor: pointer; font-size: 0.9rem; transition: 0.18s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: #33ecec; transform: translateY(-1px); }
  .btn:disabled { background: #3c445c; color: #7c869e; cursor: not-allowed; transform: none; }
  .btn-secondary { background: #28324a; color: #fff; border: 1px solid #3f4e70; }
  .btn-secondary:hover { background: #344160; }
  .btn-secondary.active { background: var(--primary); color: #001818; border-color: var(--primary); }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: #ff709f; }
  .btn-danger { background: #e63946; color: #fff; }
  .btn-danger:hover { background: #ff525f; }

  /* プレビュー上部のフォルダ一括切り替えバー（フォルダ名ボタンのみ表示） */
  .top-switcher-card {
    background: #141b2b; border: 2px solid #00a8a8;
    border-radius: 12px; padding: 12px 16px; margin-bottom: 14px;
  }
  .switcher-header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px;
  }
  .folder-tabs {
    display: flex; gap: 8px; flex-wrap: wrap;
    padding-top: 10px; margin-top: 8px; border-top: 1px solid var(--border);
  }
  .folder-set-btn {
    background: #222c42; color: #e2e8f0; border: 1px solid #3a496b;
    padding: 7px 15px; border-radius: 8px; font-size: 0.9rem;
    cursor: pointer; white-space: nowrap; transition: 0.15s; font-weight: bold;
  }
  .folder-set-btn:hover { background: #2e3c59; transform: translateY(-1px); }
  .folder-set-btn.active {
    background: var(--primary); color: #001818; border-color: var(--primary);
    box-shadow: 0 0 12px rgba(0, 212, 212, 0.35);
  }

  /* 動画プレビュー（上部） */
  .preview-wrapper {
    position: relative; background: #000; border-radius: 8px;
    overflow: hidden; border: 1px solid var(--border);
    display: flex; justify-content: center; align-items: center;
    min-height: 200px; max-height: 310px;
  }
  #videoPreview { display: none; }
  #previewCanvas { max-width: 100%; max-height: 300px; display: block; }

  /* 再生ボタン＆シークバー（常時表示） */
  .main-transport-bar {
    display: flex; align-items: center; gap: 12px;
    background: #121724; padding: 10px 14px; border-radius: 8px;
    border: 1px solid #222b40; margin-top: 10px; flex-wrap: wrap;
  }
  .main-transport-bar input[type="range"] {
    flex: 1; min-width: 160px; accent-color: var(--primary); cursor: pointer;
  }

  /* 常時表示パネル共通 */
  .always-panel {
    margin-top: 10px; background: #121724; padding: 12px 14px;
    border-radius: 8px; border: 1px solid #222b40;
  }

  /* 詳細設定の折りたたみタブ */
  .details-tab-wrap {
    margin-top: 10px; background: #121724; border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
  }
  .details-tab-summary {
    padding: 9px 14px; cursor: pointer; font-weight: bold;
    color: var(--primary); font-size: 0.92rem; user-select: none;
    background: #161d2e; display: flex; justify-content: space-between; align-items: center;
    list-style: none;
  }
  .details-tab-summary::-webkit-details-marker { display: none; }
  .details-tab-summary:hover { background: #1c253b; }
  .details-tab-body {
    padding: 14px; border-top: 1px solid var(--border);
  }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  .control-group { margin-bottom: 12px; background: #0e131f; padding: 12px 14px; border-radius: 8px; border: 1px solid #222b40; }
  .control-group label { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 5px; font-weight: bold; }
  .control-group input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; }
  .inline-inputs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .num-input, select.num-input {
    background: #0a0e17; color: #fff; border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 6px; width: 92px; font-size: 0.92rem;
  }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-weight: bold; color: #55ffaa; font-size: 0.92rem; margin-bottom: 8px;
  }
  .checkbox-row input { width: 17px; height: 17px; accent-color: var(--primary); cursor: pointer; }

  .progress-container {
    display: none; margin-top: 10px; background: #0b0f18;
    border-radius: 8px; padding: 10px 12px; border: 1px solid var(--border);
  }
  .progress-bar-bg { width: 100%; height: 12px; background: #1e2638; border-radius: 6px; overflow: hidden; margin-top: 6px; }
  .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), #55ffaa); transition: width 0.08s; }

  /* 静止画プレビューの上：常時表示ツールバー */
  .viewer-top-controls {
    margin-top: 12px; background: #141a29; border: 2px solid var(--border);
    border-bottom: none; border-radius: 10px 10px 0 0; padding: 10px 14px;
  }
  .viewer-col-jumps {
    display: none; gap: 6px; align-items: center; overflow-x: auto;
    padding-top: 8px; margin-top: 8px; border-top: 1px solid #26314d;
  }

  /* 静止画プレビュー本体 */
  .viewer-box {
    position: relative; background: #07090e; border: 2px solid var(--border);
    overflow: hidden; display: flex; flex-direction: column;
  }
  .viewer-box.fullscreen {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 9999; margin: 0; border-radius: 0; border: none;
  }
  .exit-fullscreen-btn {
    display: none; position: fixed; top: 16px; right: 20px;
    z-index: 10001; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.75);
    padding: 10px 18px; font-size: 0.95rem;
  }
  .viewer-box.fullscreen .exit-fullscreen-btn {
    display: inline-flex;
  }

  .viewer-viewport {
    position: relative; width: 100%; height: 580px; overflow: hidden;
    cursor: grab; background: #000; user-select: none;
  }
  .viewer-box.fullscreen .viewer-viewport { height: 100vh; }
  .viewer-viewport.dragging { cursor: grabbing; }
  #canvasStage {
    transform-origin: 0 0;
    position: absolute; top: 0; left: 0;
    box-shadow: 0 0 25px rgba(0,0,0,0.8);
    will-change: transform;
  }
  #outputCanvas { display: block; }

  /* 軽量化されたGPUアクセラレーション再生位置バー */
  #playheadColHighlight {
    position: absolute; top: 0; left: 0;
    border: 3px solid rgba(255, 77, 136, 0.55);
    pointer-events: none; display: none;
    will-change: transform, width, height;
  }
  #playheadBar {
    position: absolute; top: 0; left: 0; height: 16px; margin-top: -8px;
    background: rgba(255, 50, 110, 0.22);
    pointer-events: none; display: none;
    will-change: transform, width;
  }
  #playheadBar::after {
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: 3px; margin-top: -1.5px; background: #ff2a6d;
  }
  #playheadTimeBadge {
    position: absolute; left: 0; top: -4px;
    background: #ff2a6d; color: #fff; font-weight: bold;
    font-size: 12px; line-height: 22px; padding: 0 8px;
    border-radius: 3px; white-space: nowrap; z-index: 2;
  }

  /* 静止画プレビューの下：常時表示保存バー */
  .viewer-bottom-save-bar {
    background: #141a29; border: 2px solid var(--border);
    border-top: none; border-radius: 0 0 10px 10px; padding: 10px 14px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px;
  }

  .hint { font-size: 0.82rem; color: var(--muted); }
</style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>プロセカ譜面動画 静止画メーカー</h1>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn" id="linkRootFolderBtn">同階層フォルダを登録（自動読み込み設定）</button>
      <button class="btn btn-secondary" id="selectFolderBtn">フォルダ選択</button>
      <button class="btn btn-secondary" id="selectVideoBtn">動画選択</button>
      <button class="btn btn-secondary" id="selectImagesBtn">画像選択</button>
      <input type="file" id="videoInput" accept="video/*" multiple style="display:none;">
      <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none;">
      <input type="file" id="imagesInput" accept="image/*" multiple style="display:none;">
    </div>
  </header>

  <!-- プレビュー最上部：フォルダ切り替えバー（フォルダ名ボタン1つで動画と静止画を同時に切り替え） -->
  <div class="top-switcher-card" id="topSwitcherCard">
    <div class="switcher-header">
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <strong style="color:var(--primary); font-size:0.95rem;">フォルダ・ファイル切り替えバー</strong>
        <span class="hint" id="folderStatusLabel">右上の「同階層フォルダを登録」で index.html のあるフォルダを選ぶと、次回から自動読み込みされます</span>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="btn btn-accent" id="reconnectFolderBtn" style="display:none; padding:6px 14px; font-size:0.85rem;">同階層フォルダを自動読み込み</button>
        <button class="btn btn-secondary" id="refreshFolderBtn" style="display:none; padding:5px 11px; font-size:0.82rem;">再スキャン</button>
      </div>
    </div>

    <div id="switcherContent" style="display:none;">
      <div class="folder-tabs" id="folderTabs"></div>
    </div>
  </div>

  <!-- 動画プレビューと静止画プレビューを統合したメイン枠 -->
  <div class="step-card" id="unifiedPreviewCard">

    <!-- 1. 上部：動画プレビュー -->
    <div class="preview-wrapper">
      <video id="videoPreview" playsinline></video>
      <canvas id="previewCanvas" width="640" height="360"></canvas>
    </div>

    <!-- 2. 再生ボタン ＆ シークバー（常時表示） -->
    <div class="main-transport-bar">
      <button class="btn" id="playPauseBtn" style="padding:7px 16px;">再生 / 一時停止</button>
      <input type="range" id="seekSlider" min="0" max="100" step="0.02" value="0">
      <span id="currentTimeLabel" style="font-size:0.88rem; font-weight:bold; min-width:135px; text-align:right;">0.00 秒 / 0.00 秒</span>
    </div>

    <!-- 3. 静止画の作成・停止・複数動画同時処理・高さ変更再生成パネル（常時表示） -->
    <div class="always-panel" style="border-color:#00a8a8;">
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;">
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <button class="btn btn-accent" id="generateBtn" disabled>現在の動画から静止画を作成</button>
          <button class="btn" id="batchGenerateBtn" disabled>複数動画を同時処理して一括作成</button>
          <button class="btn btn-secondary" id="testGenerateBtn" disabled>最初の12秒だけテスト作成</button>
          <button class="btn btn-danger" id="stopGenerateBtn" disabled>生成を停止</button>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <span style="font-size:0.88rem; font-weight:bold; color:#55ffaa;">1列の高さ(px):</span>
          <input type="number" id="colHeightInput" class="num-input" step="100" min="400" max="16000" value="5400" style="width:90px;">
          <select id="layoutMode" class="num-input" style="width:185px;">
            <option value="grid" selected>1枚の一覧画像に折り返して並べる</option>
            <option value="single">折り返さずに1本の縦長画像にする</option>
          </select>
          <button class="btn btn-secondary" id="reLayoutBtn" disabled>高さを変更して再生成</button>
        </div>
      </div>
    </div>

    <!-- 進捗バー（生成処理中のみ表示） -->
    <div class="progress-container" id="progressContainer">
      <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.88rem; gap:10px;">
        <span id="progressText">譜面を合成しています...</span>
        <div style="display:flex; align-items:center; gap:10px;">
          <span id="progressPercent" style="font-weight:bold;">0%</span>
          <button class="btn btn-danger" id="progressStopBtn" style="padding:4px 10px; font-size:0.8rem;">停止</button>
        </div>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- 4. 詳細設定タブ（切り抜き範囲・黒背景フィルター・速度設定） -->
    <details class="details-tab-wrap" id="detailsTab">
      <summary class="details-tab-summary">
        <span>詳細設定を開く / 閉じる</span>
        <span class="hint" id="currentViewFileName"></span>
      </summary>

      <div class="details-tab-body">
        <div class="grid-2">
          <div>
            <!-- 時間と左右切り抜き -->
            <div class="control-group">
              <label><span>① 合成する時間範囲 ＆ 左右の切り抜き範囲</span></label>
              <div class="inline-inputs">
                <span>開始(秒):</span>
                <input type="number" id="startTimeInput" class="num-input" step="0.1" value="2.1">
                <button class="btn btn-secondary" id="setStartBtn" style="padding:5px 9px; font-size:0.8rem;">今の位置を開始</button>
              </div>
              <div class="inline-inputs" style="margin-top:6px;">
                <span>終了(秒):</span>
                <input type="number" id="endTimeInput" class="num-input" step="0.1" value="118.5">
                <button class="btn btn-secondary" id="setEndBtn" style="padding:5px 9px; font-size:0.8rem;">今の位置を終了</button>
              </div>
              <div class="inline-inputs" style="margin-top:8px;">
                <span style="width:65px; font-size:0.85rem;">左端 <span id="leftVal">18</span>%:</span>
                <input type="range" id="cropLeftSlider" min="0" max="45" step="0.5" value="18" style="flex:1;">
                <span style="width:65px; font-size:0.85rem;">右端 <span id="rightVal">78.5</span>%:</span>
                <input type="range" id="cropRightSlider" min="55" max="100" step="0.5" value="78.5" style="flex:1;">
              </div>
            </div>
          </div>

          <div>
            <!-- 黒背景フィルター設定 -->
            <div class="control-group">
              <label class="checkbox-row">
                <input type="checkbox" id="blackBgToggle" checked>
                <span>背景イラストを消して見やすくする</span>
              </label>
              <div id="blackBgControls">
                <label>
                  <span>背景消去しきい値（イラストの除去強度）</span>
                  <span id="bgThreshLabel">36</span>
                </label>
                <input type="range" id="bgThreshSlider" min="25" max="110" step="1" value="36">
                <label style="margin-top:6px;">
                  <span>16分音符の横線・レーン縦線のくっきり度</span>
                  <span id="gridBoostLabel">0.5倍</span>
                </label>
                <input type="range" id="gridBoostSlider" min="0.5" max="3.5" step="0.1" value="0.5">
              </div>
            </div>

            <!-- スクロール速度＆自動キャリブレーション設定 -->
            <div class="control-group">
              <label class="checkbox-row" style="margin-bottom:6px;">
                <input type="checkbox" id="autoCalibToggle" checked>
                <span>動画ごとに基準速度を自動検出して合わせる（速度違いの動画に対応）</span>
              </label>
              <div id="manualSpeedControls">
                <label>
                  <span>② スクロール速度（画面高さに対する % / 秒）</span>
                  <span id="speedValLabel">47.50 %/秒</span>
                </label>
                <input type="range" id="speedSlider" min="15" max="110" step="0.02" value="47.50">
                <div class="inline-inputs" style="justify-content: space-between;">
                  <div>
                    <span>微調整:</span>
                    <input type="number" id="speedInput" class="num-input" step="0.02" value="47.50">
                  </div>
                  <button class="btn btn-secondary" id="autoSpeedBtn" style="padding:6px 12px; font-size:0.84rem;">今すぐ速度を自動計測する</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </details>

    <!-- 5. 静止画プレビューの上：静止画ビューアー表示操作 ＆ 再生位置バー設定（常時表示） -->
    <div class="viewer-top-controls">
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:space-between;">
        <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
          <strong style="color:var(--primary); font-size:0.9rem; margin-right:4px;">ビューアー操作:</strong>
          <button class="btn btn-secondary" id="zoomOutBtn" style="padding:5px 10px;">ー 縮小</button>
          <span id="zoomLevelLabel" style="min-width:55px; text-align:center; font-weight:bold;">100%</span>
          <button class="btn btn-secondary" id="zoomInBtn" style="padding:5px 10px;">＋ 拡大</button>
          <button class="btn btn-secondary" id="fitAllBtn" style="padding:5px 10px; font-size:0.84rem;">全体を表示</button>
          <button class="btn btn-secondary" id="fitHeightBtn" style="padding:5px 10px; font-size:0.84rem;">高さに合わせる</button>
          <button class="btn btn-secondary" id="zoom100Btn" style="padding:5px 10px; font-size:0.84rem;">1:1 等倍</button>
          <button class="btn btn-secondary" id="fullscreenBtn" style="padding:5px 12px; font-size:0.84rem;">全画面表示</button>
        </div>
        <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
          <label style="display:flex; align-items:center; gap:6px; font-size:0.86rem; cursor:pointer; color:#55ffaa; font-weight:bold; margin:0;">
            <input type="checkbox" id="showPlayheadToggle" checked style="accent-color:var(--primary);">
            再生位置バーを表示
          </label>
          <label style="display:flex; align-items:center; gap:6px; font-size:0.86rem; cursor:pointer; font-weight:bold; margin:0;">
            <input type="checkbox" id="followPlayheadToggle" style="accent-color:var(--primary);">
            再生位置を自動追従
          </label>
        </div>
      </div>
      <div class="viewer-col-jumps" id="colJumpBar"></div>
    </div>

    <!-- 6. 静止画プレビュー本体 -->
    <div class="viewer-box" id="viewerBox">
      <button class="btn btn-accent exit-fullscreen-btn" id="exitFullscreenBtn">全画面表示から戻る (Esc)</button>

      <div class="viewer-viewport" id="viewerViewport" title="マウスホイールで拡大縮小・ドラッグで移動・ダブルクリックでその位置の秒数へ動画をシークします">
        <div id="canvasStage">
          <canvas id="outputCanvas"></canvas>
          <div id="playheadColHighlight"></div>
          <div id="playheadBar"><span id="playheadTimeBadge">0.00s</span></div>
        </div>
      </div>
    </div>

    <!-- 7. 静止画プレビューの下：保存ボタンバー（常時表示） -->
    <div class="viewer-bottom-save-bar">
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <button class="btn" id="downloadPngBtn">1枚の譜面画像 (.png) を保存</button>
        <button class="btn btn-secondary" id="downloadResultZipBtn">全体＋分割画像をZIPで保存</button>
      </div>
      <span class="hint" id="bottomSaveStatusLabel"></span>
    </div>

  </div>
</div>

<script>
// =========================================================
// 1. ZIPファイル生成エンジン
// =========================================================
const CRC32_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[i] = c >>> 0;
  }
  return table;
})();

function crc32(u8) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) crc = (crc >>> 8) ^ CRC32_TABLE[(crc ^ u8[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function createZipBlob(files) {
  const encoder = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  for (const file of files) {
    const nameBytes = encoder.encode(file.name);
    const dataBytes = (file.data instanceof Uint8Array) ? file.data : encoder.encode(file.data);
    const crc = crc32(dataBytes);
    const size = dataBytes.length;

    const lfh = new Uint8Array(30 + nameBytes.length);
    const lfv = new DataView(lfh.buffer);
    lfv.setUint32(0, 0x04034b50, true);
    lfv.setUint16(4, 20, true);
    lfv.setUint16(6, 0x0800, true);
    lfv.setUint16(8, 0, true);
    lfv.setUint16(10, 0, true);
    lfv.setUint16(12, 0x5421, true);
    lfv.setUint32(14, crc, true);
    lfv.setUint32(18, size, true);
    lfv.setUint32(22, size, true);
    lfv.setUint16(26, nameBytes.length, true);
    lfv.setUint16(28, 0, true);
    lfh.set(nameBytes, 30);
    localParts.push(lfh, dataBytes);

    const cdh = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(cdh.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0x0800, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, 0, true);
    cdv.setUint16(14, 0x5421, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, size, true);
    cdv.setUint32(24, size, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    cdh.set(nameBytes, 46);

    centralParts.push(cdh);
    offset += lfh.length + size;
  }

  let cdSize = 0;
  for (const part of centralParts) cdSize += part.length;

  const eocd = new Uint8Array(22);
  const eocdv = new DataView(eocd.buffer);
  eocdv.setUint32(0, 0x06054b50, true);
  eocdv.setUint16(8, files.length, true);
  eocdv.setUint16(10, files.length, true);
  eocdv.setUint32(12, cdSize, true);
  eocdv.setUint32(16, offset, true);

  return new Blob([...localParts, ...centralParts, eocd], { type: "application/zip" });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

async function canvasToUint8Array(canvas) {
  return new Promise((resolve) => {
    canvas.toBlob(async (blob) => {
      const buf = await blob.arrayBuffer();
      resolve(new Uint8Array(buf));
    }, "image/png");
  });
}

// 2. 高速化された黒背景フィルター
// =========================================================
const blackBgToggle = document.getElementById("blackBgToggle");
const bgThreshSlider = document.getElementById("bgThreshSlider");
const bgThreshLabel = document.getElementById("bgThreshLabel");
const gridBoostSlider = document.getElementById("gridBoostSlider");
const gridBoostLabel = document.getElementById("gridBoostLabel");

function applyBlackBackgroundFilter(ctx, width, height) {
  if (!blackBgToggle.checked) return;

  const thresh = parseInt(bgThreshSlider.value, 10) || 36;
  const gridBoost = parseFloat(gridBoostSlider.value) || 0.5;
  const threshPlus22 = thresh + 22;
  const threshPlus6 = thresh + 6;
  const threshMinus5 = thresh - 5;
  const threshMinus15 = thresh - 15;

  const imgData = ctx.getImageData(0, 0, width, height);
  const data = imgData.data;
  const totalPixels = width * height;
  const lum = new Float32Array(totalPixels);

  for (let i = 0, p = 0; p < totalPixels; i += 4, p++) {
    lum[p] = data[i] * 0.25 + data[i + 1] * 0.45 + data[i + 2] * 0.30;
  }

  for (let y = 0; y < height; y++) {
    const yUp = (y > 1 ? y - 2 : 0) * width;
    const yDown = (y < height - 2 ? y + 2 : height - 1) * width;
    const yUp1 = (y > 0 ? y - 1 : 0) * width;
    const yDown1 = (y < height - 1 ? y + 1 : height - 1) * width;
    const rowOffset = y * width;

    for (let x = 0; x < width; x++) {
      const p = rowOffset + x;
      const idx = p << 2;
      const r = data[idx];
      const g = data[idx + 1];
      const b = data[idx + 2];

      const maxC = r > g ? (r > b ? r : b) : (g > b ? g : b);
      const minC = r < g ? (r < b ? r : b) : (g < b ? g : b);
      const sat = maxC - minC;

      const isNoteOrText = (maxC > threshPlus22) || (g > threshPlus6) || (sat > 38 && maxC > threshMinus5);

      if (isNoteOrText) {
        let alpha = (maxC - threshMinus15) * 0.02857;
        if (alpha > 1.0) alpha = 1.0;
        else if (alpha < 0.2) alpha = 0.2;
        const factor = maxC < 120 ? alpha * 1.12 : alpha;
        data[idx]     = r * factor > 255 ? 255 : r * factor;
        data[idx + 1] = g * factor > 255 ? 255 : g * factor;
        data[idx + 2] = b * factor > 255 ? 255 : b * factor;
      } else {
        const vBg = (lum[yUp + x] + lum[yDown + x]) * 0.5;
        const h1 = lum[p] - vBg;
        const h2 = (lum[yUp1 + x] + lum[yDown1 + x]) * 0.5 - vBg;
        const hLinePeak = h1 > h2 ? (h1 > 0 ? h1 : 0) : (h2 > 0 ? h2 : 0);

        const xLeft = x > 1 ? x - 2 : 0;
        const xRight = x < width - 2 ? x + 2 : width - 1;
        const hBg = (lum[rowOffset + xLeft] + lum[rowOffset + xRight]) * 0.5;
        const vLinePeak = (lum[p] - hBg) * 0.9;

        const lineStrength = hLinePeak > vLinePeak ? hLinePeak : vLinePeak;

        if (lineStrength > 2.2) {
          let lineVal = (lineStrength * 8.5 * gridBoost) | 0;
          if (lineVal > 220) lineVal = 220;
          data[idx]     = (lineVal * 0.78) | 0;
          data[idx + 1] = (lineVal * 0.88) | 0;
          data[idx + 2] = lineVal;
        } else {
          data[idx]     = 0;
          data[idx + 1] = 0;
          data[idx + 2] = 0;
        }
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);
}

function openHandleDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("ProsekaChartMakerLocalDB", 1);
    req.onupgradeneeded = (e) => {
      e.target.result.createObjectStore("handles");
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function saveDirHandleToDB(handle) {
  try {
    const db = await openHandleDB();
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").put(handle, "rootDir");
  } catch (e) {}
}

async function getDirHandleFromDB() {
  try {
    const db = await openHandleDB();
    return new Promise((resolve) => {
      const tx = db.transaction("handles", "readonly");
      const req = tx.objectStore("handles").get("rootDir");
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) {
    return null;
  }
}

async function scanDirectoryHandle(dirHandle, path = "", collected = []) {
  for await (const entry of dirHandle.values()) {
    if (entry.kind === "file") {
      if (/\.(mp4|mov|webm|mkv|avi|png|jpe?g|webp|bmp)$/i.test(entry.name)) {
        const file = await entry.getFile();
        // 直下にファイルがある場合は拡張子を除いたファイル名をグループ名にし、サブフォルダにある場合はサブフォルダ名にする
        const baseName = entry.name.replace(/\.[^.]+$/, "");
        file._customFolder = path || baseName;
        collected.push(file);
      }
    } else if (entry.kind === "directory") {
      const subPath = path ? `${path}/${entry.name}` : entry.name;
      await scanDirectoryHandle(entry, subPath, collected);
    }
  }
  return collected;
}

async function loadFromSavedHandle(requestPerm = false) {
  if (!savedDirectoryHandle) return;
  try {
    let perm = await savedDirectoryHandle.queryPermission({ mode: "read" });
    if (perm !== "granted" && requestPerm) {
      perm = await savedDirectoryHandle.requestPermission({ mode: "read" });
    }
    if (perm === "granted") {

      const files = await scanDirectoryHandle(savedDirectoryHandle, "");

      folderStatusLabel.textContent = `右のボタンを押すと、登録済みの同階層フォルダ「${savedDirectoryHandle.name}」から全フォルダを一括読み込みします`;
    }
  } catch (e) {}
}

async function traverseFileTree(item, path, collected) {
  if (item.isFile) {
    const file = await new Promise((res) => item.file(res));
    const baseName = file.name.replace(/\.[^.]+$/, "");
    file._customFolder = path || baseName;
    collected.push(file);
  } else if (item.isDirectory) {
    const dirReader = item.createReader();
    let entries = [];
    let batch;
    do {
      batch = await new Promise((res) => dirReader.readEntries(res));
      entries = entries.concat(batch);
    } while (batch.length > 0);
    const nextPath = path ? `${path}/${item.name}` : item.name;
    for (const entry of entries) {
      await traverseFileTree(entry, nextPath, collected);
    }
  }
}

function handleIncomingFiles(files) {
  let firstFolder = "";

  for (const f of files) {
    const isVid = f.type.startsWith("video/") || /\.(mp4|mov|webm|mkv|avi)$/i.test(f.name);
    const isImg = f.type.startsWith("image/") || /\.(png|jpe?g|webp|bmp)$/i.test(f.name);
    if (!isVid && !isImg) continue;

    let folderName = f._customFolder || "";
    if (!folderName && f.webkitRelativePath) {
      const parts = f.webkitRelativePath.split("/");
      parts.pop(); // ファイル名を除去
      if (parts.length > 1) {
        parts.shift(); // 選択した親フォルダ名そのものを除き、同階層のサブフォルダ名を取得
      }
      folderName = parts.join("/");
    }
    if (!folderName) {
      folderName = f.name.replace(/\.[^.]+$/, "");
    }

    if (!folderGroups.has(folderName)) {
      folderGroups.set(folderName, { images: [], videos: [] });
    }
    const group = folderGroups.get(folderName);
    const entry = { name: f.name, file: f, url: null, folderName: folderName };

    if (isVid) {
      const idx = group.videos.findIndex(v => v.name === f.name);
      if (idx >= 0) group.videos[idx] = entry;
      else group.videos.push(entry);
    } else if (isImg) {
      const idx = group.images.findIndex(img => img.name === f.name);
      if (idx >= 0) group.images[idx] = entry;
      else group.images.push(entry);
    }

    if (!firstFolder) firstFolder = folderName;
  }

  for (const [, grp] of folderGroups) {
    grp.images.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    grp.videos.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  }

  if (folderGroups.size > 0) {
    switcherContent.style.display = "block";
    const targetFolder = (activeFolderName && folderGroups.has(activeFolderName))
      ? activeFolderName
      : (firstFolder || Array.from(folderGroups.keys())[0]);
    selectFolderSet(targetFolder);
  }
  updateBatchButtonState();
}

function extractMasterFromExternalImage(img, ctx, labelName) {
  const W = img.width;
  const H = img.height;
  const tStart = parseFloat(startTimeInput.value) || 2.1;
  const tEnd = parseFloat(endTimeInput.value) || (video.duration ? Math.max(tStart + 1, video.duration - 4.0) : 118.5);

  const colGap = 14;
  const headerH = 36;
  const expectedColMaxH = H - headerH - colGap * 2;

  let mode = "single";
  let numCols = 1;
  let calcCropW = W;
  let colMaxH = H;

  if (W > H * 0.25 && expectedColMaxH > 400) {
    const scanY = headerH + colGap + Math.round(expectedColMaxH * 0.5);
    const rowData = ctx.getImageData(0, scanY, W, 1).data;

    let bestNumCols = 1;
    for (let candCols = 2; candCols <= 40; candCols++) {
      const cwFloat = (W - (candCols + 1) * colGap) / candCols;
      if (cwFloat < 120 || cwFloat > 1200) continue;
      if (Math.abs(cwFloat - Math.round(cwFloat)) < 0.15) {
        const cw = Math.round(cwFloat);
        const borderX = colGap + cw + 1;
        const idx = borderX * 4;
        if (Math.abs(rowData[idx] - 43) < 25 && Math.abs(rowData[idx + 2] - 86) < 30) {
          bestNumCols = candCols;
          calcCropW = cw;
          break;
        }
      }
    }

    if (bestNumCols === 1 && W > H * 0.65) {
      let estCropW = currentColumnWidths || Math.round((video.videoWidth || 640) * ((parseFloat(cropRightSlider.value) - parseFloat(cropLeftSlider.value)) / 100));
      if (!estCropW || estCropW < 50) estCropW = 370;
      bestNumCols = Math.max(1, Math.round((W - colGap) / (estCropW + colGap)));
      calcCropW = Math.round((W - (bestNumCols + 1) * colGap) / bestNumCols);
    }

    if (bestNumCols > 1 && calcCropW >= 80) {
      mode = "grid";
      numCols = bestNumCols;
      colMaxH = expectedColMaxH;
    }
  }

  currentColumnWidths = calcCropW;
  const totalHeight = numCols * colMaxH;

  const numChunks = Math.ceil(totalHeight / MASTER_CHUNK_H);
  const chunks = [];
  for (let k = 0; k < numChunks; k++) {
    const ch = document.createElement("canvas");
    ch.width = calcCropW;
    ch.height = MASTER_CHUNK_H;
    chunks.push(ch);
  }

  lastGeneratedColumns = [];
  for (let c = 0; c < numCols; c++) {
    const colC = document.createElement("canvas");
    colC.width = calcCropW;
    colC.height = colMaxH;
    const colCtx = colC.getContext("2d");
    const sx = mode === "grid" ? colGap + c * (calcCropW + colGap) : 0;
    const sy = mode === "grid" ? headerH + colGap : 0;
    colCtx.drawImage(img, sx, sy, calcCropW, colMaxH, 0, 0, calcCropW, colMaxH);
    lastGeneratedColumns.push(colC);

    const colBottomStart = c * colMaxH;
    const startChunk = Math.floor(colBottomStart / MASTER_CHUNK_H);
    const endChunk = Math.floor((colBottomStart + colMaxH - 1) / MASTER_CHUNK_H);
    for (let k = startChunk; k <= endChunk; k++) {
      const chunkBottomStart = k * MASTER_CHUNK_H;
      const overlapBottom = Math.max(colBottomStart, chunkBottomStart);
      const overlapTop = Math.min(colBottomStart + colMaxH, chunkBottomStart + MASTER_CHUNK_H);
      const copyH = overlapTop - overlapBottom;
      if (copyH <= 0) continue;

      const srcY = colMaxH - (overlapBottom - colBottomStart) - copyH;
      const dstY = MASTER_CHUNK_H - (overlapBottom - chunkBottomStart) - copyH;
      chunks[k].getContext("2d").drawImage(colC, 0, srcY, calcCropW, copyH, 0, dstY, calcCropW, copyH);
    }
  }

  masterChartData = {
    hasData: true,
    cropW: calcCropW,
    totalHeight: totalHeight,
    chunks: chunks,
    tStart: tStart,
    tEnd: tEnd,
    timeToYMap: [],
    sourceLabel: labelName
  };
  reLayoutBtn.disabled = false;

  chartMeta = {
    isGenerated: false,
    mode: mode,
    numCols: numCols,
    cropW: calcCropW,
    colMaxH: colMaxH,
    colGap: mode === "grid" ? colGap : 0,
    headerH: mode === "grid" ? headerH : 0,
    totalHeight: totalHeight,
    tStart: tStart,
    tEnd: tEnd,
    scale: 1,
    timeToYMap: []
  };
}

// =========================================================
// 5. マスター譜面データから「1列の高さ」を変更して即時再生成する関数
// =========================================================
function rebuildLayoutFromMaster() {
  if (!masterChartData.hasData) return;

  const { cropW, totalHeight, chunks, tStart, tEnd, timeToYMap, sourceLabel } = masterChartData;
  const colMaxH = Math.max(400, parseInt(colHeightInput.value, 10) || 5400);
  const mode = layoutMode.value;
  const numCols = Math.max(1, Math.ceil(totalHeight / colMaxH));
  const colGap = 14;
  const headerH = 36;

  const newColumns = [];
  for (let c = 0; c < numCols; c++) {
    const colC = document.createElement("canvas");
    colC.width = cropW;
    colC.height = colMaxH;
    const colCtx = colC.getContext("2d");
    colCtx.fillStyle = "#000000";
    colCtx.fillRect(0, 0, cropW, colMaxH);

    const colBottomStart = c * colMaxH;
    const colBottomEnd = Math.min(totalHeight, colBottomStart + colMaxH);
    const startChunk = Math.floor(colBottomStart / MASTER_CHUNK_H);
    const endChunk = Math.floor((colBottomEnd - 1) / MASTER_CHUNK_H);

    for (let k = startChunk; k <= endChunk; k++) {
      if (k < 0 || k >= chunks.length) continue;
      const chunkBottomStart = k * MASTER_CHUNK_H;
      const overlapBottom = Math.max(colBottomStart, chunkBottomStart);
      const overlapTop = Math.min(colBottomEnd, chunkBottomStart + MASTER_CHUNK_H);
      const copyH = overlapTop - overlapBottom;
      if (copyH <= 0) continue;

      const srcY = MASTER_CHUNK_H - (overlapBottom - chunkBottomStart) - copyH;
      const dstY = colMaxH - (overlapBottom - colBottomStart) - copyH;
      colCtx.drawImage(chunks[k], 0, srcY, cropW, copyH, 0, dstY, cropW, copyH);
    }
    newColumns.push(colC);
  }

  lastGeneratedColumns = newColumns;
  currentColumnWidths = cropW;

  let singleScale = 1;
  if (mode === "single") {
    const maxAllowedH = 16000;
    singleScale = totalHeight > maxAllowedH ? (maxAllowedH / totalHeight) : 1;
    outputCanvas.width = Math.round(cropW * singleScale);
    outputCanvas.height = Math.round(totalHeight * singleScale);
    const outCtx = outputCanvas.getContext("2d");
    outCtx.imageSmoothingEnabled = true;
    outCtx.imageSmoothingQuality = "high";
    outCtx.fillStyle = "#000000";
    outCtx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
    outCtx.scale(singleScale, singleScale);

    for (let c = 0; c < numCols; c++) {
      const destY = totalHeight - (c + 1) * colMaxH;
      outCtx.drawImage(newColumns[c], 0, destY);
    }
  } else {
    const totalW = numCols * cropW + (numCols + 1) * colGap;
    const fullH = colMaxH + headerH + colGap * 2;
    outputCanvas.width = totalW;
    outputCanvas.height = fullH;
    const outCtx = outputCanvas.getContext("2d");

    outCtx.fillStyle = blackBgToggle.checked ? "#05070b" : "#161c2e";
    outCtx.fillRect(0, 0, totalW, fullH);

    for (let c = 0; c < numCols; c++) {
      const x = colGap + c * (cropW + colGap);
      const y = headerH + colGap;

      outCtx.fillStyle = "#00e6e6";
      outCtx.font = "bold 15px 'Segoe UI', 'Meiryo', sans-serif";
      outCtx.fillText(`列 ${c + 1} / ${numCols} （下から上へ進行）`, x + 6, headerH - 4);

      outCtx.drawImage(newColumns[c], x, y);
      outCtx.strokeStyle = "#2b3856";
      outCtx.lineWidth = 2;
      outCtx.strokeRect(x, y, cropW, colMaxH);
    }
  }

  chartMeta = {
    isGenerated: true,
    mode: mode,
    numCols: numCols,
    cropW: cropW,
    colMaxH: colMaxH,
    colGap: colGap,
    headerH: headerH,
    totalHeight: totalHeight,
    tStart: tStart,
    tEnd: tEnd,
    scale: singleScale,
    timeToYMap: timeToYMap
  };

  const infoText = `${sourceLabel || activeFolderName || "生成譜面"} [1列の高さ: ${colMaxH}px / 全${numCols}列] (${outputCanvas.width} x ${outputCanvas.height} px)`;
  currentViewFileName.textContent = infoText;
  bottomSaveStatusLabel.textContent = infoText;
  setupViewerAfterGenerate(numCols);
  drawPlayheadOverlay();
}

  if (masterChartData.hasData) rebuildLayoutFromMaster();
});

function loadVideoItem(vidItem) {
  activeVideoName = vidItem.name;

  const srcUrl = vidItem.file ? URL.createObjectURL(vidItem.file) : vidItem.url;
  video.src = srcUrl;
  video.muted = false;
  video.volume = 1.0;
  video.load();
  video.onloadedmetadata = () => {
    previewCanvas.width = video.videoWidth || 640;
    previewCanvas.height = video.videoHeight || 360;
    const dur = video.duration;
    seekSlider.max = dur.toFixed(2);

    const defaultStart = Math.min(2.1, dur * 0.1);
    const defaultEnd = Math.max(defaultStart + 1, dur > 8 ? dur - 4.0 : dur);
    startTimeInput.value = defaultStart.toFixed(1);
    endTimeInput.value = defaultEnd.toFixed(1);

    if (!chartMeta.isGenerated) {
      chartMeta.tStart = defaultStart;
      chartMeta.tEnd = defaultEnd;
    }

    generateBtn.disabled = false;
    testGenerateBtn.disabled = false;
    updateBatchButtonState();

    video.currentTime = defaultStart;
  };
}

function drawPreview(forceFilter = false) {
  if (!video.videoWidth) return;
  const w = previewCanvas.width;
  const h = previewCanvas.height;
  pCtx.drawImage(video, 0, 0, w, h);

  const leftPct = parseFloat(cropLeftSlider.value) / 100;
  const rightPct = parseFloat(cropRightSlider.value) / 100;
  const x1 = Math.round(w * leftPct);
  const x2 = Math.round(w * rightPct);
  const cw = x2 - x1;

  if ((video.paused || forceFilter) && blackBgToggle.checked && cw > 10) {
    if (filterSubCanvas.width !== cw || filterSubCanvas.height !== h) {
      filterSubCanvas.width = cw;
      filterSubCanvas.height = h;
    }
    filterSubCtx.drawImage(video, x1, 0, cw, h, 0, 0, cw, h);
    applyBlackBackgroundFilter(filterSubCtx, cw, h);
    pCtx.drawImage(filterSubCanvas, x1, 0);
  }

  pCtx.fillStyle = "rgba(0, 0, 0, 0.72)";
  pCtx.fillRect(0, 0, x1, h);
  pCtx.fillRect(x2, 0, w - x2, h);

  pCtx.strokeStyle = "#00d4d4";
  pCtx.lineWidth = 2;
  pCtx.strokeRect(x1, 0, cw, h);

  const capY = Math.round(h * 0.70);
  pCtx.strokeStyle = "#ff4d88";
  pCtx.setLineDash([6, 4]);
  pCtx.beginPath();
  pCtx.moveTo(x1, capY);
  pCtx.lineTo(x2, capY);
  pCtx.stroke();
  pCtx.setLineDash([]);
}

// =========================================================
// 6. 軽量化された「再生位置バー」の描画＆逆シーク連携
// =========================================================
function getBottomYForTime(t) {
  const { tStart, tEnd, totalHeight, timeToYMap } = chartMeta;
  if (timeToYMap && timeToYMap.length >= 2) {
    if (t <= timeToYMap[0].time) return timeToYMap[0].bottomY;
    const last = timeToYMap[timeToYMap.length - 1];
    if (t >= last.time) return last.bottomY;
    let low = 0, high = timeToYMap.length - 1;
    while (low <= high) {
      const mid = (low + high) >> 1;
      if (timeToYMap[mid].time < t) low = mid + 1;
      else high = mid - 1;
    }
    const p1 = timeToYMap[Math.max(0, low - 1)];
    const p2 = timeToYMap[Math.min(timeToYMap.length - 1, low)];
    const ratio = (p2.time - p1.time) > 0.0001 ? (t - p1.time) / (p2.time - p1.time) : 0;
    return p1.bottomY + ratio * (p2.bottomY - p1.bottomY);
  } else {
    const dur = Math.max(0.1, tEnd - tStart);
    const ratio = Math.max(0, Math.min(1, (t - tStart) / dur));
    return ratio * totalHeight;
  }
}

function getTimeForBottomY(targetBottomY) {
  const { tStart, tEnd, totalHeight, timeToYMap } = chartMeta;
  if (timeToYMap && timeToYMap.length >= 2) {
    if (targetBottomY <= timeToYMap[0].bottomY) return timeToYMap[0].time;
    const last = timeToYMap[timeToYMap.length - 1];
    if (targetBottomY >= last.bottomY) return last.time;
    for (let i = 1; i < timeToYMap.length; i++) {
      if (timeToYMap[i].bottomY >= targetBottomY) {
        const p1 = timeToYMap[i - 1];
        const p2 = timeToYMap[i];
        const dy = p2.bottomY - p1.bottomY;
        const r = dy > 0.001 ? (targetBottomY - p1.bottomY) / dy : 0;
        return p1.time + r * (p2.time - p1.time);
      }
    }
  }
  const ratio = Math.max(0, Math.min(1, targetBottomY / Math.max(1, totalHeight)));
  return tStart + ratio * (tEnd - tStart);
}

function drawPlayheadOverlay() {
  if (!outputCanvas.width || !outputCanvas.height || !showPlayheadToggle.checked) {
    playheadBar.style.display = "none";
    playheadColHighlight.style.display = "none";
    return;
  }

  const t = video.currentTime || 0;
  const bottomY = getBottomYForTime(t);

  let barX = 0, barY = 0, barW = chartMeta.cropW;
  let colIndex = 0;

  if (chartMeta.mode === "single") {
    const scale = chartMeta.scale || 1;
    barX = 0;
    barW = outputCanvas.width;
    barY = outputCanvas.height - bottomY * scale;
    playheadColHighlight.style.display = "none";
  } else {
    const { colMaxH, cropW, colGap, headerH, numCols } = chartMeta;
    colIndex = Math.min(numCols - 1, Math.max(0, Math.floor(bottomY / colMaxH)));
    const relBottom = bottomY - colIndex * colMaxH;
    barX = colGap + colIndex * (cropW + colGap);
    barY = headerH + colGap + (colMaxH - relBottom);
    barW = cropW;

    playheadColHighlight.style.display = "block";
    playheadColHighlight.style.width = `${barW}px`;
    playheadColHighlight.style.height = `${colMaxH}px`;
    playheadColHighlight.style.transform = `translate3d(${barX}px, ${headerH + colGap}px, 0)`;
  }

  playheadBar.style.display = "block";
  playheadBar.style.width = `${barW}px`;
  playheadBar.style.transform = `translate3d(${barX}px, ${barY}px, 0)`;
  playheadTimeBadge.textContent = `${t.toFixed(2)}s`;

  if (followPlayheadToggle.checked && !isDragging) {
    const vw = viewerViewport.clientWidth;
    const vh = viewerViewport.clientHeight;
    vX = vw * 0.5 - (barX + barW * 0.5) * vScale;
    vY = vh * 0.55 - barY * vScale;
    updateViewerTransform();
  }
}

let animFrameId = null;

      seekSlider.value = video.currentTime;

      drawPreview(false);
      drawPlayheadOverlay();
      animFrameId = requestAnimationFrame(tick);
    }
  };
  cancelAnimationFrame(animFrameId);

}

function seekVideoElementTo(vidElem, timeSec) {
  return new Promise((resolve) => {
    const target = Math.min(Math.max(0, timeSec), vidElem.duration || timeSec);
    if (Math.abs(vidElem.currentTime - target) < 0.0005) {
      resolve();
      return;
    }
    const onSeeked = () => {
      vidElem.removeEventListener("seeked", onSeeked);
      resolve();
    };
    vidElem.addEventListener("seeked", onSeeked);
    vidElem.currentTime = target;
  });
}

// =========================================================
// 7. 速度が違う動画に対する高精度ハイブリッド移動量検出エンジン
// =========================================================
function computeFrameRowFeatures(imgData, cw, h) {
  const edgeProfile = new Float32Array(h);
  const brightProfile = new Float32Array(h);

  for (let y = 2; y < h - 2; y++) {
    const rowCurr = y * cw;
    const rowUp = (y - 2) * cw;
    const rowDown = (y + 2) * cw;
    let eSum = 0;
    let bSum = 0;

    for (let x = 0; x < cw; x += 2) {
      const iCurr = (rowCurr + x) << 2;
      const iUp = (rowUp + x) << 2;
      const iDown = (rowDown + x) << 2;

      const r = imgData[iCurr], g = imgData[iCurr + 1], b = imgData[iCurr + 2];
      const lumCurr = r * 0.25 + g * 0.45 + b * 0.30;
      const lumBg = (
        (imgData[iUp] * 0.25 + imgData[iUp + 1] * 0.45 + imgData[iUp + 2] * 0.30) +
        (imgData[iDown] * 0.25 + imgData[iDown + 1] * 0.45 + imgData[iDown + 2] * 0.30)
      ) * 0.5;

      const edge = lumCurr - lumBg;
      if (edge > 2.0) eSum += edge;

      const maxC = r > g ? (r > b ? r : b) : (g > b ? g : b);
      const minC = r < g ? (r < b ? r : b) : (g < b ? g : b);
      if (maxC > 75 || (maxC - minC) > 35) {
        bSum += maxC;
      }
    }
    edgeProfile[y] = eSum / (cw * 0.5);
    brightProfile[y] = bSum / (cw * 0.5);
  }
  return { edgeProfile, brightProfile };
}

function matchFrameDisplacementHighPrecision(img1, img2, feat1, feat2, cw, h, minDy, maxDy, expectedDy = -1) {
  const yStart = Math.round(h * 0.16);
  const yEnd = Math.round(h * 0.66);
  const searchMin = Math.max(0, Math.floor(minDy));
  const searchMax = Math.min(Math.round(h * 0.45), Math.ceil(maxDy));

  if (searchMax <= searchMin) return expectedDy > 0 ? expectedDy : -1;

  const scores = new Float64Array(searchMax + 2);
  scores.fill(Infinity);
  let bestDy = -1;
  let minScore = Infinity;

  const e1 = feat1.edgeProfile, b1 = feat1.brightProfile;
  const e2 = feat2.edgeProfile, b2 = feat2.brightProfile;

  for (let dy = searchMin; dy <= searchMax; dy++) {
    let profDiff = 0;
    let validRows = 0;
    let activeSignal = 0;

    for (let y = yStart; y < yEnd; y++) {
      const y2 = y + dy;
      if (y2 >= h - 2) break;
      const de = Math.abs(e1[y] - e2[y2]);
      const db = Math.abs(b1[y] - b2[y2]) * 0.25;
      profDiff += de + db;
      activeSignal += e1[y] + b1[y] * 0.1;
      validRows++;
    }

    if (validRows < 20 || activeSignal < 8) continue;

    let pixDiff = 0;
    let pixCount = 0;
    for (let y = yStart; y < yEnd; y += 3) {
      const y2 = y + dy;
      if (y2 >= h - 2) break;
      const row1 = y * cw;
      const row2 = y2 * cw;
      for (let x = 0; x < cw; x += 4) {
        const idx1 = (row1 + x) << 2;
        const idx2 = (row2 + x) << 2;
        const sum1 = img1[idx1] + img1[idx1 + 1] + img1[idx1 + 2];
        const sum2 = img2[idx2] + img2[idx2 + 1] + img2[idx2 + 2];
        if (sum1 > 115 || sum2 > 115) {
          pixDiff += Math.abs(img1[idx1] - img2[idx2]) +
                     Math.abs(img1[idx1 + 1] - img2[idx2 + 1]) +
                     Math.abs(img1[idx1 + 2] - img2[idx2 + 2]);
          pixCount++;
        }
      }
    }

    const normProf = profDiff / validRows;
    const normPix = pixCount > 15 ? (pixDiff / pixCount) * 0.18 : 12.0;
    let totalScore = normProf + normPix;

    if (expectedDy >= 0) {
      const dev = Math.abs(dy - expectedDy);
      totalScore += dev * 0.035;
    }

    scores[dy] = totalScore;
    if (totalScore < minScore) {
      minScore = totalScore;
      bestDy = dy;
    }
  }

  if (bestDy >= searchMin && bestDy <= searchMax && minScore < 45) {
    if (bestDy > searchMin && bestDy < searchMax) {
      const sPrev = scores[bestDy - 1];
      const sCurr = scores[bestDy];
      const sNext = scores[bestDy + 1];
      if (isFinite(sPrev) && isFinite(sNext)) {
        const denom = 2 * (sPrev - 2 * sCurr + sNext);
        const subOffset = denom !== 0 ? (sPrev - sNext) / denom : 0;
        return bestDy + Math.max(-0.5, Math.min(0.5, subOffset));
      }
    }
    return bestDy;
  }
  return -1;
}

async function calibrateVideoSpeed(vidElem, cropLeftPct, cropRightPct, tStart, tEnd) {
  const w = vidElem.videoWidth;
  const h = vidElem.videoHeight;
  const x1 = Math.round(w * cropLeftPct);
  const x2 = Math.round(w * cropRightPct);
  const cw = x2 - x1;

  const tmpC = document.createElement("canvas");
  tmpC.width = cw;
  tmpC.height = h;
  const ctx = tmpC.getContext("2d", { willReadFrequently: true });

  const samples = [];
  const sampleCount = 10;
  const span = Math.max(1.0, tEnd - tStart);

  for (let i = 0; i < sampleCount; i++) {
    if (cancelGenerationRequested) break;
    const dt = (i % 2 === 0) ? 0.08 : 0.12;
    const t = tStart + (span * (i + 1)) / (sampleCount + 2);
    if (t + dt >= (vidElem.duration || tEnd)) continue;

    await seekVideoElementTo(vidElem, t);
    ctx.drawImage(vidElem, x1, 0, cw, h, 0, 0, cw, h);
    const img1 = new Uint8ClampedArray(ctx.getImageData(0, 0, cw, h).data);
    const feat1 = computeFrameRowFeatures(img1, cw, h);

    await seekVideoElementTo(vidElem, t + dt);
    ctx.drawImage(vidElem, x1, 0, cw, h, 0, 0, cw, h);
    const img2 = new Uint8ClampedArray(ctx.getImageData(0, 0, cw, h).data);
    const feat2 = computeFrameRowFeatures(img2, cw, h);

    const actualDt = Math.max(0.01, vidElem.currentTime - t);
    const minDy = Math.max(1, Math.round(h * 0.08 * actualDt));
    const maxDy = Math.round(h * 1.35 * actualDt);

    const exactDy = matchFrameDisplacementHighPrecision(img1, img2, feat1, feat2, cw, h, minDy, maxDy, -1);
    if (exactDy > 0) {
      const pctPerSec = (exactDy / h / actualDt) * 100;
      if (pctPerSec >= 10 && pctPerSec <= 130) {
        samples.push(pctPerSec);
      }
    }
  }

  if (samples.length === 0) return null;
  samples.sort((a, b) => a - b);
  const mid = Math.floor(samples.length / 2);
  let sum = 0, cnt = 0;
  for (let i = Math.max(0, mid - 1); i <= Math.min(samples.length - 1, mid + 1); i++) {
    sum += samples[i];
    cnt++;
  }
  return sum / cnt;
}

autoSpeedBtn.addEventListener("click", async () => {
  if (!video.videoWidth) return;
  video.pause();
  const prevMuted = video.muted;
  video.muted = true;
  autoSpeedBtn.disabled = true;
  autoSpeedBtn.textContent = "高精度計測中...";
  cancelGenerationRequested = false;

  try {
    const leftPct = parseFloat(cropLeftSlider.value) / 100;
    const rightPct = parseFloat(cropRightSlider.value) / 100;
    const tStart = parseFloat(startTimeInput.value) || 2.0;
    const tEnd = parseFloat(endTimeInput.value) || 15.0;

    const measured = await calibrateVideoSpeed(video, leftPct, rightPct, tStart, tEnd);
    if (measured !== null) {
      const rounded = (Math.round(measured * 50) / 50).toFixed(2);
      speedInput.value = rounded;
      speedSlider.value = rounded;
      speedValLabel.textContent = `${rounded} %/秒`;
    }
  } finally {
    autoSpeedBtn.disabled = false;
    autoSpeedBtn.textContent = "今すぐ速度を自動計測する";
    await seekVideoElementTo(video, parseFloat(startTimeInput.value) || 2.0);
    video.muted = prevMuted;
  }
});

// =========================================================
// 8. 超高速・フレームロック吸着補正対応の譜面合成エンジン（停止機能付き）
// =========================================================
function requestStopGeneration() {
  cancelGenerationRequested = true;
  stopGenerateBtn.disabled = true;
  progressText.textContent = "生成を停止しています...";
}
stopGenerateBtn.addEventListener("click", requestStopGeneration);
progressStopBtn.addEventListener("click", requestStopGeneration);

async function buildMasterDataForVideoElement(vidElem, sourceName, isTestMode, onStepProgress) {
  const w = vidElem.videoWidth;
  const h = vidElem.videoHeight;
  const leftPct = parseFloat(cropLeftSlider.value) / 100;
  const rightPct = parseFloat(cropRightSlider.value) / 100;
  const x1 = Math.round(w * leftPct);
  const x2 = Math.round(w * rightPct);
  const cropW = x2 - x1;

  const dur = vidElem.duration || 120;
  const userStart = parseFloat(startTimeInput.value);
  const userEnd = parseFloat(endTimeInput.value);
  const tStart = !isNaN(userStart) ? Math.min(userStart, dur * 0.5) : Math.min(2.1, dur * 0.1);
  const fullEnd = (!isNaN(userEnd) && userEnd <= dur) ? userEnd : Math.max(tStart + 1, dur > 8 ? dur - 4.0 : dur);
  const tEnd = isTestMode ? Math.min(fullEnd, tStart + 12.0) : fullEnd;
  const duration = Math.max(0.5, tEnd - tStart);

  let baseSpeedPct = parseFloat(speedInput.value) || 47.50;
  if (autoCalibToggle.checked && !cancelGenerationRequested) {
    const calibrated = await calibrateVideoSpeed(vidElem, leftPct, rightPct, tStart, tEnd);
    if (calibrated !== null) {
      baseSpeedPct = calibrated;
      if (vidElem === video) {
        const rounded = (Math.round(calibrated * 50) / 50).toFixed(2);
        speedInput.value = rounded;
        speedSlider.value = rounded;
        speedValLabel.textContent = `${rounded} %/秒`;
      }
    }
  }
  const baseSpeedPxPerSec = h * (baseSpeedPct / 100);

  const stepPx = 36;
  const overlapPx = 4;

  const capY = Math.round(h * 0.70);
  const bottomBaseH = h - capY;
  const topSafeY = Math.round(h * 0.07);

  const masterChunks = [];
  const masterCtxs = [];

  function ensureMasterChunkExists(k) {
    while (masterChunks.length <= k) {
      const mc = document.createElement("canvas");
      mc.width = cropW;
      mc.height = MASTER_CHUNK_H;
      const mctx = mc.getContext("2d", { willReadFrequently: true });
      mctx.imageSmoothingEnabled = true;
      mctx.imageSmoothingQuality = "high";
      mctx.fillStyle = "#000000";
      mctx.fillRect(0, 0, cropW, MASTER_CHUNK_H);
      masterChunks.push(mc);
      masterCtxs.push(mctx);
    }
  }

  function drawSliceToMaster(srcCanvas, srcY, srcH, bottomY, alpha = 1.0) {
    if (srcH <= 0.1) return;
    const startChunk = Math.floor(bottomY / MASTER_CHUNK_H);
    const endChunk = Math.floor((bottomY + srcH - 0.001) / MASTER_CHUNK_H);
    for (let k = startChunk; k <= endChunk; k++) {
      if (k < 0) continue;
      ensureMasterChunkExists(k);
      const chunkBottomOffset = k * MASTER_CHUNK_H;
      const relBottom = bottomY - chunkBottomOffset;
      const destY = MASTER_CHUNK_H - relBottom - srcH;
      const ctx = masterCtxs[k];
      if (alpha < 0.99) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.drawImage(srcCanvas, 0, srcY, cropW, srcH, 0, destY, cropW, srcH);
        ctx.restore();
      } else {
        ctx.drawImage(srcCanvas, 0, srcY, cropW, srcH, 0, destY, cropW, srcH);
      }
    }
  }

  const frameCanvas = document.createElement("canvas");
  frameCanvas.width = cropW;
  frameCanvas.height = h;
  const fCtx = frameCanvas.getContext("2d", { willReadFrequently: true });
  fCtx.imageSmoothingEnabled = true;
  fCtx.imageSmoothingQuality = "high";

  let currentBottomY = 0;
  const timeToYMap = [];

  const dt = stepPx / baseSpeedPxPerSec;
  const totalSteps = Math.floor(duration / dt);

  let prevImgData = null;
  let prevFeat = null;
  let prevActualTime = tStart;
  let lastSliceHeight = stepPx;

  for (let step = 0; step <= totalSteps; step++) {
    if (cancelGenerationRequested) break;

    const exactTime = tStart + (step * stepPx) / baseSpeedPxPerSec;
    await seekVideoElementTo(vidElem, exactTime);
    const currActualTime = vidElem.currentTime;

    fCtx.drawImage(vidElem, x1, 0, cropW, h, 0, 0, cropW, h);
    const currImgData = new Uint8ClampedArray(fCtx.getImageData(0, 0, cropW, h).data);
    const currFeat = computeFrameRowFeatures(currImgData, cropW, h);

    if (step === 0) {
      if (bottomBaseH > 0) {
        drawSliceToMaster(frameCanvas, capY, bottomBaseH, 0, 1.0);
        currentBottomY += bottomBaseH;
      }
      timeToYMap.push({ time: currActualTime, bottomY: currentBottomY });
      prevImgData = currImgData;
      prevFeat = currFeat;
      prevActualTime = currActualTime;
      continue;
    }

    const realDt = Math.max(0.0001, currActualTime - prevActualTime);
    const nominalDy = realDt * baseSpeedPxPerSec;
    let actualDy = nominalDy;

    if (nominalDy >= 3) {
      const lockMin = Math.max(1, Math.floor(nominalDy - 8));
      const lockMax = Math.ceil(nominalDy + 8);
      const lockedDy = matchFrameDisplacementHighPrecision(
        prevImgData, currImgData, prevFeat, currFeat, cropW, h, lockMin, lockMax, nominalDy
      );
      if (lockedDy > 0 && Math.abs(lockedDy - nominalDy) <= 7.5) {
        actualDy = lockedDy * 0.75 + nominalDy * 0.25;
      }
    }

    if (actualDy > 0.2) {
      const sy = Math.max(0, Math.min(h - actualDy, capY - actualDy));
      drawSliceToMaster(frameCanvas, sy, actualDy, currentBottomY, 1.0);

      if (overlapPx > 0 && currentBottomY > overlapPx) {
        const featherSy = Math.max(0, Math.min(h - overlapPx, sy + actualDy - overlapPx * 0.5));
        drawSliceToMaster(frameCanvas, featherSy, overlapPx, currentBottomY - overlapPx * 0.5, 0.45);
      }

      currentBottomY += actualDy;
      lastSliceHeight = actualDy;
    }

    timeToYMap.push({ time: currActualTime, bottomY: currentBottomY });
    prevImgData = currImgData;
    prevFeat = currFeat;
    prevActualTime = currActualTime;

    if (step === totalSteps) {
      const topCapH = Math.max(0, (capY - lastSliceHeight) - topSafeY);
      if (topCapH > 0) {
        drawSliceToMaster(frameCanvas, topSafeY, topCapH, currentBottomY, 1.0);
        currentBottomY += topCapH;
      }
    }

    if (onStepProgress && (step % 8 === 0 || step === totalSteps)) {
      onStepProgress((step + 1) / (totalSteps + 1), exactTime, tEnd);
    }
  }

  const totalHeight = Math.max(100, Math.round(currentBottomY));

  if (blackBgToggle.checked && masterChunks.length > 0) {
    for (let k = 0; k < masterChunks.length; k++) {
      applyBlackBackgroundFilter(masterCtxs[k], cropW, MASTER_CHUNK_H);
    }
  }

  const actualLastTime = timeToYMap.length > 0 ? timeToYMap[timeToYMap.length - 1].time : tEnd;

  return {
    hasData: masterChunks.length > 0,
    cropW: cropW,
    totalHeight: totalHeight,
    chunks: masterChunks,
    tStart: tStart,
    tEnd: actualLastTime,
    timeToYMap: timeToYMap,
    sourceLabel: sourceName
  };
}

async function generateChartImage(isTestMode = false) {
  if (!video.videoWidth) return;
  video.pause();
  const prevMuted = video.muted;
  video.muted = true;
  cancelGenerationRequested = false;

  const startWallTime = performance.now();
  generateBtn.disabled = true;
  batchGenerateBtn.disabled = true;
  testGenerateBtn.disabled = true;
  reLayoutBtn.disabled = true;
  stopGenerateBtn.disabled = false;
  progressContainer.style.display = "block";
  progressText.textContent = "動画のスクロール速度を解析・合成準備中...";

  try {
    const label = activeFolderName || (activeVideoName ? activeVideoName.replace(/\.[^.]+$/, "") : "生成譜面");
    const resultData = await buildMasterDataForVideoElement(
      video,
      label,
      isTestMode,
      (ratio, exactTime, tEnd) => {
        const pct = Math.min(100, Math.round(ratio * 100));
        progressPercent.textContent = `${pct}%`;
        progressBar.style.width = `${pct}%`;
        progressText.textContent = `高速合成中... (${exactTime.toFixed(1)}秒 / ${tEnd.toFixed(1)}秒)`;
      }
    );

    if (resultData.hasData) {
      masterChartData = resultData;
      // 現在のフォルダセットにも生成済みデータを紐づける（フォルダ切り替え時に動画と一緒に復元できるようにする）
      if (activeFolderName && folderGroups.has(activeFolderName)) {
        const grp = folderGroups.get(activeFolderName);
        grp.images = [{ name: `${activeFolderName}_譜面.png`, file: null, url: null, masterData: resultData }];
      }
      rebuildLayoutFromMaster();
    }

    const elapsedSec = ((performance.now() - startWallTime) / 1000).toFixed(1);
    if (cancelGenerationRequested) {
      progressText.textContent = `静止画の生成を停止しました（停止時点までの譜面を表示しています / ${elapsedSec}秒）`;
    } else {
      progressText.textContent = `譜面静止画の作成が完了しました（処理時間: ${elapsedSec}秒）`;
    }
  } finally {
    video.muted = prevMuted;
    stopGenerateBtn.disabled = true;
    generateBtn.disabled = false;
    updateBatchButtonState();
    testGenerateBtn.disabled = false;
    reLayoutBtn.disabled = !masterChartData.hasData;
    drawPreview(true);
  }
}

// 複数動画同時処理（各フォルダの動画ごとに静止画を生成してフォルダセットに紐づける）
async function processMultipleVideosConcurrently() {
  const vidEntries = getAllLoadedVideoEntries();
  if (vidEntries.length === 0) return;
  if (vidEntries.length === 1) {
    await generateChartImage(false);
    return;
  }

  video.pause();
  cancelGenerationRequested = false;
  const startWallTime = performance.now();
  generateBtn.disabled = true;
  batchGenerateBtn.disabled = true;
  testGenerateBtn.disabled = true;
  reLayoutBtn.disabled = true;
  stopGenerateBtn.disabled = false;
  progressContainer.style.display = "block";

  const progressMap = new Float32Array(vidEntries.length);
  function updateBatchProgressUI() {
    if (cancelGenerationRequested) return;
    let sum = 0;
    for (let i = 0; i < progressMap.length; i++) sum += progressMap[i];
    const pct = Math.min(100, Math.round((sum / vidEntries.length) * 100));
    progressPercent.textContent = `${pct}%`;
    progressBar.style.width = `${pct}%`;
    progressText.textContent = `複数動画 (${vidEntries.length}本) を同時処理中... (${pct}%)`;
  }

  const concurrency = Math.min(3, vidEntries.length);
  let cursor = 0;
  let completedCount = 0;
  let firstCompletedFolder = "";

  async function worker() {
    while (cursor < vidEntries.length && !cancelGenerationRequested) {
      const idx = cursor++;
      const { videoEntry, folderName } = vidEntries[idx];
      const tempVid = document.createElement("video");
      tempVid.playsInline = true;
      tempVid.muted = true;
      const srcUrl = videoEntry.file ? URL.createObjectURL(videoEntry.file) : videoEntry.url;
      tempVid.src = srcUrl;
      tempVid.load();

      await new Promise((resolve) => {
        tempVid.onloadedmetadata = resolve;
        tempVid.onerror = resolve;
      });

      if (tempVid.videoWidth && !cancelGenerationRequested) {
        const mData = await buildMasterDataForVideoElement(
          tempVid,
          folderName,
          false,
          (ratio) => {
            progressMap[idx] = ratio;
            updateBatchProgressUI();
          }
        );
        if (mData.hasData) {
          progressMap[idx] = 1.0;
          updateBatchProgressUI();
          completedCount++;
          if (!firstCompletedFolder) firstCompletedFolder = folderName;

          const grp = folderGroups.get(folderName);
          if (grp) {
            grp.images = [{
              name: `${folderName}_譜面.png`,
              file: null,
              url: null,
              masterData: mData
            }];
          }
        }
      }

      if (videoEntry.file) URL.revokeObjectURL(srcUrl);
      tempVid.src = "";
    }
  }

  try {
    const workers = [];
    for (let w = 0; w < concurrency; w++) workers.push(worker());
    await Promise.all(workers);

    if (firstCompletedFolder) {
      switcherContent.style.display = "block";
      selectFolderSet(firstCompletedFolder);
    }

    const elapsedSec = ((performance.now() - startWallTime) / 1000).toFixed(1);
    if (cancelGenerationRequested) {
      progressText.textContent = `同時処理を停止しました（完了分 ${completedCount} フォルダ / ${elapsedSec}秒）`;
    } else {
      progressText.textContent = `全 ${completedCount} フォルダの同時処理が完了しました（処理時間: ${elapsedSec}秒） 上部のフォルダ名ボタンで動画と静止画を一緒に切り替えられます`;
    }
  } finally {
    stopGenerateBtn.disabled = true;
    generateBtn.disabled = false;
    updateBatchButtonState();
    testGenerateBtn.disabled = false;
    reLayoutBtn.disabled = !masterChartData.hasData;
  }
}

generateBtn.addEventListener("click", () => generateChartImage(false));
batchGenerateBtn.addEventListener("click", processMultipleVideosConcurrently);
testGenerateBtn.addEventListener("click", () => generateChartImage(true));

// =========================================================
// 9. ソフト内蔵「譜面ビューアー」＆全画面表示切り替え・戻るボタン
// =========================================================
const viewerBox = document.getElementById("viewerBox");
const viewerViewport = document.getElementById("viewerViewport");
const zoomLevelLabel = document.getElementById("zoomLevelLabel");
const zoomInBtn = document.getElementById("zoomInBtn");
const zoomOutBtn = document.getElementById("zoomOutBtn");
const fitAllBtn = document.getElementById("fitAllBtn");
const fitHeightBtn = document.getElementById("fitHeightBtn");
const zoom100Btn = document.getElementById("zoom100Btn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const exitFullscreenBtn = document.getElementById("exitFullscreenBtn");
const colJumpBar = document.getElementById("colJumpBar");

let vScale = 1.0;
let vX = 0;
let vY = 0;
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;

function updateViewerTransform() {
  canvasStage.style.transform = `translate3d(${vX}px, ${vY}px, 0) scale(${vScale})`;
  zoomLevelLabel.textContent = `${Math.round(vScale * 100)}%`;
}

function fitViewerAll() {
  if (!outputCanvas.width) return;
  const vw = viewerViewport.clientWidth;
  const vh = viewerViewport.clientHeight;
  vScale = Math.min((vw - 20) / outputCanvas.width, (vh - 20) / outputCanvas.height, 1.5);
  vX = Math.max(10, (vw - outputCanvas.width * vScale) / 2);
  vY = Math.max(10, (vh - outputCanvas.height * vScale) / 2);
  updateViewerTransform();
}

function fitViewerHeight() {
  if (!outputCanvas.height) return;
  const vh = viewerViewport.clientHeight;
  vScale = (vh - 20) / outputCanvas.height;
  vX = 10;
  vY = 10;
  updateViewerTransform();
}

function zoomAtCenter(factor) {
  const vw = viewerViewport.clientWidth;
  const vh = viewerViewport.clientHeight;
  const cx = vw / 2;
  const cy = vh / 2;
  const newScale = Math.min(4.0, Math.max(0.05, vScale * factor));
  const ratio = newScale / vScale;
  vX = cx - (cx - vX) * ratio;
  vY = cy - (cy - vY) * ratio;
  vScale = newScale;
  updateViewerTransform();
}

function setupViewerAfterGenerate(numCols) {
  colJumpBar.innerHTML = `<span style="font-size:0.82rem; color:#9aa5b8; white-space:nowrap;">列へジャンプ:</span>`;
  if (chartMeta.mode === "grid" && numCols > 1) {
    colJumpBar.style.display = "flex";
    for (let c = 0; c < numCols; c++) {
      const btn = document.createElement("button");
      btn.className = "btn btn-secondary";
      btn.style.padding = "4px 10px";
      btn.style.fontSize = "0.8rem";
      btn.style.whiteSpace = "nowrap";
      btn.textContent = `${c + 1}列目`;
      btn.addEventListener("click", () => {
        const colGap = chartMeta.colGap || 14;
        const colX = colGap + c * (chartMeta.cropW + colGap);
        vScale = Math.min(1.2, Math.max(0.4, viewerViewport.clientWidth / (chartMeta.cropW * 2.2)));
        vX = 30 - colX * vScale;
        vY = 10;
        updateViewerTransform();
      });
      colJumpBar.appendChild(btn);
    }
  } else {
    colJumpBar.style.display = "none";
  }

  setTimeout(fitViewerAll, 50);
}

viewerViewport.addEventListener("dblclick", (e) => {
  if (!video.src || !outputCanvas.width) return;
  const rect = viewerViewport.getBoundingClientRect();
  const canvasX = (e.clientX - rect.left - vX) / vScale;
  const canvasY = (e.clientY - rect.top - vY) / vScale;

  let clickedBottomY = 0;
  if (chartMeta.mode === "single") {
    clickedBottomY = (outputCanvas.height - canvasY) / (chartMeta.scale || 1);
  } else {
    const { colGap, cropW, headerH, colMaxH, numCols } = chartMeta;
    const colIdx = Math.max(0, Math.min(numCols - 1, Math.floor((canvasX - colGap) / (cropW + colGap))));
    const relY = Math.max(0, Math.min(colMaxH, canvasY - (headerH + colGap)));
    const relBottom = colMaxH - relY;
    clickedBottomY = colIdx * colMaxH + relBottom;
  }

  const targetTime = getTimeForBottomY(clickedBottomY);
  video.currentTime = Math.max(0, Math.min(video.duration || targetTime, targetTime));
});

zoomInBtn.addEventListener("click", () => zoomAtCenter(1.25));
zoomOutBtn.addEventListener("click", () => zoomAtCenter(0.8));
fitAllBtn.addEventListener("click", fitViewerAll);
fitHeightBtn.addEventListener("click", fitViewerHeight);
zoom100Btn.addEventListener("click", () => { vScale = 1.0; vX = 10; vY = 10; updateViewerTransform(); });

function setViewerFullscreen(enable) {
  if (enable) {
    viewerBox.classList.add("fullscreen");
    fullscreenBtn.textContent = "全画面を閉じる (Esc)";
  } else {
    viewerBox.classList.remove("fullscreen");
    fullscreenBtn.textContent = "全画面表示";
  }
  setTimeout(fitViewerAll, 50);
}

fullscreenBtn.addEventListener("click", () => {
  setViewerFullscreen(!viewerBox.classList.contains("fullscreen"));
});

exitFullscreenBtn.addEventListener("click", () => {
  setViewerFullscreen(false);
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && viewerBox.classList.contains("fullscreen")) {
    setViewerFullscreen(false);
  }
});

viewerViewport.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = viewerViewport.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.15 : 0.87;
  const newScale = Math.min(4.5, Math.max(0.05, vScale * factor));
  const ratio = newScale / vScale;
  vX = mx - (mx - vX) * ratio;
  vY = my - (my - vY) * ratio;
  vScale = newScale;
  updateViewerTransform();
}, { passive: false });

viewerViewport.addEventListener("mousedown", (e) => {
  if (e.target === exitFullscreenBtn) return;
  isDragging = true;
  dragStartX = e.clientX - vX;
  dragStartY = e.clientY - vY;
  viewerViewport.classList.add("dragging");
});
window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  vX = e.clientX - dragStartX;
  vY = e.clientY - dragStartY;
  updateViewerTransform();
});
window.addEventListener("mouseup", () => {
  isDragging = false;
  viewerViewport.classList.remove("dragging");
});

// =========================================================
// 10. PNG画像＆ZIP一括ダウンロード保存（常時表示バー）
// =========================================================
downloadPngBtn.addEventListener("click", () => {
  if (!outputCanvas.width) return;
  outputCanvas.toBlob((blob) => {
    const prefix = activeFolderName || "Proseka_Chart";
    downloadBlob(blob, `${prefix}.png`);
  }, "image/png");
});

downloadResultZipBtn.addEventListener("click", async () => {
  if (!outputCanvas.width) return;
  downloadResultZipBtn.disabled = true;
  downloadResultZipBtn.textContent = "ZIPファイルを作成中...";
  try {
    const files = [];
    const prefix = activeFolderName || "Proseka_Chart";
    const fullPngBytes = await canvasToUint8Array(outputCanvas);
    files.push({ name: `00_${prefix}_全体一覧.png`, data: fullPngBytes });

    for (let i = 0; i < lastGeneratedColumns.length; i++) {
      const colBytes = await canvasToUint8Array(lastGeneratedColumns[i]);
      const num = String(i + 1).padStart(2, "0");
      files.push({ name: `${prefix}_分割列_${num}.png`, data: colBytes });
    }

    const zipBlob = createZipBlob(files);
    downloadBlob(zipBlob, `${prefix}_Images.zip`);
  } finally {
    downloadResultZipBtn.disabled = false;
    downloadResultZipBtn.textContent = "全体＋分割画像をZIPで保存";
  }
});
