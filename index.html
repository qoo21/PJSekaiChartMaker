// =========================================================
// メディアスレッドの実フレーム時刻 (mediaTime) と完全同期するシーク関数
// =========================================================
function waitTwoAnimationFrames() {
  return new Promise((resolve) => {
    if (!document.hidden && window.requestAnimationFrame) {
      requestAnimationFrame(() => {
        requestAnimationFrame(resolve);
      });
    } else {
      setTimeout(resolve, 34);
    }
  });
}

function seekVideoElementTo(vidElem, timeSec) {
  return new Promise((resolve) => {
    if (cancelGenerationRequested) {
      resolve({ elapsedMs: 0, mediaTime: timeSec });
      return;
    }
    const startWall = performance.now();
    const maxSafeTime = vidElem.duration ? Math.max(0, vidElem.duration - 0.04) : timeSec;
    const target = Math.min(Math.max(0, timeSec), maxSafeTime);

    if (Math.abs(vidElem.currentTime - target) < 0.0005 && !vidElem.seeking && vidElem.readyState >= 2) {
      resolve({ elapsedMs: 0, mediaTime: vidElem.currentTime });
      return;
    }

    let settled = false;
    let rvfcId = null;
    let capturedMediaTime = null;

    if ("requestVideoFrameCallback" in vidElem) {
      try {
        rvfcId = vidElem.requestVideoFrameCallback((now, metadata) => {
          if (metadata && typeof metadata.mediaTime === "number") {
            capturedMediaTime = metadata.mediaTime;
          }
        });
      } catch (e) {}
    }

    const finish = () => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      if (rvfcId !== null && vidElem.cancelVideoFrameCallback) {
        try { vidElem.cancelVideoFrameCallback(rvfcId); } catch (e) {}
      }
      activeSeekResolvers.delete(finish);
      vidElem.removeEventListener("seeked", onSeeked);
      vidElem.removeEventListener("error", finish);
      resolve({
        elapsedMs: performance.now() - startWall,
        mediaTime: capturedMediaTime !== null ? capturedMediaTime : vidElem.currentTime
      });
    };

    const waitUntilReadyAndPainted = async () => {
      let guard = 0;
      while ((vidElem.seeking || vidElem.readyState < 2) && guard < 40 && !cancelGenerationRequested) {
        await new Promise(r => setTimeout(r, 12));
        guard++;
      }
      await waitTwoAnimationFrames();
      finish();
    };

    const onSeeked = () => {
      waitUntilReadyAndPainted();
    };

    activeSeekResolvers.add(finish);
    const timer = setTimeout(finish, 2500);
    vidElem.addEventListener("seeked", onSeeked);
    vidElem.addEventListener("error", finish);
    try {
      vidElem.currentTime = target;
    } catch (e) {
      finish();
    }
  });
}

// =========================================================
// 7. 基準スクロール速度の自動計測
// =========================================================
autoSpeedBtn.addEventListener("click", async () => {
  if (!video.videoWidth || isGenerating) return;
  video.pause();
  const prevMuted = video.muted;
  video.muted = true;
  autoSpeedBtn.disabled = true;
  autoSpeedBtn.textContent = "計測中...";
  cancelGenerationRequested = false;

  try {
    const w = video.videoWidth;
    const h = video.videoHeight;
    const x1 = Math.round(w * (parseFloat(cropLeftSlider.value) / 100));
    const x2 = Math.round(w * (parseFloat(cropRightSlider.value) / 100));
    const cw = Math.max(10, x2 - x1);

    const tmpC = document.createElement("canvas");
    tmpC.width = cw;
    tmpC.height = h;
    const ctx = tmpC.getContext("2d", { willReadFrequently: true });

    const dur = video.duration || 30;
    const tStart = Math.min(dur * 0.2, Math.max(2.5, (parseFloat(startTimeInput.value) || 0) + 2.5));
    const tEnd = Math.min(dur - 2.0, tStart + 25.0);
    const dt = 0.15;
    const samples = [];

    for (let i = 0; i < 8; i++) {
      if (cancelGenerationRequested) break;
      const t = tStart + ((tEnd - tStart) * (i + 1)) / 10;
      const s1 = await seekVideoElementTo(video, t);
      const t1 = s1.mediaTime;
      ctx.drawImage(video, x1, 0, cw, h, 0, 0, cw, h);
      const img1 = new Uint8ClampedArray(ctx.getImageData(0, 0, cw, h).data);

      const s2 = await seekVideoElementTo(video, t1 + dt);
      const t2 = s2.mediaTime;
      const realDt = t2 - t1;
      if (realDt <= 0.02) continue;

      ctx.drawImage(video, x1, 0, cw, h, 0, 0, cw, h);
      const img2 = new Uint8ClampedArray(ctx.getImageData(0, 0, cw, h).data);

      const yStart = Math.round(h * 0.25);
      const yEnd = Math.round(h * 0.55);
      const minDy = Math.max(2, Math.round(h * 0.12 * realDt));
      const maxDy = Math.round(h * 1.10 * realDt);

      let bestDy = 0;
      const scores = new Float64Array(maxDy + 2);
      scores.fill(Infinity);
      let minScore = Infinity;

      for (let dy = minDy; dy <= maxDy; dy++) {
        let diffSum = 0, count = 0;
        for (let y = yStart; y < yEnd; y += 2) {
          const y2 = y + dy;
          if (y2 >= h) continue;
          for (let x = 0; x < cw; x += 4) {
            const idx1 = (y * cw + x) * 4;
            const idx2 = (y2 * cw + x) * 4;
            if (img1[idx1] + img1[idx1 + 1] + img1[idx1 + 2] > 180) {
              diffSum += Math.abs(img1[idx1] - img2[idx2]) +
                         Math.abs(img1[idx1 + 1] - img2[idx2 + 1]) +
                         Math.abs(img1[idx1 + 2] - img2[idx2 + 2]);
              count++;
            }
          }
        }
        if (count > 40) {
          const s = diffSum / count;
          scores[dy] = s;
          if (s < minScore) { minScore = s; bestDy = dy; }
        }
      }

      if (bestDy > minDy && bestDy < maxDy && minScore < 55) {
        const sPrev = scores[bestDy - 1];
        const sCurr = scores[bestDy];
        const sNext = scores[bestDy + 1];
        const denom = 2 * (sPrev - 2 * sCurr + sNext);
        const subOffset = denom !== 0 ? (sPrev - sNext) / denom : 0;
        const exactDy = bestDy + Math.max(-0.5, Math.min(0.5, subOffset));
        samples.push((exactDy / h / realDt) * 100);
      }
    }

    tmpC.width = 0;
    tmpC.height = 0;

    if (samples.length > 0) {
      samples.sort((a, b) => a - b);
      const median = samples[Math.floor(samples.length / 2)];
      const rounded = (Math.round(median * 50) / 50).toFixed(2);
      speedInput.value = rounded;
      speedSlider.value = rounded;
      speedValLabel.textContent = `${rounded} %/秒`;
      scheduleSaveSettings();
    }
  } finally {
    autoSpeedBtn.disabled = false;
    autoSpeedBtn.textContent = "速度を自動計測する";
    await seekVideoElementTo(video, parseFloat(startTimeInput.value) || 0.0);
    video.muted = prevMuted;
  }
});

// =========================================================
// 8. 浮動小数点スライス ＋ キーフレーム遅延ガード ＋ 精密タイムスタンプ記録合成エンジン
// =========================================================
function requestStopGeneration() {
  cancelGenerationRequested = true;
  for (const fn of Array.from(activeSeekResolvers)) {
    try { fn(); } catch (e) {}
  }
  activeSeekResolvers.clear();
  setGeneratingLock(false);
  progressText.textContent = "静止画の生成を停止しました";
}
stopGenerateBtn.addEventListener("click", requestStopGeneration);
progressStopBtn.addEventListener("click", requestStopGeneration);

function computeWorkScale(rawH) {
  const resMode = resolutionSelect.value || "original";
  if (resMode === "original") return 1.0;
  const maxH = parseInt(resMode, 10) || 1080;
  return rawH > maxH ? (maxH / rawH) : 1.0;
}

async function buildMasterDataForVideoElement(vidElem, sourceName, isTestMode, onStepProgress) {
  const rawW = vidElem.videoWidth;
  const rawH = vidElem.videoHeight;
  const leftPct = parseFloat(cropLeftSlider.value) / 100;
  const rightPct = parseFloat(cropRightSlider.value) / 100;
  const srcX1 = Math.round(rawW * leftPct);
  const srcX2 = Math.round(rawW * rightPct);
  const srcCropW = Math.max(10, srcX2 - srcX1);

  const workScale = computeWorkScale(rawH);
  const h = Math.max(160, Math.round(rawH * workScale));
  const cropW = Math.max(60, Math.round(srcCropW * workScale));

  const dur = vidElem.duration || 120;
  let tStart = 0.0;
  let fullEnd = Math.max(0.5, dur - 0.04);

  if (vidElem === video) {
    const userStart = parseFloat(startTimeInput.value);
    const userEnd = parseFloat(endTimeInput.value);
    tStart = !isNaN(userStart) ? Math.min(Math.max(0, userStart), Math.max(0, dur - 0.5)) : 0.0;
    fullEnd = (!isNaN(userEnd) && userEnd > tStart)
      ? Math.min(userEnd, Math.max(tStart + 0.5, dur - 0.04))
      : Math.max(tStart + 0.5, dur - 0.04);
  }

  const tEnd = isTestMode ? Math.min(fullEnd, tStart + 12.0) : fullEnd;
  const duration = Math.max(0.5, tEnd - tStart);

  // 1つの基準スクロール速度（%/秒）で固定
  const speedPctPerSec = parseFloat(speedInput.value) || 47.50;
  const speedPxPerSec = Math.max(10, h * (speedPctPerSec / 100));

  // 【改良1】60fpsのフレーム周期（1/30秒 = 0.033333...秒）に完全固定し、
  // 切り出し幅 stepPx を整数に丸めず浮動小数点のまま計算することで、周期的なうなり歪みを解消する
  const dt = 2 / 60;
  const stepPx = dt * speedPxPerSec;
  const overlapPx = 2.0;
  const totalSteps = Math.max(1, Math.floor(duration / dt));

  const capY = Math.round(h * 0.70);
  const bottomBaseH = h - capY;
  const topSafeY = Math.round(h * 0.07);
  const topCapH = Math.max(0, (capY - stepPx) - topSafeY);

  const masterChunks = [];
  const masterCtxs = [];

  function ensureMasterChunkExists(k) {
    while (masterChunks.length <= k) {
      const mc = document.createElement("canvas");
      mc.width = cropW;
      mc.height = MASTER_CHUNK_H;
      const mctx = mc.getContext("2d", { willReadFrequently: true });
      mctx.imageSmoothingEnabled = true;
      mctx.imageSmoothingQuality = "high";
      mctx.fillStyle = "#000000";
      mctx.fillRect(0, 0, cropW, MASTER_CHUNK_H);
      masterChunks.push(mc);
      masterCtxs.push(mctx);
    }
  }

  function drawSliceToMaster(srcCanvas, srcY, srcH, bottomY, alpha = 1.0) {
    if (srcH <= 0.05) return;
    const startChunk = Math.floor(bottomY / MASTER_CHUNK_H);
    const endChunk = Math.floor((bottomY + srcH - 0.0001) / MASTER_CHUNK_H);
    for (let k = startChunk; k <= endChunk; k++) {
      if (k < 0) continue;
      ensureMasterChunkExists(k);
      const chunkBottomOffset = k * MASTER_CHUNK_H;
      const relBottom = bottomY - chunkBottomOffset;
      const destY = MASTER_CHUNK_H - relBottom - srcH;
      const ctx = masterCtxs[k];
      if (alpha < 0.99) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.drawImage(srcCanvas, 0, srcY, cropW, srcH, 0, destY, cropW, srcH);
        ctx.restore();
      } else {
        ctx.drawImage(srcCanvas, 0, srcY, cropW, srcH, 0, destY, cropW, srcH);
      }
    }
  }

  const frameCanvas = document.createElement("canvas");
  frameCanvas.width = cropW;
  frameCanvas.height = h;
  const fCtx = frameCanvas.getContext("2d");
  fCtx.imageSmoothingEnabled = true;
  fCtx.imageSmoothingQuality = "high";

  // 【改良2】キーフレーム跨ぎ等の高負荷区間で「前のコマの絵が残っている（デコード遅延）」ことだけを
  // CPU負荷ゼロ（0.01ms未満）で検知するための極小（24x16px）センサーキャンバス
  const tinyCheckC = document.createElement("canvas");
  tinyCheckC.width = 24;
  tinyCheckC.height = 16;
  const tinyCheckCtx = tinyCheckC.getContext("2d", { willReadFrequently: true });
  let prevTinyData = null;

  let currentBottomY = 0;
  const timeToYMap = [];

  let avgSeekMs = DEVICE_SPEC_PROFILE.baseStepWaitMs;
  let lastProgressUpdateWall = 0;

  for (let step = 0; step <= totalSteps; step++) {
    if (cancelGenerationRequested) break;

    const exactTime = Math.min(tEnd, tStart + step * dt);
    const seekResult = await seekVideoElementTo(vidElem, exactTime);
    if (cancelGenerationRequested) break;

    avgSeekMs = avgSeekMs * 0.8 + seekResult.elapsedMs * 0.2;
    const autoBrakeExtraMs = avgSeekMs > 45 ? Math.min(100, Math.round((avgSeekMs - 45) * 0.75)) : 0;
    const totalWaitMs = DEVICE_SPEC_PROFILE.baseStepWaitMs + autoBrakeExtraMs;
    if (totalWaitMs > 0) {
      await new Promise(r => setTimeout(r, totalWaitMs));
    }
    if (cancelGenerationRequested) break;

    // キーフレーム跨ぎなどでデコーダが一瞬遅れて直前と全く同じフレームバッファを返している場合のみ、最大2回（18ms×2）だけ待つ
    tinyCheckCtx.drawImage(vidElem, srcX1, Math.round(rawH * 0.55), srcCropW, Math.round(rawH * 0.15), 0, 0, 24, 16);
    let currTinyData = new Uint8ClampedArray(tinyCheckCtx.getImageData(0, 0, 24, 16).data);
    if (prevTinyData && step > 0) {
      let retry = 0;
      while (retry < 2 && !cancelGenerationRequested) {
        let diff = 0, active = 0;
        for (let i = 0; i < currTinyData.length; i += 4) {
          const s = currTinyData[i] + currTinyData[i + 1] + currTinyData[i + 2];
          if (s > 130) active++;
          diff += Math.abs(currTinyData[i] - prevTinyData[i]) + Math.abs(currTinyData[i + 1] - prevTinyData[i + 1]);
        }
        // ノーツや線が存在する区間なのに差分がほぼ0（デコード未完了）なら少し待って再取得
        if (active >= 8 && diff < 12) {
          await new Promise(r => setTimeout(r, 18));
          await waitTwoAnimationFrames();
          tinyCheckCtx.drawImage(vidElem, srcX1, Math.round(rawH * 0.55), srcCropW, Math.round(rawH * 0.15), 0, 0, 24, 16);
          currTinyData = new Uint8ClampedArray(tinyCheckCtx.getImageData(0, 0, 24, 16).data);
          retry++;
        } else {
          break;
        }
      }
    }
    prevTinyData = currTinyData;

    const actualMediaTime = seekResult.mediaTime;
    const timeDiff = actualMediaTime - exactTime;
    const rawShiftY = timeDiff * speedPxPerSec;
    const maxShift = stepPx * 0.45;
    const subPixelShiftY = Math.max(-maxShift, Math.min(maxShift, rawShiftY));

    fCtx.drawImage(vidElem, srcX1, 0, srcCropW, rawH, 0, 0, cropW, h);

    if (step === 0 && bottomBaseH > 0) {
      const baseSy = Math.max(0, Math.min(h - bottomBaseH, capY + subPixelShiftY));
      drawSliceToMaster(frameCanvas, baseSy, bottomBaseH, 0, 1.0);
      currentBottomY += bottomBaseH;
    }

    // 【改良3】時刻 exactTime において動画の基準ライン（capY）にあるノーツは、まさに今の currentBottomY に描かれるため、
    // スライスを足す前の正確な基準座標をタイムスタンプとして記録する！（これにより初期ズレがゼロになる）
    timeToYMap.push({ time: exactTime, bottomY: currentBottomY });

    const sy = Math.max(0, Math.min(h - stepPx, (capY - stepPx) + subPixelShiftY));
    drawSliceToMaster(frameCanvas, sy, stepPx, currentBottomY, 1.0);

    if (step > 0 && overlapPx > 0 && currentBottomY > overlapPx) {
      const halfOv = overlapPx * 0.5;
      const featherSy1 = Math.max(0, Math.min(h - halfOv, sy + stepPx - halfOv));
      const featherSy2 = Math.max(0, Math.min(h - halfOv, sy + stepPx));
      drawSliceToMaster(frameCanvas, featherSy1, halfOv, currentBottomY - halfOv, 0.55);
      drawSliceToMaster(frameCanvas, featherSy2, halfOv, currentBottomY - overlapPx, 0.25);
    }

    currentBottomY += stepPx;

    if (step === totalSteps && topCapH > 0) {
      const topSy = Math.max(0, Math.min(h - topCapH, topSafeY + subPixelShiftY));
      drawSliceToMaster(frameCanvas, topSy, topCapH, currentBottomY, 1.0);
      currentBottomY += topCapH;
    }

    if (step > 0 && step % DEVICE_SPEC_PROFILE.gcPauseEverySteps === 0) {
      await new Promise(r => setTimeout(r, DEVICE_SPEC_PROFILE.gcPauseDurationMs));
    }

    const nowWall = performance.now();
    if (onStepProgress && (nowWall - lastProgressUpdateWall > 180 || step === totalSteps)) {
      lastProgressUpdateWall = nowWall;
      onStepProgress((step + 1) / (totalSteps + 1), exactTime, tEnd, autoBrakeExtraMs);
      await new Promise((r) => setTimeout(r, 0));
    }
  }

  frameCanvas.width = 0;
  frameCanvas.height = 0;
  tinyCheckC.width = 0;
  tinyCheckC.height = 0;

  if (cancelGenerationRequested) {
    for (const mc of masterChunks) {
      mc.width = 0;
      mc.height = 0;
    }
    return { hasData: false, chunks: [] };
  }

  const totalHeight = Math.max(100, Math.round(currentBottomY));

  if (blackBgToggle.checked && masterChunks.length > 0) {
    for (let k = 0; k < masterChunks.length; k++) {
      if (cancelGenerationRequested) break;
      applyBlackBackgroundFilter(masterCtxs[k], cropW, MASTER_CHUNK_H);
      await new Promise(r => setTimeout(r, 15));
    }
  }

  const actualLastTime = timeToYMap.length > 0 ? timeToYMap[timeToYMap.length - 1].time : tEnd;

  return {
    hasData: masterChunks.length > 0 && !cancelGenerationRequested,
    cropW: cropW,
    totalHeight: totalHeight,
    bottomBaseH: Math.round(bottomBaseH),
    topCapH: Math.round(topCapH + stepPx),
    chunks: masterChunks,
    tStart: tStart,
    tEnd: actualLastTime,
    timeToYMap: timeToYMap,
    sourceLabel: sourceName
  };
}

function renderMasterDataToTempCanvas(mData) {
  const { cropW, totalHeight, chunks } = mData;
  const colMaxH = Math.max(400, parseInt(colHeightInput.value, 10) || 5400);
  const mode = layoutMode.value;
  const numCols = Math.max(1, Math.ceil(totalHeight / colMaxH));
  const colGap = 14;
  const headerH = 0;

  const MAX_DIM = 14000;
  const MAX_AREA = 60000000;
  const tempC = document.createElement("canvas");

  function drawCol(targetCtx, c, destX, destY) {
    targetCtx.fillStyle = "#000000";
    targetCtx.fillRect(destX, destY, cropW, colMaxH);
    const colBottomStart = c * colMaxH;
    const colBottomEnd = Math.min(totalHeight, colBottomStart + colMaxH);
    if (colBottomEnd <= colBottomStart) return;
    const startChunk = Math.floor(colBottomStart / MASTER_CHUNK_H);
    const endChunk = Math.floor((colBottomEnd - 1) / MASTER_CHUNK_H);
    for (let k = startChunk; k <= endChunk; k++) {
      if (k < 0 || k >= chunks.length) continue;
      const chunkBottomStart = k * MASTER_CHUNK_H;
      const overlapBottom = Math.max(colBottomStart, chunkBottomStart);
      const overlapTop = Math.min(colBottomEnd, chunkBottomStart + MASTER_CHUNK_H);
      const copyH = overlapTop - overlapBottom;
      if (copyH <= 0) continue;
      const srcY = MASTER_CHUNK_H - (overlapBottom - chunkBottomStart) - copyH;
      const dstY = destY + (colMaxH - (overlapBottom - colBottomStart) - copyH);
      targetCtx.drawImage(chunks[k], 0, srcY, cropW, copyH, destX, dstY, cropW, copyH);
    }
  }

  if (mode === "single") {
    const rawW = cropW;
    const rawH = totalHeight;
    const renderScale = Math.min(
      1,
      MAX_DIM / Math.max(1, rawW),
      MAX_DIM / Math.max(1, rawH),
      Math.sqrt(MAX_AREA / Math.max(1, rawW * rawH))
    );
    tempC.width = Math.max(1, Math.round(rawW * renderScale));
    tempC.height = Math.max(1, Math.round(rawH * renderScale));
    const ctx = tempC.getContext("2d", { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, tempC.width, tempC.height);
    ctx.save();
    ctx.scale(renderScale, renderScale);
    for (let c = 0; c < numCols; c++) {
      drawCol(ctx, c, 0, totalHeight - (c + 1) * colMaxH);
    }
    ctx.restore();
  } else {
    const rawW = numCols * cropW + (numCols + 1) * colGap;
    const rawH = colMaxH + headerH + colGap * 2;
    const renderScale = Math.min(
      1,
      MAX_DIM / Math.max(1, rawW),
      MAX_DIM / Math.max(1, rawH),
      Math.sqrt(MAX_AREA / Math.max(1, rawW * rawH))
    );
    tempC.width = Math.max(1, Math.round(rawW * renderScale));
    tempC.height = Math.max(1, Math.round(rawH * renderScale));
    const ctx = tempC.getContext("2d", { willReadFrequently: true });
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.save();
    ctx.scale(renderScale, renderScale);
    ctx.fillStyle = blackBgToggle.checked ? "#05070b" : "#161c2e";
    ctx.fillRect(0, 0, rawW, rawH);
    for (let c = 0; c < numCols; c++) {
      const x = colGap + c * (cropW + colGap);
      const y = headerH + colGap;
      drawCol(ctx, c, x, y);
      ctx.strokeStyle = "#2b3856";
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, cropW, colMaxH);
    }
    ctx.restore();
  }

  // 一括作成時の保存画像にも裏でタイムスタンプを直接埋め込む
  embedTimestampsIntoCanvas(tempC, mData);
  return tempC;
}

async function generateChartImage(isTestMode = false) {
  if (!video.videoWidth || isGenerating) return;
  video.pause();
  const prevMuted = video.muted;
  video.muted = true;
  cancelGenerationRequested = false;

  const startWallTime = performance.now();
  setGeneratingLock(true);
  progressContainer.style.display = "block";
  progressPercent.textContent = "0%";
  progressBar.style.width = "0%";
  progressText.textContent = "動画データをメモリへプリロード中...";

  try {
    if (activeVideoItem && !activeVideoItem.ramBlobUrl) {
      const ramUrl = await ensureVideoPreloadedInMemory(activeVideoItem);
      if (ramUrl && !cancelGenerationRequested) {
        video.src = ramUrl;
        video.load();
        await new Promise((resolve) => {
          video.onloadedmetadata = resolve;
          video.onerror = resolve;
        });
      }
    }

    const label = activeFolderName || (activeVideoName ? activeVideoName.replace(/\.[^.]+$/, "") : "生成譜面");
    const resultData = await buildMasterDataForVideoElement(
      video,
      label,
      isTestMode,
      (ratio, exactTime, tEnd, brakeExtraMs) => {
        if (cancelGenerationRequested) return;
        const pct = Math.min(100, Math.round(ratio * 100));
        progressPercent.textContent = `${pct}%`;
        progressBar.style.width = `${pct}%`;
        const paceNote = brakeExtraMs > 10 ? ` [負荷検知: 自動減速中 +${brakeExtraMs}ms]` : ` [${DEVICE_SPEC_PROFILE.label}]`;
        progressText.textContent = `タイムスタンプ記録＆高精度フレーム同期で合成中... (${exactTime.toFixed(1)}秒 / ${tEnd.toFixed(1)}秒)${paceNote}`;
      }
    );

    if (resultData.hasData && !cancelGenerationRequested) {
      if (masterChartData.hasData) {
        releaseMasterChunks(masterChartData);
      }
      masterChartData = resultData;
      if (activeFolderName && folderGroups.has(activeFolderName)) {
        const grp = folderGroups.get(activeFolderName);
        grp.images = [{ name: `${activeFolderName}_譜面.png`, file: null, url: null, masterData: resultData }];
      }
      await rebuildLayoutFromMaster(!isTestMode);
      progressPercent.textContent = "100%";
      progressBar.style.width = "100%";
      const elapsedSec = ((performance.now() - startWallTime) / 1000).toFixed(1);
      progressText.textContent = `譜面静止画の作成・タイムスタンプ記録・フォルダ自動保存が完了しました（処理時間: ${elapsedSec}秒）`;
    } else if (cancelGenerationRequested) {
      progressText.textContent = "静止画の生成を停止しました";
    }
  } catch (err) {
    progressText.textContent = `エラーが発生しました: ${err.message || err}`;
  } finally {
    video.muted = prevMuted;
    applyPlaybackRate(currentPlaybackRate, false);
    shouldRestartFromBeginning = true;
    smoothedDriftOffsetY = 0;
    targetDriftOffsetY = 0;
    await seekVideoElementTo(video, 0);
    seekSlider.value = 0;
    currentTimeLabel.textContent = `0.00 秒 / ${(video.duration || 0).toFixed(2)} 秒`;
    setGeneratingLock(false);
    renderTopSwitcher();
    drawPreview(true);
    drawPlayheadOverlay();
  }
}

async function processMultipleVideosConcurrently() {
  if (isGenerating) return;
  const vidEntries = getUnprocessedVideoEntries();
  if (vidEntries.length === 0) return;

  video.pause();
  cancelGenerationRequested = false;
  const startWallTime = performance.now();
  setGeneratingLock(true);
  progressContainer.style.display = "block";
  progressPercent.textContent = "0%";
  progressBar.style.width = "0%";

  let completedCount = 0;
  let firstCompletedFolder = "";

  try {
    for (let idx = 0; idx < vidEntries.length; idx++) {
      if (cancelGenerationRequested) break;
      const { videoEntry, folderName } = vidEntries[idx];

      progressText.textContent = `[${idx + 1}/${vidEntries.length}本目] 「${folderName}」の動画データをメモリへ展開中...`;

      const ramUrl = await ensureVideoPreloadedInMemory(videoEntry);
      if (cancelGenerationRequested) break;

      const tempVid = document.createElement("video");
      tempVid.playsInline = true;
      tempVid.muted = true;
      tempVid.src = ramUrl;
      tempVid.load();

      await new Promise((resolve) => {
        tempVid.onloadedmetadata = resolve;
        tempVid.onerror = resolve;
      });

      if (tempVid.videoWidth && !cancelGenerationRequested) {
        const mData = await buildMasterDataForVideoElement(
          tempVid,
          folderName,
          false,
          (ratio, exactTime, tEnd) => {
            if (cancelGenerationRequested) return;
            const overallRatio = (idx + ratio) / vidEntries.length;
            const pct = Math.min(100, Math.round(overallRatio * 100));
            progressPercent.textContent = `${pct}%`;
            progressBar.style.width = `${pct}%`;
            progressText.textContent = `[${idx + 1}/${vidEntries.length}本目: ${folderName}] タイムスタンプ記録＆高精度同期で合成中... (${exactTime.toFixed(1)}s / ${tEnd.toFixed(1)}s)`;
          }
        );

        if (mData.hasData && !cancelGenerationRequested) {
          completedCount++;
          if (!firstCompletedFolder) firstCompletedFolder = folderName;

          saveTimestampProfileForFolder(folderName, mData);

          const grp = folderGroups.get(folderName);
          if (grp) {
            grp.images = [{
              name: `${folderName}_譜面.png`,
              file: null,
              url: null,
              masterData: mData
            }];
          }

          const tempOutC = renderMasterDataToTempCanvas(mData);
          await autoSaveCanvasToFolder(folderName, tempOutC);
          tempOutC.width = 0;
          tempOutC.height = 0;
        }
      }

      tempVid.src = "";
      await new Promise(r => setTimeout(r, 300));
    }

    const elapsedSec = ((performance.now() - startWallTime) / 1000).toFixed(1);
    if (cancelGenerationRequested) {
      progressText.textContent = `一括処理を停止しました（完了分 ${completedCount} フォルダ / ${elapsedSec}秒）`;
    } else {
      progressPercent.textContent = "100%";
      progressBar.style.width = "100%";
      progressText.textContent = `未作成だった全 ${completedCount} フォルダの順番処理・タイムスタンプ記録・自動保存が完了しました（処理時間: ${elapsedSec}秒）`;
    }
  } finally {
    shouldRestartFromBeginning = true;
    smoothedDriftOffsetY = 0;
    targetDriftOffsetY = 0;
    if (video.src) {
      applyPlaybackRate(currentPlaybackRate, false);
      await seekVideoElementTo(video, 0);
      seekSlider.value = 0;
      currentTimeLabel.textContent = `0.00 秒 / ${(video.duration || 0).toFixed(2)} 秒`;
    }
    setGeneratingLock(false);
    if (firstCompletedFolder && !cancelGenerationRequested) {
      switcherContent.style.display = "block";
      selectFolderSet(firstCompletedFolder);
    } else {
      renderTopSwitcher();
    }
    drawPreview(true);
    drawPlayheadOverlay();
  }
}

generateBtn.addEventListener("click", () => generateChartImage(false));
batchGenerateBtn.addEventListener("click", processMultipleVideosConcurrently);
testGenerateBtn.addEventListener("click", () => generateChartImage(true));

// 9. ソフト内蔵「譜面ビューアー」（生成中も常時操作可能）
// =========================================================
const viewerBox = document.getElementById("viewerBox");
const viewerViewport = document.getElementById("viewerViewport");
const zoomLevelLabel = document.getElementById("zoomLevelLabel");
const zoomInBtn = document.getElementById("zoomInBtn");
const zoomOutBtn = document.getElementById("zoomOutBtn");
const fitAllBtn = document.getElementById("fitAllBtn");
const fitHeightBtn = document.getElementById("fitHeightBtn");
const zoom100Btn = document.getElementById("zoom100Btn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const exitFullscreenBtn = document.getElementById("exitFullscreenBtn");
const colJumpBar = document.getElementById("colJumpBar");

let vScale = 1.0;
let vX = 0;
let vY = 0;
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;

function updateViewerTransform() {
  canvasStage.style.transform = `translate3d(${vX}px, ${vY}px, 0) scale(${vScale})`;
  zoomLevelLabel.textContent = `${Math.round(vScale * 100)}%`;
}

function fitViewerAll() {
  if (!outputCanvas.width || !outputCanvas.height) return;
  const vw = Math.max(200, viewerViewport.clientWidth);
  const vh = Math.max(200, viewerViewport.clientHeight);
  vScale = Math.min((vw - 20) / outputCanvas.width, (vh - 20) / outputCanvas.height, 1.5);
  vX = Math.max(10, (vw - outputCanvas.width * vScale) / 2);
  vY = Math.max(10, (vh - outputCanvas.height * vScale) / 2);
  updateViewerTransform();
}

function fitViewerHeight() {
  if (!outputCanvas.height) return;
  const vh = Math.max(200, viewerViewport.clientHeight);
  vScale = (vh - 20) / outputCanvas.height;
  vX = 10;
  vY = 10;
  updateViewerTransform();
}

function zoomAtCenter(factor) {
  const vw = viewerViewport.clientWidth;
  const vh = viewerViewport.clientHeight;
  const cx = vw / 2;
  const cy = vh / 2;
  const newScale = Math.min(4.0, Math.max(0.05, vScale * factor));
  const ratio = newScale / vScale;
  vX = cx - (cx - vX) * ratio;
  vY = cy - (cy - vY) * ratio;
  vScale = newScale;
  updateViewerTransform();
}

function setupViewerAfterGenerate(numCols) {
  colJumpBar.innerHTML = `<span style="font-size:0.82rem; color:#9aa5b8; white-space:nowrap;">列へジャンプ:</span>`;
  if (chartMeta.mode === "grid" && numCols > 1 && chartMeta.colRects && chartMeta.colRects.length > 1) {
    colJumpBar.style.display = "flex";
    for (let c = 0; c < numCols; c++) {
      const btn = document.createElement("button");
      btn.className = "btn btn-secondary";
      btn.style.padding = "4px 10px";
      btn.style.fontSize = "0.8rem";
      btn.style.whiteSpace = "nowrap";
      btn.textContent = `${c + 1}列目`;
      btn.addEventListener("click", () => {
        const rect = chartMeta.colRects[c] || chartMeta.colRects[0];
        vScale = Math.min(1.2, Math.max(0.4, viewerViewport.clientWidth / (rect.w * 2.2)));
        vX = 30 - rect.x * vScale;
        vY = 10;
        updateViewerTransform();
      });
      colJumpBar.appendChild(btn);
    }
  } else {
    colJumpBar.style.display = "none";
  }

  requestAnimationFrame(() => {
    fitViewerAll();
  });
}

viewerViewport.addEventListener("dblclick", (e) => {
  if (isGenerating || !video.src || !outputCanvas.width) return;
  shouldRestartFromBeginning = false;
  const rect = viewerViewport.getBoundingClientRect();
  const canvasX = (e.clientX - rect.left - vX) / vScale;
  const canvasY = (e.clientY - rect.top - vY) / vScale;

  let clickedBottomY = 0;
  const { colMaxH, totalHeight, colRects } = chartMeta;

  if (chartMeta.mode === "single" || !colRects || colRects.length <= 1) {
    const r = (colRects && colRects[0]) ? colRects[0] : { x: 0, y: 0, w: outputCanvas.width, h: outputCanvas.height };
    const ratio = Math.max(0, Math.min(1, 1 - (canvasY - r.y) / Math.max(1, r.h)));
    clickedBottomY = ratio * totalHeight;
  } else {
    let bestCol = 0;
    let minDist = Infinity;
    for (let c = 0; c < colRects.length; c++) {
      const cr = colRects[c];
      const center = cr.x + cr.w * 0.5;
      const d = Math.abs(canvasX - center);
      if (d < minDist) {
        minDist = d;
        bestCol = c;
      }
    }
    const cr = colRects[bestCol];
    const relRatio = Math.max(0, Math.min(1, 1 - (canvasY - cr.y) / Math.max(1, cr.h)));
    clickedBottomY = bestCol * colMaxH + relRatio * colMaxH;
  }

  const offsetSec = parseFloat(playheadOffsetInput.value) || 0;
  const targetTime = getTimeForBottomY(clickedBottomY) - offsetSec;
  video.currentTime = Math.max(0, Math.min(video.duration || targetTime, targetTime));
});

zoomInBtn.addEventListener("click", () => zoomAtCenter(1.25));
zoomOutBtn.addEventListener("click", () => zoomAtCenter(0.8));
fitAllBtn.addEventListener("click", fitViewerAll);
fitHeightBtn.addEventListener("click", fitViewerHeight);
zoom100Btn.addEventListener("click", () => { vScale = 1.0; vX = 10; vY = 10; updateViewerTransform(); });

function setViewerFullscreen(enable) {
  if (enable) {
    viewerBox.classList.add("fullscreen");
    fullscreenBtn.textContent = "全画面を閉じる (Esc)";
  } else {
    viewerBox.classList.remove("fullscreen");
    fullscreenBtn.textContent = "全画面表示";
  }
  setTimeout(fitViewerAll, 50);
}

fullscreenBtn.addEventListener("click", () => {
  setViewerFullscreen(!viewerBox.classList.contains("fullscreen"));
});

exitFullscreenBtn.addEventListener("click", () => {
  setViewerFullscreen(false);
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && viewerBox.classList.contains("fullscreen")) {
    setViewerFullscreen(false);
  }
});

viewerViewport.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = viewerViewport.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.15 : 0.87;
  const newScale = Math.min(4.5, Math.max(0.05, vScale * factor));
  const ratio = newScale / vScale;
  vX = mx - (mx - vX) * ratio;
  vY = my - (my - vY) * ratio;
  vScale = newScale;
  updateViewerTransform();
}, { passive: false });

viewerViewport.addEventListener("mousedown", (e) => {
  if (e.target === exitFullscreenBtn) return;
  isDragging = true;
  dragStartX = e.clientX - vX;
  dragStartY = e.clientY - vY;
  viewerViewport.classList.add("dragging");
});
window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  vX = e.clientX - dragStartX;
  vY = e.clientY - dragStartY;
  updateViewerTransform();
});
window.addEventListener("mouseup", () => {
  isDragging = false;
  viewerViewport.classList.remove("dragging");
});

// =========================================================
// 10. PNG画像・指定列のみ保存・ZIP一括ダウンロード保存
// =========================================================
downloadPngBtn.addEventListener("click", async () => {
  if (isGenerating || !outputCanvas.width) return;
  const blob = await canvasToBlobSafe(outputCanvas);
  const prefix = activeFolderName || "Proseka_Chart";
  downloadBlob(blob, `${prefix}.png`);
});

downloadSingleColBtn.addEventListener("click", async () => {
  if (isGenerating || !masterChartData.hasData) return;
  const rawText = (targetColInput.value || "").trim();
  const match = rawText.match(/\d+/);
  const colNumber = match ? parseInt(match[0], 10) : NaN;

  const { cropW, totalHeight } = masterChartData;
  const colMaxH = Math.max(400, parseInt(colHeightInput.value, 10) || 5400);
  const numCols = Math.max(1, Math.ceil(totalHeight / colMaxH));

  if (isNaN(colNumber) || colNumber < 1 || colNumber > numCols) {
    alert(`1 〜 ${numCols} の範囲で列番号を入力してください。`);
    return;
  }

  const c = colNumber - 1;
  const tmpColC = document.createElement("canvas");
  tmpColC.width = cropW;
  tmpColC.height = colMaxH;
  const tmpColCtx = tmpColC.getContext("2d");

  drawColumnFromMaster(tmpColCtx, c, colMaxH, 0, 0);
  const blob = await canvasToBlobSafe(tmpColC);
  tmpColC.width = 0;
  tmpColC.height = 0;

  const prefix = activeFolderName || "Proseka_Chart";
  const numStr = String(colNumber).padStart(2, "0");
  downloadBlob(blob, `${prefix}_列${numStr}.png`);
});

downloadResultZipBtn.addEventListener("click", async () => {
  if (isGenerating || !outputCanvas.width) return;
  downloadResultZipBtn.disabled = true;
  downloadResultZipBtn.textContent = "ZIPファイルを作成中...";
  try {
    const files = [];
    const prefix = activeFolderName || "Proseka_Chart";
    const fullPngBytes = await canvasToUint8Array(outputCanvas);
    if (fullPngBytes.length > 0) {
      files.push({ name: `00_${prefix}_全体一覧.png`, data: fullPngBytes });
    }

    if (masterChartData.hasData) {
      const { cropW, totalHeight } = masterChartData;
      const colMaxH = Math.max(400, parseInt(colHeightInput.value, 10) || 5400);
      const numCols = Math.max(1, Math.ceil(totalHeight / colMaxH));
      const tmpColC = document.createElement("canvas");
      tmpColC.width = cropW;
      tmpColC.height = colMaxH;
      const tmpColCtx = tmpColC.getContext("2d");

      for (let c = 0; c < numCols; c++) {
        drawColumnFromMaster(tmpColCtx, c, colMaxH, 0, 0);
        const colBytes = await canvasToUint8Array(tmpColC);
        if (colBytes.length > 0) {
          const num = String(c + 1).padStart(2, "0");
          files.push({ name: `${prefix}_分割列_${num}.png`, data: colBytes });
        }
      }
      tmpColC.width = 0;
      tmpColC.height = 0;
    }

    const zipBlob = createZipBlob(files);
    downloadBlob(zipBlob, `${prefix}_Images.zip`);
  } finally {
    downloadResultZipBtn.disabled = false;
    downloadResultZipBtn.textContent = "全体＋分割画像をZIPで保存";
  }
});
</script>
</body>
</html>
