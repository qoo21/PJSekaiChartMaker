<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PJSekaiChartMaker - プロセカ譜面動画 変換ソフト</title>
<style>
  :root {
    --primary: #00d4d4;
    --primary-dark: #009999;
    --bg: #0f131d;
    --card: #192030;
    --text: #f0f4f8;
    --muted: #9aa5b8;
    --accent: #ff4d88;
    --border: #2e3954;
  }
  * { box-sizing: border-box; font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif; }
  body {
    margin: 0; padding: 20px;
    background-color: var(--bg); color: var(--text);
    line-height: 1.55;
  }
  .container { max-width: 1180px; margin: 0 auto; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(135deg, #182540 0%, #101a2e 100%);
    padding: 16px 24px; border-radius: 12px;
    border: 1px solid var(--border); margin-bottom: 16px;
    flex-wrap: wrap; gap: 12px;
  }
  header h1 { margin: 0; font-size: 1.35rem; color: #fff; display: flex; align-items: center; gap: 10px; }
  .step-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px; margin-bottom: 18px;
  }
  .step-title {
    margin-top: 0; margin-bottom: 12px; font-size: 1.1rem;
    color: var(--primary); border-bottom: 1px solid var(--border);
    padding-bottom: 8px; display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  .btn {
    background: var(--primary); color: #001818; border: none;
    padding: 8px 15px; border-radius: 8px; font-weight: bold;
    cursor: pointer; font-size: 0.9rem; transition: 0.18s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: #33ecec; transform: translateY(-1px); }
  .btn:disabled { background: #3c445c; color: #7c869e; cursor: not-allowed; transform: none; }
  .btn-secondary { background: #28324a; color: #fff; border: 1px solid #3f4e70; }
  .btn-secondary:hover { background: #344160; }
  .btn-secondary.active { background: var(--primary); color: #001818; border-color: var(--primary); }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: #ff709f; }

  /* プレビュー上部のフォルダ・ファイル自動切り替えバー */
  .top-switcher-card {
    background: #141b2b; border: 2px solid #00a8a8;
    border-radius: 12px; padding: 14px 18px; margin-bottom: 18px;
  }
  .switcher-header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 10px; margin-bottom: 10px;
  }
  .folder-tabs {
    display: flex; gap: 6px; flex-wrap: wrap;
    padding-bottom: 8px; margin-bottom: 8px; border-bottom: 1px solid var(--border);
  }
  .file-switcher-row {
    display: flex; gap: 8px; align-items: center; overflow-x: auto;
    padding: 4px 0;
  }
  .file-chip {
    background: #222c42; color: #e2e8f0; border: 1px solid #3a496b;
    padding: 6px 12px; border-radius: 6px; font-size: 0.84rem;
    cursor: pointer; white-space: nowrap; transition: 0.15s; font-weight: bold;
  }
  .file-chip:hover { background: #2e3c59; }
  .file-chip.active { background: var(--primary); color: #001818; border-color: var(--primary); }
  .file-chip.video-chip { border-color: #ff4d88; }
  .file-chip.video-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .grid-2 { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  .preview-wrapper {
    position: relative; background: #000; border-radius: 8px;
    overflow: hidden; border: 1px solid var(--border);
    display: flex; justify-content: center; align-items: center;
    min-height: 280px;
  }
  #videoPreview { display: none; }
  #previewCanvas { max-width: 100%; max-height: 440px; display: block; }

  .control-group { margin-bottom: 12px; background: #121724; padding: 12px 14px; border-radius: 8px; border: 1px solid #222b40; }
  .control-group label { display: flex; justify-content: space-between; font-size: 0.88rem; margin-bottom: 5px; font-weight: bold; }
  .control-group input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; }
  .inline-inputs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .num-input, select.num-input {
    background: #0a0e17; color: #fff; border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 6px; width: 92px; font-size: 0.92rem;
  }
  .checkbox-row {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-weight: bold; color: #55ffaa; font-size: 0.95rem; margin-bottom: 8px;
  }
  .checkbox-row input { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }

  .progress-container {
    display: none; margin-top: 15px; background: #0b0f18;
    border-radius: 8px; padding: 12px; border: 1px solid var(--border);
  }
  .progress-bar-bg { width: 100%; height: 14px; background: #1e2638; border-radius: 7px; overflow: hidden; margin-top: 6px; }
  .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--primary), #55ffaa); transition: width 0.08s; }

  /* ビューアーと再生バー重ね合わせ */
  .viewer-box {
    margin-top: 12px; background: #07090e; border: 2px solid var(--border);
    border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
  }
  .viewer-box.fullscreen {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    z-index: 9999; margin: 0; border-radius: 0; border: none;
  }
  .viewer-toolbar {
    display: flex; justify-content: space-between; align-items: center;
    background: #141a29; padding: 10px 14px; border-bottom: 1px solid var(--border);
    flex-wrap: wrap; gap: 8px;
  }
  .viewer-col-jumps {
    display: flex; gap: 6px; align-items: center; overflow-x: auto;
    padding: 6px 14px; background: #0d121d; border-bottom: 1px solid #1f2940;
  }
  .viewer-viewport {
    position: relative; width: 100%; height: 640px; overflow: hidden;
    cursor: grab; background: #000; user-select: none;
  }
  .viewer-box.fullscreen .viewer-viewport { height: calc(100vh - 135px); }
  .viewer-viewport.dragging { cursor: grabbing; }
  #canvasStage {
    transform-origin: 0 0;
    position: absolute; top: 0; left: 0;
    box-shadow: 0 0 25px rgba(0,0,0,0.8);
  }
  #outputCanvas { display: block; }
  #playheadCanvas {
    position: absolute; top: 0; left: 0;
    pointer-events: none;
  }
  .hint { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>プロセカ譜面動画 静止画メーカー</h1>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn" id="linkRootFolderBtn">PC内のフォルダを連携</button>
      <button class="btn btn-secondary" id="selectFolderBtn">フォルダ選択</button>
      <button class="btn btn-secondary" id="selectVideoBtn">動画選択</button>
      <button class="btn btn-secondary" id="selectImagesBtn">画像選択</button>
      <input type="file" id="videoInput" accept="video/*" style="display:none;">
      <input type="file" id="folderInput" webkitdirectory directory multiple style="display:none;">
      <input type="file" id="imagesInput" accept="image/*" multiple style="display:none;">
    </div>
  </header>

  <!-- プレビュー最上部：GitHub同階層＆ローカルフォルダ自動読み込み・切り替えバー -->
  <div class="top-switcher-card" id="topSwitcherCard">
    <div class="switcher-header">
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <strong style="color:var(--primary); font-size:0.98rem;">フォルダ・ファイル切り替えバー</strong>
        <span class="hint" id="folderStatusLabel">GitHub同階層またはドラッグ＆ドロップされたフォルダ・ファイルがここに自動表示されます</span>
      </div>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <button class="btn btn-accent" id="reconnectFolderBtn" style="display:none; padding:6px 12px; font-size:0.84rem;">前回のフォルダを自動再読み込み</button>
        <button class="btn btn-secondary" id="refreshFolderBtn" style="display:none; padding:6px 12px; font-size:0.84rem;">再スキャン</button>
      </div>
    </div>

    <div id="switcherContent" style="display:none;">
      <div class="folder-tabs" id="folderTabs"></div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div class="file-switcher-row" id="imageFileList"></div>
        <div class="file-switcher-row" id="videoFileList"></div>
      </div>
    </div>
  </div>

  <!-- 譜面静止画プレビュー（ビューアー）＆ 1列の高さ即時再生成パネル -->
  <div class="step-card" id="generateSection">
    <h2 class="step-title">
      <span>譜面静止画プレビュー・作成・高さ変更再生成</span>
      <span class="hint" id="currentViewFileName"></span>
    </h2>

    <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:space-between; background:#121724; padding:12px 14px; border-radius:8px; border:1px solid #222b40;">
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <button class="btn btn-accent" id="generateBtn" disabled>動画から譜面静止画を作成する</button>
        <button class="btn btn-secondary" id="testGenerateBtn" disabled>最初の12秒だけテスト作成</button>
      </div>

      <!-- 生成した静止画を利用して1列の高さを変更して再生成する仕組み -->
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-left:2px solid var(--border); padding-left:12px;">
        <span style="font-size:0.88rem; font-weight:bold; color:#55ffaa;">1列の高さ(px):</span>
        <input type="number" id="colHeightInput" class="num-input" step="100" min="400" max="16000" value="1800" style="width:85px;">
        <select id="layoutMode" class="num-input" style="width:175px;">
          <option value="grid" selected>1枚の一覧画像に折り返して並べる</option>
          <option value="single">折り返さずに1本の縦長画像にする</option>
        </select>
        <button class="btn" id="reLayoutBtn" disabled>現在の静止画から高さを変更して再生成</button>
      </div>
    </div>

    <div class="progress-container" id="progressContainer">
      <div style="display:flex; justify-content:space-between; font-size:0.9rem;">
        <span id="progressText">譜面を合成しています...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- ソフト上で見れる譜面ビューアー -->
    <div id="resultArea" style="display:none; margin-top:14px;">
      <div id="viewerQuickSwitchBar" style="display:none; background:#101624; border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin-bottom:10px; align-items:center; gap:8px; overflow-x:auto;">
        <span style="font-size:0.82rem; color:var(--primary); font-weight:bold; white-space:nowrap;">画像ワンクリック切替:</span>
        <div id="viewerQuickSwitchList" style="display:flex; gap:6px;"></div>
      </div>

      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px; align-items:center; justify-content:space-between;">
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn" id="downloadPngBtn">1枚の譜面画像 (.png) を保存</button>
          <button class="btn btn-secondary" id="downloadResultZipBtn">全体画像＋列ごとの分割画像をZIPで保存</button>
        </div>
        <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
          <label style="display:flex; align-items:center; gap:6px; font-size:0.88rem; cursor:pointer; color:#55ffaa; font-weight:bold;">
            <input type="checkbox" id="showPlayheadToggle" checked style="accent-color:var(--primary);">
            動画と連動して再生位置バーを表示
          </label>
          <label style="display:flex; align-items:center; gap:6px; font-size:0.88rem; cursor:pointer;">
            <input type="checkbox" id="followPlayheadToggle" style="accent-color:var(--primary);">
            再生位置を自動追従
          </label>
        </div>
      </div>

      <div class="viewer-box" id="viewerBox">
        <div class="viewer-toolbar">
          <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
            <strong style="color:var(--primary); margin-right:6px;">譜面ビューアー:</strong>
            <button class="btn btn-secondary" id="zoomOutBtn" style="padding:5px 10px;">ー 縮小</button>
            <span id="zoomLevelLabel" style="min-width:55px; text-align:center; font-weight:bold;">100%</span>
            <button class="btn btn-secondary" id="zoomInBtn" style="padding:5px 10px;">＋ 拡大</button>
            <button class="btn btn-secondary" id="fitAllBtn" style="padding:5px 10px; font-size:0.84rem;">全体を表示</button>
            <button class="btn btn-secondary" id="fitHeightBtn" style="padding:5px 10px; font-size:0.84rem;">高さに合わせる</button>
            <button class="btn btn-secondary" id="zoom100Btn" style="padding:5px 10px; font-size:0.84rem;">1:1 等倍</button>
            <button class="btn btn-secondary" id="viewerPlayPauseBtn" style="padding:5px 12px; font-size:0.84rem;">動画 再生/停止</button>
          </div>
          <div>
            <button class="btn" id="fullscreenBtn" style="padding:6px 14px; font-size:0.86rem;">全画面で大きく見る</button>
          </div>
        </div>
        <div class="viewer-col-jumps" id="colJumpBar"></div>
        <div class="viewer-viewport" id="viewerViewport" title="ダブルクリックでその位置の秒数へ動画をシークします">
          <div id="canvasStage">
            <canvas id="outputCanvas"></canvas>
            <canvas id="playheadCanvas"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 動画プレビュー・黒背景フィルター・精度・範囲の設定 -->
  <div class="step-card" id="editorSection" style="opacity:0.55;">
    <h2 class="step-title">
      <span>動画プレビュー・黒背景フィルター・精度・範囲の設定</span>
    </h2>
    <div class="grid-2">
      <div>
        <div class="preview-wrapper">
          <video id="videoPreview" playsinline muted crossorigin="anonymous"></video>
          <canvas id="previewCanvas" width="640" height="440"></canvas>
        </div>
        <div class="control-group" style="margin-top:12px;">
          <label>
            <span>動画の位置確認シークバー</span>
            <span id="currentTimeLabel">0.00 秒 / 0.00 秒</span>
          </label>
          <input type="range" id="seekSlider" min="0" max="100" step="0.02" value="0">
          <div class="inline-inputs" style="justify-content: space-between; margin-top:8px;">
            <button class="btn btn-secondary" id="playPauseBtn" style="padding:6px 12px;">再生 / 一時停止</button>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-secondary" id="setStartBtn" style="padding:6px 10px; font-size:0.82rem;">今の位置を「開始」</button>
              <button class="btn btn-secondary" id="setEndBtn" style="padding:6px 10px; font-size:0.82rem;">今の位置を「終了」</button>
            </div>
          </div>
        </div>

        <!-- 時間と左右切り抜き -->
        <div class="control-group">
          <label><span>① 合成する時間範囲 ＆ 左右の切り抜き範囲</span></label>
          <div class="inline-inputs">
            <span>開始(秒):</span>
            <input type="number" id="startTimeInput" class="num-input" step="0.1" value="2.1">
            <span>〜 終了(秒):</span>
            <input type="number" id="endTimeInput" class="num-input" step="0.1" value="118.5">
          </div>
          <div class="inline-inputs" style="margin-top:8px;">
            <span style="width:65px; font-size:0.85rem;">左端 <span id="leftVal">18</span>%:</span>
            <input type="range" id="cropLeftSlider" min="0" max="45" step="0.5" value="18" style="flex:1;">
            <span style="width:65px; font-size:0.85rem;">右端 <span id="rightVal">78.5</span>%:</span>
            <input type="range" id="cropRightSlider" min="55" max="100" step="0.5" value="78.5" style="flex:1;">
          </div>
        </div>
      </div>

      <div>
        <!-- 黒背景フィルター設定 -->
        <div class="control-group" style="border-color:#00a8a8;">
          <label class="checkbox-row">
            <input type="checkbox" id="blackBgToggle" checked>
            <span>背景イラストを消して見やすくする</span>
          </label>
          <div id="blackBgControls">
            <label>
              <span>背景消去しきい値（イラストの除去強度）</span>
              <span id="bgThreshLabel">36</span>
            </label>
            <input type="range" id="bgThreshSlider" min="25" max="110" step="1" value="36">
            <label style="margin-top:6px;">
              <span>16分音符の横線・レーン縦線のくっきり度</span>
              <span id="gridBoostLabel">0.5倍</span>
            </label>
            <input type="range" id="gridBoostSlider" min="0.5" max="3.5" step="0.1" value="0.5">
          </div>
        </div>

        <!-- 曲線の滑らかさ・高速生成設定 -->
        <div class="control-group" style="border-color:#00a8a8;">
          <label><span>② 曲線の滑らかさ・高速生成設定</span></label>
          <div class="inline-inputs">
            <select id="qualitySelect" class="num-input" style="width:100%;">
              <option value="fast_ultra" selected>高速・超高精度（マルチスライス補間：滑らか＆高速）</option>
              <option value="turbo">超高速モード（大判スライス一括合成：最速）</option>
              <option value="ultra">超高精度（4px刻み：従来の精密合成）</option>
              <option value="high">高精度（8px刻み）</option>
              <option value="normal">標準（16px刻み）</option>
            </select>
          </div>
        </div>

        <!-- スクロール速度＆自動追跡設定 -->
        <div class="control-group" style="border-color:#00a8a8;">
          <label class="checkbox-row" style="margin-bottom:6px;">
            <input type="checkbox" id="autoTrackToggle">
            <span>自動追跡をONにする（途中で速度が変わる動画に対応）</span>
          </label>
          <div id="manualSpeedControls">
            <label>
              <span>③ スクロール速度（画面高さに対する % / 秒）</span>
              <span id="speedValLabel">47.50 %/秒</span>
            </label>
            <input type="range" id="speedSlider" min="20" max="90" step="0.02" value="47.50">
            <div class="inline-inputs" style="justify-content: space-between;">
              <div>
                <span>微調整:</span>
                <input type="number" id="speedInput" class="num-input" step="0.02" value="47.50">
              </div>
              <button class="btn btn-secondary" id="autoSpeedBtn" style="padding:6px 12px; font-size:0.84rem;">速度を自動計測する</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// =========================================================
// 1. ZIPファイル生成エンジン
// =========================================================
const CRC32_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[i] = c >>> 0;
  }
  return table;
})();

function crc32(u8) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) crc = (crc >>> 8) ^ CRC32_TABLE[(crc ^ u8[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function createZipBlob(files) {
  const encoder = new TextEncoder();
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  for (const file of files) {
    const nameBytes = encoder.encode(file.name);
    const dataBytes = (file.data instanceof Uint8Array) ? file.data : encoder.encode(file.data);
    const crc = crc32(dataBytes);
    const size = dataBytes.length;

    const lfh = new Uint8Array(30 + nameBytes.length);
    const lfv = new DataView(lfh.buffer);
    lfv.setUint32(0, 0x04034b50, true);
    lfv.setUint16(4, 20, true);
    lfv.setUint16(6, 0x0800, true);
    lfv.setUint16(8, 0, true);
    lfv.setUint16(10, 0, true);
    lfv.setUint16(12, 0x5421, true);
    lfv.setUint32(14, crc, true);
    lfv.setUint32(18, size, true);
    lfv.setUint32(22, size, true);
    lfv.setUint16(26, nameBytes.length, true);
    lfv.setUint16(28, 0, true);
    lfh.set(nameBytes, 30);
    localParts.push(lfh, dataBytes);

    const cdh = new Uint8Array(46 + nameBytes.length);
    const cdv = new DataView(cdh.buffer);
    cdv.setUint32(0, 0x02014b50, true);
    cdv.setUint16(4, 20, true);
    cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0x0800, true);
    cdv.setUint16(10, 0, true);
    cdv.setUint16(12, 0, true);
    cdv.setUint16(14, 0x5421, true);
    cdv.setUint32(16, crc, true);
    cdv.setUint32(20, size, true);
    cdv.setUint32(24, size, true);
    cdv.setUint16(28, nameBytes.length, true);
    cdv.setUint16(30, 0, true);
    cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true);
    cdv.setUint16(36, 0, true);
    cdv.setUint32(38, 0, true);
    cdv.setUint32(42, offset, true);
    cdh.set(nameBytes, 46);

    centralParts.push(cdh);
    offset += lfh.length + size;
  }

  let cdSize = 0;
  for (const part of centralParts) cdSize += part.length;

  const eocd = new Uint8Array(22);
  const eocdv = new DataView(eocd.buffer);
  eocdv.setUint32(0, 0x06054b50, true);
  eocdv.setUint16(8, files.length, true);
  eocdv.setUint16(10, files.length, true);
  eocdv.setUint32(12, cdSize, true);
  eocdv.setUint32(16, offset, true);

  return new Blob([...localParts, ...centralParts, eocd], { type: "application/zip" });
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

async function canvasToUint8Array(canvas) {
  return new Promise((resolve) => {
    canvas.toBlob(async (blob) => {
      const buf = await blob.arrayBuffer();
      resolve(new Uint8Array(buf));
    }, "image/png");
  });
}

// 2. 高速化された黒背景フィルター
// =========================================================
const blackBgToggle = document.getElementById("blackBgToggle");
const bgThreshSlider = document.getElementById("bgThreshSlider");
const bgThreshLabel = document.getElementById("bgThreshLabel");
const gridBoostSlider = document.getElementById("gridBoostSlider");
const gridBoostLabel = document.getElementById("gridBoostLabel");

function applyBlackBackgroundFilter(ctx, width, height) {
  if (!blackBgToggle.checked) return;

  const thresh = parseInt(bgThreshSlider.value, 10) || 36;
  const gridBoost = parseFloat(gridBoostSlider.value) || 0.5;
  const threshPlus22 = thresh + 22;
  const threshPlus6 = thresh + 6;
  const threshMinus5 = thresh - 5;
  const threshMinus15 = thresh - 15;

  const imgData = ctx.getImageData(0, 0, width, height);
  const data = imgData.data;
  const totalPixels = width * height;
  const lum = new Float32Array(totalPixels);

  for (let i = 0, p = 0; p < totalPixels; i += 4, p++) {
    lum[p] = data[i] * 0.25 + data[i + 1] * 0.45 + data[i + 2] * 0.30;
  }

  for (let y = 0; y < height; y++) {
    const yUp = (y > 1 ? y - 2 : 0) * width;
    const yDown = (y < height - 2 ? y + 2 : height - 1) * width;
    const yUp1 = (y > 0 ? y - 1 : 0) * width;
    const yDown1 = (y < height - 1 ? y + 1 : height - 1) * width;
    const rowOffset = y * width;

    for (let x = 0; x < width; x++) {
      const p = rowOffset + x;
      const idx = p << 2;
      const r = data[idx];
      const g = data[idx + 1];
      const b = data[idx + 2];

      const maxC = r > g ? (r > b ? r : b) : (g > b ? g : b);
      const minC = r < g ? (r < b ? r : b) : (g < b ? g : b);
      const sat = maxC - minC;

      const isNoteOrText = (maxC > threshPlus22) || (g > threshPlus6) || (sat > 38 && maxC > threshMinus5);

      if (isNoteOrText) {
        let alpha = (maxC - threshMinus15) * 0.02857;
        if (alpha > 1.0) alpha = 1.0;
        else if (alpha < 0.2) alpha = 0.2;
        const factor = maxC < 120 ? alpha * 1.12 : alpha;
        data[idx]     = r * factor > 255 ? 255 : r * factor;
        data[idx + 1] = g * factor > 255 ? 255 : g * factor;
        data[idx + 2] = b * factor > 255 ? 255 : b * factor;
      } else {
        const vBg = (lum[yUp + x] + lum[yDown + x]) * 0.5;
        const h1 = lum[p] - vBg;
        const h2 = (lum[yUp1 + x] + lum[yDown1 + x]) * 0.5 - vBg;
        const hLinePeak = h1 > h2 ? (h1 > 0 ? h1 : 0) : (h2 > 0 ? h2 : 0);

        const xLeft = x > 1 ? x - 2 : 0;
        const xRight = x < width - 2 ? x + 2 : width - 1;
        const hBg = (lum[rowOffset + xLeft] + lum[rowOffset + xRight]) * 0.5;
        const vLinePeak = (lum[p] - hBg) * 0.9;

        const lineStrength = hLinePeak > vLinePeak ? hLinePeak : vLinePeak;

        if (lineStrength > 2.2) {
          let lineVal = (lineStrength * 8.5 * gridBoost) | 0;
          if (lineVal > 220) lineVal = 220;
          data[idx]     = (lineVal * 0.78) | 0;
          data[idx + 1] = (lineVal * 0.88) | 0;
          data[idx + 2] = lineVal;
        } else {
          data[idx]     = 0;
          data[idx + 1] = 0;
          data[idx + 2] = 0;
        }
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);
}

// =========================================================
// GitHub Pages リポジトリ内の同階層フォルダ・ファイル完全自動検出
// =========================================================
async function autoScanGitHubRepo() {
  const host = window.location.hostname;
  const pathParts = window.location.pathname.split("/").filter(Boolean);
  let owner = "";
  let repo = "";
  let baseDir = "";

  // URLパラメータ ?repo=owner/repo での明示指定にも対応
  const params = new URLSearchParams(window.location.search);
  if (params.get("repo")) {
    const parts = params.get("repo").split("/");
    owner = parts[0];
    repo = parts[1];
  } else if (host.endsWith(".github.io")) {
    owner = host.split(".")[0];
    if (pathParts.length > 0) {
      repo = pathParts[0];
      // index.html がサブディレクトリにある場合のパス取得
      const subParts = pathParts.slice(1);
      if (subParts.length > 0 && /\.html?$/i.test(subParts[subParts.length - 1])) {
        subParts.pop();
      }
      baseDir = subParts.join("/");
    } else {
      repo = `${owner}.github.io`;
    }
  }

  if (!owner || !repo) return false;

  try {
    folderStatusLabel.textContent = `GitHubリポジトリ (${owner}/${repo}) 内のフォルダ・ファイルを自動スキャン中...`;
    const repoRes = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
    if (!repoRes.ok) return false;
    const repoInfo = await repoRes.json();
    const branch = repoInfo.default_branch || "main";

    const treeRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`);
    if (!treeRes.ok) return false;
    const treeData = await treeRes.json();
    if (!treeData.tree) return false;

    const remoteItems = [];
    for (const item of treeData.tree) {
      if (item.type !== "blob") continue;
      if (baseDir && !item.path.startsWith(baseDir + "/")) continue;

      const relPath = baseDir ? item.path.slice(baseDir.length + 1) : item.path;
      const isVid = /\.(mp4|mov|webm|mkv|avi)$/i.test(relPath);
      const isImg = /\.(png|jpe?g|webp|bmp)$/i.test(relPath);
      if (!isVid && !isImg) continue;

      const parts = relPath.split("/");
      const fileName = parts.pop();
      const folderName = parts.join("/") || "GitHub同階層ルート";

      // 相対URLを構築（GitHub Pages上の実ファイルパス）
      const encodedRelPath = relPath.split("/").map(encodeURIComponent).join("/");
      remoteItems.push({
        name: fileName,
        folderName: folderName,
        url: encodedRelPath,
        isVid: isVid,
        isImg: isImg
      });
    }

    if (remoteItems.length > 0) {
      handleRemoteItems(remoteItems);
      refreshFolderBtn.style.display = "inline-flex";
      return true;
    } else {
      folderStatusLabel.textContent = `GitHubリポジトリ (${owner}/${repo}) に連携済み（リポジトリ内に画像・動画を追加するか、PC・スマホからファイルを選択してください）`;
      return false;
    }
  } catch (e) {
    return false;
  }
}

function handleRemoteItems(items) {
  let firstVideoItem = null;
  let firstImageItem = null;
  let firstImageFolder = "";

  for (const item of items) {
    if (!folderGroups.has(item.folderName)) {
      folderGroups.set(item.folderName, { images: [], videos: [] });
    }
    const group = folderGroups.get(item.folderName);

    if (item.isVid) {
      const idx = group.videos.findIndex(v => v.name === item.name);
      const entry = { name: item.name, url: item.url, file: null };
      if (idx >= 0) group.videos[idx] = entry;
      else group.videos.push(entry);
      if (!firstVideoItem) firstVideoItem = entry;
    } else if (item.isImg) {
      const idx = group.images.findIndex(img => img.name === item.name);
      const entry = { name: item.name, url: item.url, file: null };
      if (idx >= 0) group.images[idx] = entry;
      else group.images.push(entry);
      if (!firstImageItem) { firstImageItem = entry; firstImageFolder = item.folderName; }
    }
  }

  for (const [, grp] of folderGroups) {
    grp.images.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    grp.videos.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  }

  if (firstVideoItem && !video.src) {
    loadVideoItem(firstVideoItem);
  }

  if (folderGroups.size > 0) {
    switcherContent.style.display = "block";
    if (!activeFolderName || !folderGroups.has(activeFolderName)) {
      activeFolderName = firstImageFolder || Array.from(folderGroups.keys())[0];
    }
    if (firstImageItem && !outputCanvas.width) {
      loadImageItemToViewer(firstImageItem);
    } else {
      renderTopSwitcher();
    }
  }
}

// =========================================================
// ローカルPC用：IndexedDBによるフォルダハンドルの永続保存
// =========================================================
function openHandleDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("ProsekaChartMakerDB", 1);
    req.onupgradeneeded = (e) => {
      e.target.result.createObjectStore("handles");
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

async function saveDirHandleToDB(handle) {
  try {
    const db = await openHandleDB();
    const tx = db.transaction("handles", "readwrite");
    tx.objectStore("handles").put(handle, "rootDir");
  } catch (e) {}
}

async function getDirHandleFromDB() {
  try {
    const db = await openHandleDB();
    return new Promise((resolve) => {
      const tx = db.transaction("handles", "readonly");
      const req = tx.objectStore("handles").get("rootDir");
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) {
    return null;
  }
}

async function scanDirectoryHandle(dirHandle, path = "", collected = []) {
  for await (const entry of dirHandle.values()) {
    if (entry.kind === "file") {
      if (/\.(mp4|mov|webm|mkv|avi|png|jpe?g|webp|bmp)$/i.test(entry.name)) {
        const file = await entry.getFile();
        file._customFolder = path || dirHandle.name || "同階層ルート";
        collected.push(file);
      }
    } else if (entry.kind === "directory") {
      const subPath = path ? `${path}/${entry.name}` : entry.name;
      await scanDirectoryHandle(entry, subPath, collected);
    }
  }
  return collected;
}

async function loadFromSavedHandle(requestPerm = false) {
  if (!savedDirectoryHandle) return;
  try {
    let perm = await savedDirectoryHandle.queryPermission({ mode: "read" });
    if (perm !== "granted" && requestPerm) {
      perm = await savedDirectoryHandle.requestPermission({ mode: "read" });
    }
    if (perm === "granted") {
      reconnectFolderBtn.style.display = "none";
      refreshFolderBtn.style.display = "inline-flex";
      const files = await scanDirectoryHandle(savedDirectoryHandle, "");
      handleIncomingFiles(files);
    } else {
      reconnectFolderBtn.style.display = "inline-flex";
      reconnectFolderBtn.textContent = `前回のフォルダ「${savedDirectoryHandle.name}」を自動読み込み`;
    }
  } catch (e) {}
}

  }

async function traverseFileTree(item, path, collected) {
  if (item.isFile) {
    const file = await new Promise((res) => item.file(res));
    file._customFolder = path || "同階層ルート";
    collected.push(file);
  } else if (item.isDirectory) {
    const dirReader = item.createReader();
    let entries = [];
    let batch;
    do {
      batch = await new Promise((res) => dirReader.readEntries(res));
      entries = entries.concat(batch);
    } while (batch.length > 0);
    const nextPath = path ? `${path}/${item.name}` : item.name;
    for (const entry of entries) {
      await traverseFileTree(entry, nextPath, collected);
    }
  }
}

function handleIncomingFiles(files) {
  let firstVideoItem = null;
  let firstImageItem = null;
  let firstImageFolder = "";

  for (const f of files) {
    const isVid = f.type.startsWith("video/") || /\.(mp4|mov|webm|mkv|avi)$/i.test(f.name);
    const isImg = f.type.startsWith("image/") || /\.(png|jpe?g|webp|bmp)$/i.test(f.name);
    if (!isVid && !isImg) continue;

    let folderName = f._customFolder || "";
    if (!folderName && f.webkitRelativePath) {
      const parts = f.webkitRelativePath.split("/");
      parts.pop();
      folderName = parts.join("/") || "同階層ルート";
    }
    if (!folderName) folderName = "同階層ルート";

    if (!folderGroups.has(folderName)) {
      folderGroups.set(folderName, { images: [], videos: [] });
    }
    const group = folderGroups.get(folderName);
    const entry = { name: f.name, file: f, url: null };

    if (isVid) {
      const idx = group.videos.findIndex(v => v.name === f.name);
      if (idx >= 0) group.videos[idx] = entry;
      else group.videos.push(entry);
      if (!firstVideoItem) firstVideoItem = entry;
    } else if (isImg) {
      const idx = group.images.findIndex(img => img.name === f.name);
      if (idx >= 0) group.images[idx] = entry;
      else group.images.push(entry);
      if (!firstImageItem) { firstImageItem = entry; firstImageFolder = folderName; }
    }
  }

  for (const [, grp] of folderGroups) {
    grp.images.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    grp.videos.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  }

  if (firstVideoItem && !video.src) {
    loadVideoItem(firstVideoItem);
  }

  if (folderGroups.size > 0) {
    switcherContent.style.display = "block";
    if (!activeFolderName || !folderGroups.has(activeFolderName)) {
      activeFolderName = firstImageFolder || Array.from(folderGroups.keys())[0];
    }
    if (firstImageItem && !outputCanvas.width) {
      loadImageItemToViewer(firstImageItem);
    } else {
      renderTopSwitcher();
    }
  }
}

    label.style.fontSize = "0.82rem";

    label.style.whiteSpace = "nowrap";

    for (const vidItem of activeGroup.videos) {

      chip.className = "file-chip video-chip" + (isAct ? " active" : "");
      chip.textContent = vidItem.name;
      chip.addEventListener("click", () => loadVideoItem(vidItem));
      videoFileList.appendChild(chip);
    }
  }
}

// =========================================================
// 4. 画像の読み込み（ローカルFile ＆ GitHub URL両対応）と高さ再生成データ構築
// =========================================================
function loadImageItemToViewer(imgItem) {
  activeImageName = imgItem.name;
  renderTopSwitcher();

  const srcUrl = imgItem.file ? URL.createObjectURL(imgItem.file) : imgItem.url;
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    outputCanvas.width = img.width;
    outputCanvas.height = img.height;
    const outCtx = outputCanvas.getContext("2d");
    outCtx.drawImage(img, 0, 0);

    playheadCanvas.width = img.width;
    playheadCanvas.height = img.height;

    currentViewFileName.textContent = `表示中: ${imgItem.name} (${img.width} x ${img.height} px)`;
    resultArea.style.display = "block";

    extractMasterFromExternalImage(img, outCtx, imgItem.name);
    setupViewerAfterGenerate(chartMeta.numCols);
    drawPlayheadOverlay();
    if (imgItem.file) URL.revokeObjectURL(srcUrl);
  };
  img.src = srcUrl;
}

function extractMasterFromExternalImage(img, ctx, fileName) {
  const W = img.width;
  const H = img.height;
  const tStart = parseFloat(startTimeInput.value) || 2.1;
  const tEnd = parseFloat(endTimeInput.value) || (video.duration ? Math.max(tStart + 1, video.duration - 4.0) : 118.5);

  const colGap = 14;
  const headerH = 36;
  const expectedColMaxH = H - headerH - colGap * 2;

  let mode = "single";
  let numCols = 1;
  let calcCropW = W;
  let colMaxH = H;

  if (W > H * 0.65 && expectedColMaxH > 400) {
    const scanY = headerH + colGap + Math.round(expectedColMaxH * 0.5);
    const rowData = ctx.getImageData(0, scanY, W, 1).data;

    let bestNumCols = 1;
    for (let candCols = 2; candCols <= 40; candCols++) {
      const cwFloat = (W - (candCols + 1) * colGap) / candCols;
      if (cwFloat < 120 || cwFloat > 1200) continue;
      if (Math.abs(cwFloat - Math.round(cwFloat)) < 0.15) {
        const cw = Math.round(cwFloat);
        const borderX = colGap + cw + 1;
        const idx = borderX * 4;
        if (Math.abs(rowData[idx] - 43) < 25 && Math.abs(rowData[idx + 2] - 86) < 30) {
          bestNumCols = candCols;
          calcCropW = cw;
          break;
        }
      }
    }

    if (bestNumCols === 1) {
      let estCropW = currentColumnWidths || Math.round((video.videoWidth || 640) * ((parseFloat(cropRightSlider.value) - parseFloat(cropLeftSlider.value)) / 100));
      if (!estCropW || estCropW < 50) estCropW = 370;
      bestNumCols = Math.max(1, Math.round((W - colGap) / (estCropW + colGap)));
      calcCropW = Math.round((W - (bestNumCols + 1) * colGap) / bestNumCols);
    }

    if (bestNumCols > 1 && calcCropW >= 80) {
      mode = "grid";
      numCols = bestNumCols;
      colMaxH = expectedColMaxH;
    }
  }

  currentColumnWidths = calcCropW;
  const totalHeight = numCols * colMaxH;

  const numChunks = Math.ceil(totalHeight / MASTER_CHUNK_H);
  const chunks = [];
  for (let k = 0; k < numChunks; k++) {
    const ch = document.createElement("canvas");
    ch.width = calcCropW;
    ch.height = MASTER_CHUNK_H;
    chunks.push(ch);
  }

  lastGeneratedColumns = [];
  for (let c = 0; c < numCols; c++) {
    const colC = document.createElement("canvas");
    colC.width = calcCropW;
    colC.height = colMaxH;
    const colCtx = colC.getContext("2d");
    const sx = mode === "grid" ? colGap + c * (calcCropW + colGap) : 0;
    const sy = mode === "grid" ? headerH + colGap : 0;
    colCtx.drawImage(img, sx, sy, calcCropW, colMaxH, 0, 0, calcCropW, colMaxH);
    lastGeneratedColumns.push(colC);

    const colBottomStart = c * colMaxH;
    const startChunk = Math.floor(colBottomStart / MASTER_CHUNK_H);
    const endChunk = Math.floor((colBottomStart + colMaxH - 1) / MASTER_CHUNK_H);
    for (let k = startChunk; k <= endChunk; k++) {
      const chunkBottomStart = k * MASTER_CHUNK_H;
      const overlapBottom = Math.max(colBottomStart, chunkBottomStart);
      const overlapTop = Math.min(colBottomStart + colMaxH, chunkBottomStart + MASTER_CHUNK_H);
      const copyH = overlapTop - overlapBottom;
      if (copyH <= 0) continue;

      const srcY = colMaxH - (overlapBottom - colBottomStart) - copyH;
      const dstY = MASTER_CHUNK_H - (overlapBottom - chunkBottomStart) - copyH;
      chunks[k].getContext("2d").drawImage(colC, 0, srcY, calcCropW, copyH, 0, dstY, calcCropW, copyH);
    }
  }

  masterChartData = {
    hasData: true,
    cropW: calcCropW,
    totalHeight: totalHeight,
    chunks: chunks,
    tStart: tStart,
    tEnd: tEnd,
    timeToYMap: [],
    sourceLabel: fileName
  };
  reLayoutBtn.disabled = false;

  chartMeta = {
    isGenerated: false,
    mode: mode,
    numCols: numCols,
    cropW: calcCropW,
    colMaxH: colMaxH,
    colGap: mode === "grid" ? colGap : 0,
    headerH: mode === "grid" ? headerH : 0,
    totalHeight: totalHeight,
    tStart: tStart,
    tEnd: tEnd,
    scale: 1,
    timeToYMap: []
  };
}

// =========================================================
// 5. マスター譜面データから「1列の高さ」を変更して即時再生成する関数
// =========================================================
function rebuildLayoutFromMaster() {
  if (!masterChartData.hasData) return;

  const { cropW, totalHeight, chunks, tStart, tEnd, timeToYMap, sourceLabel } = masterChartData;
  const colMaxH = Math.max(400, parseInt(colHeightInput.value, 10) || 1800);
  const mode = layoutMode.value;
  const numCols = Math.max(1, Math.ceil(totalHeight / colMaxH));
  const colGap = 14;
  const headerH = 36;

  const newColumns = [];
  for (let c = 0; c < numCols; c++) {
    const colC = document.createElement("canvas");
    colC.width = cropW;
    colC.height = colMaxH;
    const colCtx = colC.getContext("2d");
    colCtx.fillStyle = "#000000";
    colCtx.fillRect(0, 0, cropW, colMaxH);

    const colBottomStart = c * colMaxH;
    const colBottomEnd = Math.min(totalHeight, colBottomStart + colMaxH);
    const startChunk = Math.floor(colBottomStart / MASTER_CHUNK_H);
    const endChunk = Math.floor((colBottomEnd - 1) / MASTER_CHUNK_H);

    for (let k = startChunk; k <= endChunk; k++) {
      if (k < 0 || k >= chunks.length) continue;
      const chunkBottomStart = k * MASTER_CHUNK_H;
      const overlapBottom = Math.max(colBottomStart, chunkBottomStart);
      const overlapTop = Math.min(colBottomEnd, chunkBottomStart + MASTER_CHUNK_H);
      const copyH = overlapTop - overlapBottom;
      if (copyH <= 0) continue;

      const srcY = MASTER_CHUNK_H - (overlapBottom - chunkBottomStart) - copyH;
      const dstY = colMaxH - (overlapBottom - colBottomStart) - copyH;
      colCtx.drawImage(chunks[k], 0, srcY, cropW, copyH, 0, dstY, cropW, copyH);
    }
    newColumns.push(colC);
  }

  lastGeneratedColumns = newColumns;
  currentColumnWidths = cropW;

  let singleScale = 1;
  if (mode === "single") {
    const maxAllowedH = 16000;
    singleScale = totalHeight > maxAllowedH ? (maxAllowedH / totalHeight) : 1;
    outputCanvas.width = Math.round(cropW * singleScale);
    outputCanvas.height = Math.round(totalHeight * singleScale);
    const outCtx = outputCanvas.getContext("2d");
    outCtx.imageSmoothingEnabled = true;
    outCtx.imageSmoothingQuality = "high";
    outCtx.fillStyle = "#000000";
    outCtx.fillRect(0, 0, outputCanvas.width, outputCanvas.height);
    outCtx.scale(singleScale, singleScale);

    for (let c = 0; c < numCols; c++) {
      const destY = totalHeight - (c + 1) * colMaxH;
      outCtx.drawImage(newColumns[c], 0, destY);
    }
  } else {
    const totalW = numCols * cropW + (numCols + 1) * colGap;
    const fullH = colMaxH + headerH + colGap * 2;
    outputCanvas.width = totalW;
    outputCanvas.height = fullH;
    const outCtx = outputCanvas.getContext("2d");

    outCtx.fillStyle = blackBgToggle.checked ? "#05070b" : "#161c2e";
    outCtx.fillRect(0, 0, totalW, fullH);

    for (let c = 0; c < numCols; c++) {
      const x = colGap + c * (cropW + colGap);
      const y = headerH + colGap;

      outCtx.fillStyle = "#00e6e6";
      outCtx.font = "bold 15px 'Segoe UI', 'Meiryo', sans-serif";
      outCtx.fillText(`列 ${c + 1} / ${numCols} （下から上へ進行）`, x + 6, headerH - 4);

      outCtx.drawImage(newColumns[c], x, y);
      outCtx.strokeStyle = "#2b3856";
      outCtx.lineWidth = 2;
      outCtx.strokeRect(x, y, cropW, colMaxH);
    }
  }

  playheadCanvas.width = outputCanvas.width;
  playheadCanvas.height = outputCanvas.height;

  chartMeta = {
    isGenerated: true,
    mode: mode,
    numCols: numCols,
    cropW: cropW,
    colMaxH: colMaxH,
    colGap: colGap,
    headerH: headerH,
    totalHeight: totalHeight,
    tStart: tStart,
    tEnd: tEnd,
    scale: singleScale,
    timeToYMap: timeToYMap
  };

  currentViewFileName.textContent = `${sourceLabel || "再生成画像"} [1列の高さ: ${colMaxH}px / 全${numCols}列] (${outputCanvas.width} x ${outputCanvas.height} px)`;
  resultArea.style.display = "block";
  setupViewerAfterGenerate(numCols);
  drawPlayheadOverlay();
}

function drawPreview() {
  if (!video.videoWidth) return;
  const w = previewCanvas.width;
  const h = previewCanvas.height;
  pCtx.drawImage(video, 0, 0, w, h);

  const leftPct = parseFloat(cropLeftSlider.value) / 100;
  const rightPct = parseFloat(cropRightSlider.value) / 100;
  const x1 = Math.round(w * leftPct);
  const x2 = Math.round(w * rightPct);
  const cw = x2 - x1;

  if (blackBgToggle.checked && cw > 10) {
    const subC = document.createElement("canvas");
    subC.width = cw;
    subC.height = h;
    const subCtx = subC.getContext("2d", { willReadFrequently: true });
    subCtx.drawImage(video, x1, 0, cw, h, 0, 0, cw, h);
    applyBlackBackgroundFilter(subCtx, cw, h);
    pCtx.drawImage(subC, x1, 0);
  }

  pCtx.fillStyle = "rgba(0, 0, 0, 0.72)";
  pCtx.fillRect(0, 0, x1, h);
  pCtx.fillRect(x2, 0, w - x2, h);

  pCtx.strokeStyle = "#00d4d4";
  pCtx.lineWidth = 2;
  pCtx.strokeRect(x1, 0, cw, h);

  const capY = Math.round(h * 0.70);
  pCtx.strokeStyle = "#ff4d88";
  pCtx.setLineDash([6, 4]);
  pCtx.beginPath();
  pCtx.moveTo(x1, capY);
  pCtx.lineTo(x2, capY);
  pCtx.stroke();
  pCtx.setLineDash([]);
}

// =========================================================
// 6. 動画と連動する「再生位置バー」の描画＆逆シーク連携
// =========================================================
function getBottomYForTime(t) {
  const { tStart, tEnd, totalHeight, timeToYMap } = chartMeta;
  if (timeToYMap && timeToYMap.length >= 2) {
    if (t <= timeToYMap[0].time) return timeToYMap[0].bottomY;
    const last = timeToYMap[timeToYMap.length - 1];
    if (t >= last.time) return last.bottomY;
    let low = 0, high = timeToYMap.length - 1;
    while (low <= high) {
      const mid = (low + high) >> 1;
      if (timeToYMap[mid].time < t) low = mid + 1;
      else high = mid - 1;
    }
    const p1 = timeToYMap[Math.max(0, low - 1)];
    const p2 = timeToYMap[Math.min(timeToYMap.length - 1, low)];
    const ratio = (p2.time - p1.time) > 0.0001 ? (t - p1.time) / (p2.time - p1.time) : 0;
    return p1.bottomY + ratio * (p2.bottomY - p1.bottomY);
  } else {
    const dur = Math.max(0.1, tEnd - tStart);
    const ratio = Math.max(0, Math.min(1, (t - tStart) / dur));
    return ratio * totalHeight;
  }
}

function getTimeForBottomY(targetBottomY) {
  const { tStart, tEnd, totalHeight, timeToYMap } = chartMeta;
  if (timeToYMap && timeToYMap.length >= 2) {
    if (targetBottomY <= timeToYMap[0].bottomY) return timeToYMap[0].time;
    const last = timeToYMap[timeToYMap.length - 1];
    if (targetBottomY >= last.bottomY) return last.time;
    for (let i = 1; i < timeToYMap.length; i++) {
      if (timeToYMap[i].bottomY >= targetBottomY) {
        const p1 = timeToYMap[i - 1];
        const p2 = timeToYMap[i];
        const dy = p2.bottomY - p1.bottomY;
        const r = dy > 0.001 ? (targetBottomY - p1.bottomY) / dy : 0;
        return p1.time + r * (p2.time - p1.time);
      }
    }
  }
  const ratio = Math.max(0, Math.min(1, targetBottomY / Math.max(1, totalHeight)));
  return tStart + ratio * (tEnd - tStart);
}

function drawPlayheadOverlay() {
  if (!playheadCanvas.width || !playheadCanvas.height) return;
  const ctx = playheadCanvas.getContext("2d");
  ctx.clearRect(0, 0, playheadCanvas.width, playheadCanvas.height);

  if (!showPlayheadToggle.checked) return;

  const t = video.currentTime || 0;
  const bottomY = getBottomYForTime(t);

  let barX = 0, barY = 0, barW = chartMeta.cropW;
  let colIndex = 0;

  if (chartMeta.mode === "single") {
    const scale = chartMeta.scale || 1;
    barX = 0;
    barW = playheadCanvas.width;
    barY = playheadCanvas.height - bottomY * scale;
  } else {
    const { colMaxH, cropW, colGap, headerH, numCols } = chartMeta;
    colIndex = Math.min(numCols - 1, Math.max(0, Math.floor(bottomY / colMaxH)));
    const relBottom = bottomY - colIndex * colMaxH;
    barX = colGap + colIndex * (cropW + colGap);
    barY = headerH + colGap + (colMaxH - relBottom);
    barW = cropW;
  }

  if (chartMeta.mode === "grid") {
    ctx.strokeStyle = "rgba(255, 77, 136, 0.55)";
    ctx.lineWidth = 3;
    ctx.strokeRect(barX, chartMeta.headerH + chartMeta.colGap, barW, chartMeta.colMaxH);
  }

  ctx.save();
  ctx.fillStyle = "rgba(255, 50, 110, 0.22)";
  ctx.fillRect(barX, barY - 8, barW, 16);

  ctx.strokeStyle = "#ff2a6d";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(barX, barY);
  ctx.lineTo(barX + barW, barY);
  ctx.stroke();

  ctx.fillStyle = "#ff2a6d";
  ctx.fillRect(barX, barY - 12, 78, 22);
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 12px 'Segoe UI', sans-serif";
  ctx.fillText(`${t.toFixed(2)}s`, barX + 6, barY + 4);
  ctx.restore();

  if (followPlayheadToggle.checked && !isDragging) {
    const vw = viewerViewport.clientWidth;
    const vh = viewerViewport.clientHeight;
    vX = vw * 0.5 - (barX + barW * 0.5) * vScale;
    vY = vh * 0.55 - barY * vScale;
    updateViewerTransform();
  }
}

function seekTo(timeSec) {
  return new Promise((resolve) => {
    const target = Math.min(Math.max(0, timeSec), video.duration || timeSec);
    if (Math.abs(video.currentTime - target) < 0.0005) {
      resolve();
      return;
    }
    const onSeeked = () => {
      video.removeEventListener("seeked", onSeeked);
      resolve();
    };
    video.addEventListener("seeked", onSeeked);
    video.currentTime = target;
  });
}

// =========================================================
// 7. 2フレーム間の移動ピクセル量（サブピクセル精度）の算出
// =========================================================
function matchFrameDisplacement(img1, img2, cw, h, minDy, maxDy) {
  const yStart = Math.round(h * 0.25);
  const yEnd = Math.round(h * 0.58);
  let bestDy = -1;
  const scores = new Float64Array(maxDy + 2);
  scores.fill(Infinity);
  let minScore = Infinity;

  for (let dy = minDy; dy <= maxDy; dy++) {
    let diffSum = 0, count = 0;
    for (let y = yStart; y < yEnd; y += 2) {
      const y2 = y + dy;
      if (y2 >= h) continue;
      const row1 = y * cw;
      const row2 = y2 * cw;
      for (let x = 0; x < cw; x += 4) {
        const idx1 = (row1 + x) << 2;
        const idx2 = (row2 + x) << 2;
        if (img1[idx1] + img1[idx1 + 1] + img1[idx1 + 2] > 140) {
          diffSum += Math.abs(img1[idx1] - img2[idx2]) +
                     Math.abs(img1[idx1 + 1] - img2[idx2 + 1]) +
                     Math.abs(img1[idx1 + 2] - img2[idx2 + 2]);
          count++;
        }
      }
    }
    if (count > 25) {
      const s = diffSum / count;
      scores[dy] = s;
      if (s < minScore) { minScore = s; bestDy = dy; }
    }
  }

  if (bestDy > minDy && bestDy < maxDy && minScore < 95) {
    const sPrev = scores[bestDy - 1];
    const sCurr = scores[bestDy];
    const sNext = scores[bestDy + 1];
    const denom = 2 * (sPrev - 2 * sCurr + sNext);
    const subOffset = denom !== 0 ? (sPrev - sNext) / denom : 0;
    return bestDy + Math.max(-0.5, Math.min(0.5, subOffset));
  }
  return bestDy >= 0 && minScore < 95 ? bestDy : -1;
}

autoSpeedBtn.addEventListener("click", async () => {
  if (!video.videoWidth) return;
  video.pause();
  autoSpeedBtn.disabled = true;
  autoSpeedBtn.textContent = "計測中...";

  try {
    const w = video.videoWidth;
    const h = video.videoHeight;
    const x1 = Math.round(w * (parseFloat(cropLeftSlider.value) / 100));

    const tmpC = document.createElement("canvas");
    tmpC.width = cw;
    tmpC.height = h;
    const ctx = tmpC.getContext("2d", { willReadFrequently: true });

    const tStart = parseFloat(startTimeInput.value) || 2.0;
    const tEnd = parseFloat(endTimeInput.value) || 10.0;
    const dt = 0.15;
    const samples = [];

    for (let i = 0; i < 8; i++) {
      const t = tStart + ((tEnd - tStart) * (i + 1)) / 10;
      await seekTo(t);
      ctx.drawImage(video, x1, 0, cw, h, 0, 0, cw, h);
      const img1 = ctx.getImageData(0, 0, cw, h).data;

      await seekTo(t + dt);
      ctx.drawImage(video, x1, 0, cw, h, 0, 0, cw, h);
      const img2 = ctx.getImageData(0, 0, cw, h).data;

      const exactDy = matchFrameDisplacement(img1, img2, cw, h, Math.max(1, Math.round(h * 0.02)), Math.round(h * 0.16));
      if (exactDy > 0) {
        samples.push((exactDy / h / dt) * 100);
      }
    }

    if (samples.length > 0) {
      samples.sort((a, b) => a - b);
      const median = samples[Math.floor(samples.length / 2)];
      const rounded = (Math.round(median * 50) / 50).toFixed(2);
      speedInput.value = rounded;
      speedSlider.value = rounded;
      speedValLabel.textContent = `${rounded} %/秒`;
    }
  } finally {
    autoSpeedBtn.disabled = false;
    autoSpeedBtn.textContent = "速度を自動計測する";
    await seekTo(parseFloat(startTimeInput.value) || 2.0);
  }
});

// =========================================================
// 8. 高速マルチスライス＆マスターデータ保持型の譜面合成エンジン
// =========================================================
async function generateChartImage(isTestMode = false) {
  if (!video.videoWidth) return;
  video.pause();

  const startWallTime = performance.now();
  generateBtn.disabled = true;
  testGenerateBtn.disabled = true;
  reLayoutBtn.disabled = true;
  progressContainer.style.display = "block";

  const w = video.videoWidth;
  const h = video.videoHeight;
  const x1 = Math.round(w * (parseFloat(cropLeftSlider.value) / 100));
  const x2 = Math.round(w * (parseFloat(cropRightSlider.value) / 100));
  const cropW = x2 - x1;
  currentColumnWidths = cropW;

  const tStart = parseFloat(startTimeInput.value) || 0;
  const fullEnd = parseFloat(endTimeInput.value) || video.duration;
  const tEnd = isTestMode ? Math.min(fullEnd, tStart + 12.0) : fullEnd;
  const duration = Math.max(0.5, tEnd - tStart);

  const baseSpeedPct = parseFloat(speedInput.value) || 47.50;
  const baseSpeedPxPerSec = h * (baseSpeedPct / 100);

  const qMode = qualitySelect.value;
  let stepPx = 20;
  let overlapPx = 3;
  if (qMode === "fast_ultra") { stepPx = 20; overlapPx = 3; }
  else if (qMode === "turbo") { stepPx = 38; overlapPx = 4; }
  else if (qMode === "ultra") { stepPx = 4; overlapPx = 2; }
  else if (qMode === "high") { stepPx = 8; overlapPx = 2; }
  else if (qMode === "normal") { stepPx = 16; overlapPx = 2; }

  const capY = Math.round(h * 0.70);
  const bottomBaseH = h - capY;
  const topSafeY = Math.round(h * 0.07);

  const masterChunks = [];
  const masterCtxs = [];

  function ensureMasterChunkExists(k) {
    while (masterChunks.length <= k) {
      const mc = document.createElement("canvas");
      mc.width = cropW;
      mc.height = MASTER_CHUNK_H;
      const mctx = mc.getContext("2d", { willReadFrequently: true });
      mctx.imageSmoothingEnabled = true;
      mctx.imageSmoothingQuality = "high";
      mctx.fillStyle = "#000000";
      mctx.fillRect(0, 0, cropW, MASTER_CHUNK_H);
      masterChunks.push(mc);
      masterCtxs.push(mctx);
    }
  }

  function drawSliceToMaster(srcCanvas, srcY, srcH, bottomY, alpha = 1.0) {
    if (srcH <= 0.1) return;
    const startChunk = Math.floor(bottomY / MASTER_CHUNK_H);
    const endChunk = Math.floor((bottomY + srcH - 0.001) / MASTER_CHUNK_H);
    for (let k = startChunk; k <= endChunk; k++) {
      if (k < 0) continue;
      ensureMasterChunkExists(k);
      const chunkBottomOffset = k * MASTER_CHUNK_H;
      const relBottom = bottomY - chunkBottomOffset;
      const destY = MASTER_CHUNK_H - relBottom - srcH;
      const ctx = masterCtxs[k];
      if (alpha < 0.99) {
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.drawImage(srcCanvas, 0, srcY, cropW, srcH, 0, destY, cropW, srcH);
        ctx.restore();
      } else {
        ctx.drawImage(srcCanvas, 0, srcY, cropW, srcH, 0, destY, cropW, srcH);
      }
    }
  }

  const frameCanvas = document.createElement("canvas");
  frameCanvas.width = cropW;
  frameCanvas.height = h;
  const fCtx = frameCanvas.getContext("2d", { willReadFrequently: true });
  fCtx.imageSmoothingEnabled = true;
  fCtx.imageSmoothingQuality = "high";

  let currentBottomY = 0;
  const timeToYMap = [];
  const isAutoTrack = autoTrackToggle.checked;

  if (isAutoTrack) {
    const dtTrack = Math.min(0.12, Math.max(0.04, stepPx / baseSpeedPxPerSec));
    const totalSteps = Math.floor(duration / dtTrack);
    let prevImgData = null;
    let lastValidDy = baseSpeedPxPerSec * dtTrack;

    for (let step = 0; step <= totalSteps; step++) {
      const exactTime = tStart + step * dtTrack;
      await seekTo(exactTime);
      fCtx.drawImage(video, x1, 0, cropW, h, 0, 0, cropW, h);
      const currImgData = fCtx.getImageData(0, 0, cropW, h).data;

      if (step === 0) {
        if (bottomBaseH > 0) {
          drawSliceToMaster(frameCanvas, capY, bottomBaseH, 0, 1.0);
          currentBottomY += bottomBaseH;
        }
        timeToYMap.push({ time: video.currentTime, bottomY: currentBottomY });
        prevImgData = currImgData;
        continue;
      }

      const maxSearchDy = Math.min(Math.round(h * 0.25), Math.max(30, Math.round(lastValidDy * 2.5)));
      let trackedDy = matchFrameDisplacement(prevImgData, currImgData, cropW, h, 0, maxSearchDy);

      if (trackedDy < 0) {
        trackedDy = lastValidDy;
      } else {
        lastValidDy = trackedDy * 0.7 + lastValidDy * 0.3;
      }

      if (trackedDy > 0.4) {
        const sy = Math.max(0, Math.min(h - trackedDy, capY - trackedDy));
        drawSliceToMaster(frameCanvas, sy, trackedDy, currentBottomY, 1.0);

        if (overlapPx > 0 && currentBottomY > overlapPx) {
          const featherSy = Math.max(0, Math.min(h - overlapPx, sy + trackedDy - overlapPx * 0.5));
          drawSliceToMaster(frameCanvas, featherSy, overlapPx, currentBottomY - overlapPx * 0.5, 0.45);
        }
        currentBottomY += trackedDy;
      }

      timeToYMap.push({ time: video.currentTime, bottomY: currentBottomY });
      prevImgData = currImgData;

      if (step === totalSteps) {
        const topCapH = Math.max(0, (capY - trackedDy) - topSafeY);
        if (topCapH > 0) {
          drawSliceToMaster(frameCanvas, topSafeY, topCapH, currentBottomY, 1.0);
          currentBottomY += topCapH;
        }
      }

      if (step % 5 === 0 || step === totalSteps) {
        const pct = Math.round(((step + 1) / (totalSteps + 1)) * 100);
        progressPercent.textContent = `${pct}%`;
        progressBar.style.width = `${pct}%`;
        progressText.textContent = `自動追跡で合成中... (${exactTime.toFixed(1)}秒 / ${tEnd.toFixed(1)}秒)`;
      }
    }
  } else {
    const dt = stepPx / baseSpeedPxPerSec;
    const totalSteps = Math.floor(duration / dt);
    const topCapH = Math.max(0, (capY - stepPx) - topSafeY);

    for (let step = 0; step <= totalSteps; step++) {
      const exactTime = tStart + (step * stepPx) / baseSpeedPxPerSec;
      await seekTo(exactTime);

      const timeDiff = video.currentTime - exactTime;
      const subPixelShiftY = timeDiff * baseSpeedPxPerSec;

      fCtx.drawImage(video, x1, 0, cropW, h, 0, 0, cropW, h);

      if (step === 0 && bottomBaseH > 0) {
        drawSliceToMaster(frameCanvas, capY + subPixelShiftY, bottomBaseH, 0, 1.0);
        currentBottomY += bottomBaseH;
      }

      const sy = Math.max(0, Math.min(h - stepPx, (capY - stepPx) + subPixelShiftY));
      drawSliceToMaster(frameCanvas, sy, stepPx, currentBottomY, 1.0);

      if (step > 0 && overlapPx > 0) {
        const featherSy = Math.max(0, Math.min(h - overlapPx, sy + stepPx - overlapPx * 0.5));
        drawSliceToMaster(frameCanvas, featherSy, overlapPx, currentBottomY - overlapPx * 0.5, 0.45);
      }

      currentBottomY += stepPx;
      timeToYMap.push({ time: exactTime, bottomY: currentBottomY });

      if (step === totalSteps && topCapH > 0) {
        const topSy = Math.max(0, topSafeY + subPixelShiftY);
        drawSliceToMaster(frameCanvas, topSy, topCapH, currentBottomY, 1.0);
        currentBottomY += topCapH;
      }

      if (step % 8 === 0 || step === totalSteps) {
        const pct = Math.round(((step + 1) / (totalSteps + 1)) * 100);
        progressPercent.textContent = `${pct}%`;
        progressBar.style.width = `${pct}%`;
        progressText.textContent = `高速合成中... (${exactTime.toFixed(1)}秒 / ${tEnd.toFixed(1)}秒)`;
      }
    }
  }

  const totalHeight = Math.max(100, Math.round(currentBottomY));

  if (blackBgToggle.checked) {
    progressText.textContent = "背景を黒に変換中...";
    await new Promise(r => setTimeout(r, 10));
    for (let k = 0; k < masterChunks.length; k++) {
      applyBlackBackgroundFilter(masterCtxs[k], cropW, MASTER_CHUNK_H);
    }
  }

  masterChartData = {
    hasData: true,
    cropW: cropW,
    totalHeight: totalHeight,
    chunks: masterChunks,
    tStart: tStart,
    tEnd: tEnd,
    timeToYMap: timeToYMap,
    sourceLabel: activeVideoName ? `${activeVideoName} からの生成譜面` : "動画からの生成譜面"
  };

  rebuildLayoutFromMaster();

  const elapsedSec = ((performance.now() - startWallTime) / 1000).toFixed(1);
  progressText.textContent = `譜面静止画の作成が完了しました（処理時間: ${elapsedSec}秒）`;
  generateBtn.disabled = false;
  testGenerateBtn.disabled = false;
  reLayoutBtn.disabled = false;
}

generateBtn.addEventListener("click", () => generateChartImage(false));
testGenerateBtn.addEventListener("click", () => generateChartImage(true));

// =========================================================
// 9. ソフト内蔵「譜面ビューアー」＆ダブルクリック動画シーク連携
// =========================================================
const viewerBox = document.getElementById("viewerBox");
const viewerViewport = document.getElementById("viewerViewport");
const zoomLevelLabel = document.getElementById("zoomLevelLabel");
const zoomInBtn = document.getElementById("zoomInBtn");
const zoomOutBtn = document.getElementById("zoomOutBtn");
const fitAllBtn = document.getElementById("fitAllBtn");
const fitHeightBtn = document.getElementById("fitHeightBtn");
const zoom100Btn = document.getElementById("zoom100Btn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const colJumpBar = document.getElementById("colJumpBar");

let vScale = 1.0;
let vX = 0;
let vY = 0;
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;

function updateViewerTransform() {
  canvasStage.style.transform = `translate(${vX}px, ${vY}px) scale(${vScale})`;
  zoomLevelLabel.textContent = `${Math.round(vScale * 100)}%`;
}

function fitViewerAll() {
  if (!outputCanvas.width) return;
  const vw = viewerViewport.clientWidth;
  const vh = viewerViewport.clientHeight;
  vScale = Math.min((vw - 20) / outputCanvas.width, (vh - 20) / outputCanvas.height, 1.5);
  vX = Math.max(10, (vw - outputCanvas.width * vScale) / 2);
  vY = Math.max(10, (vh - outputCanvas.height * vScale) / 2);
  updateViewerTransform();
}

function fitViewerHeight() {
  if (!outputCanvas.height) return;
  const vh = viewerViewport.clientHeight;
  vScale = (vh - 20) / outputCanvas.height;
  vX = 10;
  vY = 10;
  updateViewerTransform();
}

function zoomAtCenter(factor) {
  const vw = viewerViewport.clientWidth;
  const vh = viewerViewport.clientHeight;
  const cx = vw / 2;
  const cy = vh / 2;
  const newScale = Math.min(4.0, Math.max(0.08, vScale * factor));
  const ratio = newScale / vScale;
  vX = cx - (cx - vX) * ratio;
  vY = cy - (cy - vY) * ratio;
  vScale = newScale;
  updateViewerTransform();
}

function setupViewerAfterGenerate(numCols) {
  colJumpBar.innerHTML = `<span style="font-size:0.82rem; color:#9aa5b8; white-space:nowrap;">列へジャンプ:</span>`;
  if (chartMeta.mode === "grid" && numCols > 1) {
    colJumpBar.style.display = "flex";
    for (let c = 0; c < numCols; c++) {
      const btn = document.createElement("button");
      btn.className = "btn btn-secondary";
      btn.style.padding = "4px 10px";
      btn.style.fontSize = "0.8rem";
      btn.style.whiteSpace = "nowrap";
      btn.textContent = `${c + 1}列目`;
      btn.addEventListener("click", () => {
        const colGap = chartMeta.colGap || 14;
        const colX = colGap + c * (chartMeta.cropW + colGap);
        vScale = Math.min(1.2, Math.max(0.6, viewerViewport.clientWidth / (chartMeta.cropW * 2.2)));
        vX = 30 - colX * vScale;
        vY = 10;
        updateViewerTransform();
      });
      colJumpBar.appendChild(btn);
    }
  } else {
    colJumpBar.style.display = "none";
  }

  setTimeout(fitViewerAll, 50);
}

viewerViewport.addEventListener("dblclick", (e) => {
  if (!video.src || !outputCanvas.width) return;
  const rect = viewerViewport.getBoundingClientRect();
  const canvasX = (e.clientX - rect.left - vX) / vScale;
  const canvasY = (e.clientY - rect.top - vY) / vScale;

  let clickedBottomY = 0;
  if (chartMeta.mode === "single") {
    clickedBottomY = (outputCanvas.height - canvasY) / (chartMeta.scale || 1);
  } else {
    const { colGap, cropW, headerH, colMaxH, numCols } = chartMeta;
    const colIdx = Math.max(0, Math.min(numCols - 1, Math.floor((canvasX - colGap) / (cropW + colGap))));
    const relY = Math.max(0, Math.min(colMaxH, canvasY - (headerH + colGap)));
    const relBottom = colMaxH - relY;
    clickedBottomY = colIdx * colMaxH + relBottom;
  }

  const targetTime = getTimeForBottomY(clickedBottomY);
  video.currentTime = Math.max(0, Math.min(video.duration || targetTime, targetTime));
});

zoomInBtn.addEventListener("click", () => zoomAtCenter(1.25));
zoomOutBtn.addEventListener("click", () => zoomAtCenter(0.8));
fitAllBtn.addEventListener("click", fitViewerAll);
fitHeightBtn.addEventListener("click", fitViewerHeight);
zoom100Btn.addEventListener("click", () => { vScale = 1.0; vX = 10; vY = 10; updateViewerTransform(); });

fullscreenBtn.addEventListener("click", () => {
  viewerBox.classList.toggle("fullscreen");
  if (viewerBox.classList.contains("fullscreen")) {
    fullscreenBtn.textContent = "全画面を閉じる (Esc)";
  } else {
    fullscreenBtn.textContent = "全画面で大きく見る";
  }
  setTimeout(fitViewerAll, 50);
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && viewerBox.classList.contains("fullscreen")) {
    viewerBox.classList.remove("fullscreen");
    fullscreenBtn.textContent = "全画面で大きく見る";
    setTimeout(fitViewerAll, 50);
  }
});

viewerViewport.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = viewerViewport.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.15 : 0.87;
  const newScale = Math.min(4.5, Math.max(0.08, vScale * factor));
  const ratio = newScale / vScale;
  vX = mx - (mx - vX) * ratio;
  vY = my - (my - vY) * ratio;
  vScale = newScale;
  updateViewerTransform();
}, { passive: false });

viewerViewport.addEventListener("mousedown", (e) => {
  isDragging = true;
  dragStartX = e.clientX - vX;
  dragStartY = e.clientY - vY;
  viewerViewport.classList.add("dragging");
});
window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  vX = e.clientX - dragStartX;
  vY = e.clientY - dragStartY;
  updateViewerTransform();
});
window.addEventListener("mouseup", () => {
  isDragging = false;
  viewerViewport.classList.remove("dragging");
});

// =========================================================
// 10. PNG画像＆ZIP一括ダウンロード保存
// =========================================================
downloadPngBtn.addEventListener("click", () => {
  outputCanvas.toBlob((blob) => {
    const hVal = parseInt(colHeightInput.value, 10) || 1800;
    downloadBlob(blob, `Proseka_Chart_${hVal}px.png`);
  }, "image/png");
});

downloadResultZipBtn.addEventListener("click", async () => {
  downloadResultZipBtn.disabled = true;
  downloadResultZipBtn.textContent = "ZIPファイルを作成中...";
  try {
    const files = [];
    const fullPngBytes = await canvasToUint8Array(outputCanvas);
    files.push({ name: "00_全体一覧譜面_FullChart.png", data: fullPngBytes });

    for (let i = 0; i < lastGeneratedColumns.length; i++) {
      const colBytes = await canvasToUint8Array(lastGeneratedColumns[i]);
      const num = String(i + 1).padStart(2, "0");
      files.push({ name: `分割列_${num}.png`, data: colBytes });
    }

    const zipBlob = createZipBlob(files);
    downloadBlob(zipBlob, "Proseka_Chart_Images.zip");
  } finally {
    downloadResultZipBtn.disabled = false;
    downloadResultZipBtn.textContent = "全体画像＋列ごとの分割画像をZIPで保存";
  }
});
</script>
