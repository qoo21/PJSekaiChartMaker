// 8. 【新改善2＆3】実フレーム同期・停止区間自動スキップ・固定速度シーク合成エンジン
// =========================================================
function requestStopGeneration() {
  cancelGenerationRequested = true;
  for (const fn of Array.from(activeSeekResolvers)) {
    try { fn(); } catch (e) {}
  }
  activeSeekResolvers.clear();
  setGeneratingLock(false);
  progressText.textContent = "静止画の生成を停止しました";
}
stopGenerateBtn.addEventListener("click", requestStopGeneration);
progressStopBtn.addEventListener("click", requestStopGeneration);

function computeWorkScale(rawH) {
  const resMode = resolutionSelect.value || "720";
  if (resMode === "original") return 1.0;
  const maxH = parseInt(resMode, 10) || 720;
  return rawH > maxH ? (maxH / rawH) : 1.0;
}

// 2フレームが完全に同一（重複ビデオフレーム、または再生前後の停止時間）であるかを高速判定する関数
function computeBandDifference(img1, img2, cw, yStart, yEnd) {
  let diffSum = 0;
  let count = 0;
  for (let y = yStart; y < yEnd; y += 2) {
    const row = y * cw;
    for (let x = 0; x < cw; x += 4) {
      const idx = (row + x) << 2;
      diffSum += Math.abs(img1[idx] - img2[idx]) +
                 Math.abs(img1[idx + 1] - img2[idx + 1]) +
                 Math.abs(img1[idx + 2] - img2[idx + 2]);
      count++;
    }
  }
  return count > 0 ? (diffSum / count) : 999;
}

async function buildMasterDataForVideoElement(vidElem, sourceName, isTestMode, onStepProgress) {
  const rawW = vidElem.videoWidth;
  const rawH = vidElem.videoHeight;
  const leftPct = parseFloat(cropLeftSlider.value) / 100;
  const rightPct = parseFloat(cropRightSlider.value) / 100;
  const srcX1 = Math.round(rawW * leftPct);
  const srcX2 = Math.round(rawW * rightPct);
  const srcCropW = Math.max(10, srcX2 - srcX1);

  const workScale = computeWorkScale(rawH);
  const h = Math.max(160, Math.round(rawH * workScale));
  const cropW = Math.max(60, Math.round(srcCropW * workScale));

  const dur = vidElem.duration || 120;
  let tStart = 0.0;
  let fullEnd = Math.max(0.5, dur - 0.04);

  if (vidElem === video) {
    const userStart = parseFloat(startTimeInput.value);
    const userEnd = parseFloat(endTimeInput.value);
    tStart = !isNaN(userStart) ? Math.min(Math.max(0, userStart), Math.max(0, dur - 0.5)) : 0.0;
    fullEnd = (!isNaN(userEnd) && userEnd > tStart)
      ? Math.min(userEnd, Math.max(tStart + 0.5, dur - 0.04))
      : Math.max(tStart + 0.5, dur - 0.04);
  }

  const tEnd = isTestMode ? Math.min(fullEnd, tStart + 12.0) : fullEnd;
  const duration = Math.max(0.5, tEnd - tStart);

  // 1つの基準スクロール速度（%/秒）で固定
  const speedPctPerSec = parseFloat(speedInput.value) || 47.50;
  const speedPxPerSec = Math.max(10, h * (speedPctPerSec / 100));

  // スライドの曲線を滑らかに保ち、かつノーツが削れない細かさ（画面高さの約1.8%＝約8〜12px刻み）に設定
  const nominalStepPx = Math.max(6, Math.min(14, Math.round(h * 0.018)));
  const dt = Math.max(0.0167, nominalStepPx / speedPxPerSec);
  const totalSteps = Math.max(1, Math.floor(duration / dt));

  const capY = Math.round(h * 0.70);
  const bottomBaseH = h - capY;
  const topSafeY = Math.round(h * 0.07);

  const masterChunks = [];
  const masterCtxs = [];

  function ensureMasterChunkExists(k) {
    while (masterChunks.length <= k) {
      const mc = document.createElement("canvas");
      mc.width = cropW;
      mc.height = MASTER_CHUNK_H;
      const mctx = mc.getContext("2d", { willReadFrequently: true });
      mctx.imageSmoothingEnabled = true;
      mctx.imageSmoothingQuality = "high";
      mctx.fillStyle = "#000000";
      mctx.fillRect(0, 0, cropW, MASTER_CHUNK_H);
      masterChunks.push(mc);
      masterCtxs.push(mctx);
    }
  }

  function drawSliceToMaster(srcCanvas, srcY, srcH, bottomY) {
    if (srcH <= 0.05) return;
    // 境界の隙間（黒い1pxライン）を防ぐため、上方向に 0.6px だけ微小にオーバーラップさせて不透明描画する
    const drawH = srcH + 0.6;
    const startChunk = Math.floor(bottomY / MASTER_CHUNK_H);
    const endChunk = Math.floor((bottomY + drawH - 0.0001) / MASTER_CHUNK_H);
    for (let k = startChunk; k <= endChunk; k++) {
      if (k < 0) continue;
      ensureMasterChunkExists(k);
      const chunkBottomOffset = k * MASTER_CHUNK_H;
      const relBottom = bottomY - chunkBottomOffset;
      const destY = MASTER_CHUNK_H - relBottom - drawH;
      masterCtxs[k].drawImage(srcCanvas, 0, Math.max(0, srcY - 0.6), cropW, drawH, 0, destY, cropW, drawH);
    }
  }

  const frameCanvas = document.createElement("canvas");
  frameCanvas.width = cropW;
  frameCanvas.height = h;
  const fCtx = frameCanvas.getContext("2d", { willReadFrequently: true });
  fCtx.imageSmoothingEnabled = true;
  fCtx.imageSmoothingQuality = "high";

  let currentBottomY = 0;
  const timeToYMap = [];

  await seekVideoElementTo(vidElem, tStart);
  if (cancelGenerationRequested) return { hasData: false, chunks: [] };

  fCtx.drawImage(vidElem, srcX1, 0, srcCropW, rawH, 0, 0, cropW, h);
  let prevFrameData = new Uint8ClampedArray(fCtx.getImageData(0, 0, cropW, h).data);
  let prevValidTime = vidElem.currentTime;

  if (bottomBaseH > 0) {
    drawSliceToMaster(frameCanvas, capY, bottomBaseH, 0);
    currentBottomY += bottomBaseH;
  }
  timeToYMap.push({ time: prevValidTime, bottomY: currentBottomY });

  let lastDrawnSliceH = nominalStepPx;

  for (let step = 1; step <= totalSteps; step++) {
    if (cancelGenerationRequested) break;

    const targetTime = Math.min(tEnd, tStart + step * dt);
    await seekVideoElementTo(vidElem, targetTime);
    if (cancelGenerationRequested) break;

    const actualTime = vidElem.currentTime;
    const realDt = actualTime - prevValidTime;

    if (realDt > 0.001) {
      fCtx.drawImage(vidElem, srcX1, 0, srcCropW, rawH, 0, 0, cropW, h);

      // 最初の数秒もスキップせず、実際に進んだ時間 realDt に固定速度を掛けた移動ピクセル量 actualDy を漏れなく切り出す
      const actualDy = Math.min(capY - topSafeY, realDt * speedPxPerSec);
      if (actualDy >= 0.5) {
        const sy = Math.max(topSafeY, capY - actualDy);
        drawSliceToMaster(frameCanvas, sy, actualDy, currentBottomY);
        currentBottomY += actualDy;
        lastDrawnSliceH = actualDy;
        prevValidTime = actualTime;
        timeToYMap.push({ time: actualTime, bottomY: currentBottomY });
      }
    }

    if (onStepProgress && (step % 8 === 0 || step === totalSteps)) {
      onStepProgress(step / totalSteps, actualTime, tEnd);
      await new Promise((r) => setTimeout(r, 0));
    }
  }

  // 最終フレームの上部領域（topSafeY 〜 capY - lastDrawnSliceH）を描画して完結させる
  let finalTopCapH = 0;
  if (!cancelGenerationRequested) {
    const topCapH = Math.max(0, (capY - lastDrawnSliceH) - topSafeY);
    if (topCapH > 0) {
      drawSliceToMaster(frameCanvas, topSafeY, topCapH, currentBottomY);
      currentBottomY += topCapH;
      finalTopCapH = topCapH;
    }
  }

  frameCanvas.width = 0;
  frameCanvas.height = 0;

  if (cancelGenerationRequested) {
    for (const mc of masterChunks) {
      mc.width = 0;
      mc.height = 0;
    }
    return { hasData: false, chunks: [] };
  }

  const totalHeight = Math.max(100, Math.round(currentBottomY));

  if (blackBgToggle.checked && masterChunks.length > 0) {
    for (let k = 0; k < masterChunks.length; k++) {
      if (cancelGenerationRequested) break;
      applyBlackBackgroundFilter(masterCtxs[k], cropW, MASTER_CHUNK_H);
    }
  }

  const actualLastTime = timeToYMap.length > 0 ? timeToYMap[timeToYMap.length - 1].time : tEnd;

  return {
    hasData: masterChunks.length > 0 && !cancelGenerationRequested,
    cropW: cropW,
    totalHeight: totalHeight,
    bottomBaseH: bottomBaseH,
    topCapH: finalTopCapH,
    chunks: masterChunks,
    tStart: tStart,
    tEnd: actualLastTime,
    timeToYMap: timeToYMap,
    sourceLabel: sourceName
  };
}

function renderMasterDataToTempCanvas(mData) {
  const { cropW, totalHeight, chunks } = mData;
  const colMaxH = Math.max(400, parseInt(colHeightInput.value, 10) || 5400);
  const mode = layoutMode.value;
  const numCols = Math.max(1, Math.ceil(totalHeight / colMaxH));
  const colGap = 14;
  const headerH = 36;

  const MAX_DIM = 14000;
  const MAX_AREA = 60000000;
  const tempC = document.createElement("canvas");

  function drawCol(targetCtx, c, destX, destY) {
    targetCtx.fillStyle = "#000000";
    targetCtx.fillRect(destX, destY, cropW, colMaxH);
    const colBottomStart = c * colMaxH;
    const colBottomEnd = Math.min(totalHeight, colBottomStart + colMaxH);
    if (colBottomEnd <= colBottomStart) return;
    const startChunk = Math.floor(colBottomStart / MASTER_CHUNK_H);
    const endChunk = Math.floor((colBottomEnd - 1) / MASTER_CHUNK_H);
    for (let k = startChunk; k <= endChunk; k++) {
      if (k < 0 || k >= chunks.length) continue;
      const chunkBottomStart = k * MASTER_CHUNK_H;
      const overlapBottom = Math.max(colBottomStart, chunkBottomStart);
      const overlapTop = Math.min(colBottomEnd, chunkBottomStart + MASTER_CHUNK_H);
      const copyH = overlapTop - overlapBottom;
      if (copyH <= 0) continue;
      const srcY = MASTER_CHUNK_H - (overlapBottom - chunkBottomStart) - copyH;
      const dstY = destY + (colMaxH - (overlapBottom - colBottomStart) - copyH);
      targetCtx.drawImage(chunks[k], 0, srcY, cropW, copyH, destX, dstY, cropW, copyH);
    }
  }

  if (mode === "single") {
    const rawW = cropW;
    const rawH = totalHeight;
    const renderScale = Math.min(
      1,
      MAX_DIM / Math.max(1, rawW),
      MAX_DIM / Math.max(1, rawH),
      Math.sqrt(MAX_AREA / Math.max(1, rawW * rawH))
    );
    tempC.width = Math.max(1, Math.round(rawW * renderScale));
    tempC.height = Math.max(1, Math.round(rawH * renderScale));
    const ctx = tempC.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.fillStyle = "#000000";
    ctx.fillRect(0, 0, tempC.width, tempC.height);
    ctx.save();
    ctx.scale(renderScale, renderScale);
    for (let c = 0; c < numCols; c++) {
      drawCol(ctx, c, 0, totalHeight - (c + 1) * colMaxH);
    }
    ctx.restore();
  } else {
    const rawW = numCols * cropW + (numCols + 1) * colGap;
    const rawH = colMaxH + headerH + colGap * 2;
    const renderScale = Math.min(
      1,
      MAX_DIM / Math.max(1, rawW),
      MAX_DIM / Math.max(1, rawH),
      Math.sqrt(MAX_AREA / Math.max(1, rawW * rawH))
    );
    tempC.width = Math.max(1, Math.round(rawW * renderScale));
    tempC.height = Math.max(1, Math.round(rawH * renderScale));
    const ctx = tempC.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.save();
    ctx.scale(renderScale, renderScale);
    ctx.fillStyle = blackBgToggle.checked ? "#05070b" : "#161c2e";
    ctx.fillRect(0, 0, rawW, rawH);
    for (let c = 0; c < numCols; c++) {
      const x = colGap + c * (cropW + colGap);
      const y = headerH + colGap;
      ctx.fillStyle = "#00e6e6";
      ctx.font = "bold 15px 'Segoe UI', 'Meiryo', sans-serif";
      ctx.fillText(`列 ${c + 1} / ${numCols}`, x + 6, headerH - 4);
      drawCol(ctx, c, x, y);
      ctx.strokeStyle = "#2b3856";
      ctx.lineWidth = 2;
      outCtxStroke(ctx, x, y, cropW, colMaxH);
    }
    ctx.restore();
  }
  return tempC;
}

function outCtxStroke(ctx, x, y, w, h) {
  ctx.strokeRect(x, y, w, h);
}

async function generateChartImage(isTestMode = false) {
  if (!video.videoWidth || isGenerating) return;
  video.pause();
  const prevMuted = video.muted;
  video.muted = true;
  cancelGenerationRequested = false;

  const startWallTime = performance.now();
  setGeneratingLock(true);
  progressContainer.style.display = "block";
  progressPercent.textContent = "0%";
  progressBar.style.width = "0%";
  progressText.textContent = "譜面を合成準備中...";

  try {
    const label = activeFolderName || (activeVideoName ? activeVideoName.replace(/\.[^.]+$/, "") : "生成譜面");
    const resultData = await buildMasterDataForVideoElement(
      video,
      label,
      isTestMode,
      (ratio, exactTime, tEnd) => {
        if (cancelGenerationRequested) return;
        const pct = Math.min(100, Math.round(ratio * 100));
        progressPercent.textContent = `${pct}%`;
        progressBar.style.width = `${pct}%`;
        progressText.textContent = `高精度フレーム同期合成中... (${exactTime.toFixed(1)}秒 / ${tEnd.toFixed(1)}秒)`;
      }
    );

    if (resultData.hasData && !cancelGenerationRequested) {
      if (masterChartData.hasData) {
        releaseMasterChunks(masterChartData);
      }
      masterChartData = resultData;
      if (activeFolderName && folderGroups.has(activeFolderName)) {
        const grp = folderGroups.get(activeFolderName);
        grp.images = [{ name: `${activeFolderName}_譜面.png`, file: null, url: null, masterData: resultData }];
      }
      await rebuildLayoutFromMaster(!isTestMode);
      progressPercent.textContent = "100%";
      progressBar.style.width = "100%";
      const elapsedSec = ((performance.now() - startWallTime) / 1000).toFixed(1);
      progressText.textContent = `譜面静止画の作成とフォルダへの自動保存が完了しました（処理時間: ${elapsedSec}秒）`;
    } else if (cancelGenerationRequested) {
      progressText.textContent = "静止画の生成を停止しました";
    }
  } catch (err) {
    progressText.textContent = `エラーが発生しました: ${err.message || err}`;
  } finally {
    video.muted = prevMuted;
    shouldRestartFromBeginning = true;
    await seekVideoElementTo(video, 0);
    seekSlider.value = 0;
    currentTimeLabel.textContent = `0.00 秒 / ${(video.duration || 0).toFixed(2)} 秒`;
    setGeneratingLock(false);
    renderTopSwitcher();
    drawPreview(true);
    drawPlayheadOverlay();
  }
}

async function processMultipleVideosConcurrently() {
  if (isGenerating) return;
  const vidEntries = getUnprocessedVideoEntries();
  if (vidEntries.length === 0) return;

  video.pause();
  cancelGenerationRequested = false;
  const startWallTime = performance.now();
  setGeneratingLock(true);
  progressContainer.style.display = "block";
  progressPercent.textContent = "0%";
  progressBar.style.width = "0%";

  const progressMap = new Float32Array(vidEntries.length);
  function updateBatchProgressUI() {
    if (cancelGenerationRequested) return;
    let sum = 0;
    for (let i = 0; i < progressMap.length; i++) sum += progressMap[i];
    const pct = Math.min(100, Math.round((sum / vidEntries.length) * 100));
    progressPercent.textContent = `${pct}%`;
    progressBar.style.width = `${pct}%`;
    progressText.textContent = `未作成の複数動画 (${vidEntries.length}本) を同時処理中... (${pct}%)`;
  }

  const concurrency = Math.min(2, vidEntries.length);
  let cursor = 0;
  let completedCount = 0;
  let firstCompletedFolder = "";

  async function worker() {
    while (cursor < vidEntries.length && !cancelGenerationRequested) {
      const idx = cursor++;
      const { videoEntry, folderName } = vidEntries[idx];
      const tempVid = document.createElement("video");
      tempVid.playsInline = true;
      tempVid.muted = true;
      const srcUrl = videoEntry.file ? URL.createObjectURL(videoEntry.file) : videoEntry.url;
      tempVid.src = srcUrl;
      tempVid.load();

      await new Promise((resolve) => {
        tempVid.onloadedmetadata = resolve;
        tempVid.onerror = resolve;
      });

      if (tempVid.videoWidth && !cancelGenerationRequested) {
        const mData = await buildMasterDataForVideoElement(
          tempVid,
          folderName,
          false,
          (ratio) => {
            progressMap[idx] = ratio;
            updateBatchProgressUI();
          }
        );
        if (mData.hasData && !cancelGenerationRequested) {
          progressMap[idx] = 1.0;
          updateBatchProgressUI();
          completedCount++;
          if (!firstCompletedFolder) firstCompletedFolder = folderName;

          const grp = folderGroups.get(folderName);
          if (grp) {
            grp.images = [{
              name: `${folderName}_譜面.png`,
              file: null,
              url: null,
              masterData: mData
            }];
          }

          const tempOutC = renderMasterDataToTempCanvas(mData);
          await autoSaveCanvasToFolder(folderName, tempOutC);
          tempOutC.width = 0;
          tempOutC.height = 0;
        }
      }

      if (videoEntry.file) URL.revokeObjectURL(srcUrl);
      tempVid.src = "";
    }
  }

  try {
    const workers = [];
    for (let w = 0; w < concurrency; w++) workers.push(worker());
    await Promise.all(workers);

    const elapsedSec = ((performance.now() - startWallTime) / 1000).toFixed(1);
    if (cancelGenerationRequested) {
      progressText.textContent = `同時処理を停止しました（完了分 ${completedCount} フォルダ / ${elapsedSec}秒）`;
    } else {
      progressPercent.textContent = "100%";
      progressBar.style.width = "100%";
      progressText.textContent = `未作成だった全 ${completedCount} フォルダの同時処理と自動保存が完了しました（処理時間: ${elapsedSec}秒）`;
    }
  } finally {
    shouldRestartFromBeginning = true;
    if (video.src) {
      await seekVideoElementTo(video, 0);
      seekSlider.value = 0;
    }
    setGeneratingLock(false);
    if (firstCompletedFolder && !cancelGenerationRequested) {
      switcherContent.style.display = "block";
      selectFolderSet(firstCompletedFolder);
    } else {
      renderTopSwitcher();
    }
  }
}

const viewerBox = document.getElementById("viewerBox");
const viewerViewport = document.getElementById("viewerViewport");
const zoomLevelLabel = document.getElementById("zoomLevelLabel");
const zoomInBtn = document.getElementById("zoomInBtn");
const zoomOutBtn = document.getElementById("zoomOutBtn");
const fitAllBtn = document.getElementById("fitAllBtn");
const fitHeightBtn = document.getElementById("fitHeightBtn");
const zoom100Btn = document.getElementById("zoom100Btn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const exitFullscreenBtn = document.getElementById("exitFullscreenBtn");
const colJumpBar = document.getElementById("colJumpBar");

let vScale = 1.0;
let vX = 0;
let vY = 0;
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;

function updateViewerTransform() {
  canvasStage.style.transform = `translate3d(${vX}px, ${vY}px, 0) scale(${vScale})`;
  zoomLevelLabel.textContent = `${Math.round(vScale * 100)}%`;
}

function fitViewerAll() {
  if (!outputCanvas.width || !outputCanvas.height) return;
  const vw = Math.max(200, viewerViewport.clientWidth);
  const vh = Math.max(200, viewerViewport.clientHeight);
  vScale = Math.min((vw - 20) / outputCanvas.width, (vh - 20) / outputCanvas.height, 1.5);
  vX = Math.max(10, (vw - outputCanvas.width * vScale) / 2);
  vY = Math.max(10, (vh - outputCanvas.height * vScale) / 2);
  updateViewerTransform();
}

function fitViewerHeight() {
  if (!outputCanvas.height) return;
  const vh = Math.max(200, viewerViewport.clientHeight);
  vScale = (vh - 20) / outputCanvas.height;
  vX = 10;
  vY = 10;
  updateViewerTransform();
}

function zoomAtCenter(factor) {
  const vw = viewerViewport.clientWidth;
  const vh = viewerViewport.clientHeight;
  const cx = vw / 2;
  const cy = vh / 2;
  const newScale = Math.min(4.0, Math.max(0.05, vScale * factor));
  const ratio = newScale / vScale;
  vX = cx - (cx - vX) * ratio;
  vY = cy - (cy - vY) * ratio;
  vScale = newScale;
  updateViewerTransform();
}

function setupViewerAfterGenerate(numCols) {
  colJumpBar.innerHTML = `<span style="font-size:0.82rem; color:#9aa5b8; white-space:nowrap;">列へジャンプ:</span>`;
  if (chartMeta.mode === "grid" && numCols > 1 && chartMeta.colRects && chartMeta.colRects.length > 1) {
    colJumpBar.style.display = "flex";
    for (let c = 0; c < numCols; c++) {
      const btn = document.createElement("button");
      btn.className = "btn btn-secondary";
      btn.style.padding = "4px 10px";
      btn.style.fontSize = "0.8rem";
      btn.style.whiteSpace = "nowrap";
      btn.textContent = `${c + 1}列目`;
      btn.addEventListener("click", () => {
        const rect = chartMeta.colRects[c] || chartMeta.colRects[0];
        vScale = Math.min(1.2, Math.max(0.4, viewerViewport.clientWidth / (rect.w * 2.2)));
        vX = 30 - rect.x * vScale;
        vY = 10;
        updateViewerTransform();
      });
      colJumpBar.appendChild(btn);
    }
  } else {
    colJumpBar.style.display = "none";
  }

  requestAnimationFrame(() => {
    fitViewerAll();
  });
}

viewerViewport.addEventListener("dblclick", (e) => {
  if (isGenerating || !video.src || !outputCanvas.width) return;
  const rect = viewerViewport.getBoundingClientRect();
  const canvasX = (e.clientX - rect.left - vX) / vScale;
  const canvasY = (e.clientY - rect.top - vY) / vScale;

  let clickedBottomY = 0;
  const { colMaxH, totalHeight, colRects } = chartMeta;

  if (chartMeta.mode === "single" || !colRects || colRects.length <= 1) {
    const r = (colRects && colRects[0]) ? colRects[0] : { x: 0, y: 0, w: outputCanvas.width, h: outputCanvas.height };
    const ratio = Math.max(0, Math.min(1, 1 - (canvasY - r.y) / Math.max(1, r.h)));
    clickedBottomY = ratio * totalHeight;
  } else {
    let bestCol = 0;
    let minDist = Infinity;
    for (let c = 0; c < colRects.length; c++) {
      const cr = colRects[c];
      const center = cr.x + cr.w * 0.5;
      const d = Math.abs(canvasX - center);
      if (d < minDist) {
        minDist = d;
        bestCol = c;
      }
    }
    const cr = colRects[bestCol];
    const relRatio = Math.max(0, Math.min(1, 1 - (canvasY - cr.y) / Math.max(1, cr.h)));
    clickedBottomY = bestCol * colMaxH + relRatio * colMaxH;
  }

  const offsetSec = parseFloat(playheadOffsetInput.value) || 0;
  const targetTime = getTimeForBottomY(clickedBottomY) - offsetSec;
  video.currentTime = Math.max(0, Math.min(video.duration || targetTime, targetTime));
});

zoomInBtn.addEventListener("click", () => zoomAtCenter(1.25));
zoomOutBtn.addEventListener("click", () => zoomAtCenter(0.8));
fitAllBtn.addEventListener("click", fitViewerAll);
fitHeightBtn.addEventListener("click", fitViewerHeight);
zoom100Btn.addEventListener("click", () => { vScale = 1.0; vX = 10; vY = 10; updateViewerTransform(); });

function setViewerFullscreen(enable) {
  if (enable) {
    viewerBox.classList.add("fullscreen");
    fullscreenBtn.textContent = "全画面を閉じる (Esc)";
  } else {
    viewerBox.classList.remove("fullscreen");
    fullscreenBtn.textContent = "全画面表示";
  }
  setTimeout(fitViewerAll, 50);
}

fullscreenBtn.addEventListener("click", () => {
  setViewerFullscreen(!viewerBox.classList.contains("fullscreen"));
});

exitFullscreenBtn.addEventListener("click", () => {
  setViewerFullscreen(false);
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && viewerBox.classList.contains("fullscreen")) {
    setViewerFullscreen(false);
  }
});

viewerViewport.addEventListener("wheel", (e) => {
  e.preventDefault();
  const rect = viewerViewport.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.15 : 0.87;
  const newScale = Math.min(4.5, Math.max(0.05, vScale * factor));
  const ratio = newScale / vScale;
  vX = mx - (mx - vX) * ratio;
  vY = my - (my - vY) * ratio;
  vScale = newScale;
  updateViewerTransform();
}, { passive: false });

viewerViewport.addEventListener("mousedown", (e) => {
  if (e.target === exitFullscreenBtn) return;
  isDragging = true;
  dragStartX = e.clientX - vX;
  dragStartY = e.clientY - vY;
  viewerViewport.classList.add("dragging");
});
window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  vX = e.clientX - dragStartX;
  vY = e.clientY - dragStartY;
  updateViewerTransform();
});
window.addEventListener("mouseup", () => {
  isDragging = false;
  viewerViewport.classList.remove("dragging");
});

    const files = [];
    const prefix = activeFolderName || "Proseka_Chart";
    const fullPngBytes = await canvasToUint8Array(outputCanvas);
    if (fullPngBytes.length > 0) {
      files.push({ name: `00_${prefix}_全体一覧.png`, data: fullPngBytes });
    }

    if (masterChartData.hasData) {
      const { cropW, totalHeight } = masterChartData;
      const colMaxH = Math.max(400, parseInt(colHeightInput.value, 10) || 5400);
      const numCols = Math.max(1, Math.ceil(totalHeight / colMaxH));
      const tmpColC = document.createElement("canvas");
      tmpColC.width = cropW;
      tmpColC.height = colMaxH;
      const tmpColCtx = tmpColC.getContext("2d");

      for (let c = 0; c < numCols; c++) {
        drawColumnFromMaster(tmpColCtx, c, colMaxH, 0, 0);
        const colBytes = await canvasToUint8Array(tmpColC);
        if (colBytes.length > 0) {
          const num = String(c + 1).padStart(2, "0");
          files.push({ name: `${prefix}_分割列_${num}.png`, data: colBytes });
        }
      }
      tmpColC.width = 0;
      tmpColC.height = 0;
    }

    const zipBlob = createZipBlob(files);
    downloadBlob(zipBlob, `${prefix}_Images.zip`);
  } finally {
    downloadResultZipBtn.disabled = false;
    downloadResultZipBtn.textContent = "全体＋分割画像をZIPで保存";
  }
});
</script>
</body>
</html>
